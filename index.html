<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PWA / Standalone mode - hides browser URL bar when opened from home screen -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reliv Health" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Transcity Font (used on Splash page) -->
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/transcity" />
    
    <!-- KIOSK SECURITY: Prevent caching of sensitive data -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="referrer" content="no-referrer" />
    
    <!-- KIOSK SECURITY: Disable text selection (optional, prevents copy/paste) -->
    <style>
      /* Kiosk mode - prevent text selection on entire page while allowing vertical scroll */
      html, body {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        touch-action: pan-y;
        overscroll-behavior-y: auto;
      }
      /* But allow text selection in input fields */
      input, textarea {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
      }
      /* Mobile entry page: undo all kiosk restrictions */
      .mobile-entry-page, .mobile-entry-page * {
        -webkit-user-select: auto !important;
        -moz-user-select: auto !important;
        -ms-user-select: auto !important;
        user-select: auto !important;
        -webkit-touch-callout: default !important;
      }
      .mobile-entry-page input, .mobile-entry-page textarea {
        -webkit-user-select: text !important;
        user-select: text !important;
      }
    </style>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Kiosk event restrictions are installed and cleaned up by the route-aware
         React guards. Permanent bootstrap handlers break phone payment windows,
         copying and navigation after switching from a kiosk route. -->

    <title>Reliv Health Kiosk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

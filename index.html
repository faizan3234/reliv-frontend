<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Transcity Font (used on Splash page) -->
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/transcity" />
    
    <!-- KIOSK SECURITY: Prevent caching of sensitive data -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- KIOSK SECURITY: Disable text selection (optional, prevents copy/paste) -->
    <style>
      /* Kiosk mode - prevent text selection on entire page */
      body {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        /* Disable pull-to-refresh on mobile */
        overscroll-behavior: none;
      }
      /* But allow text selection in input fields */
      input, textarea {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
      }
      /* Hide scrollbars for cleaner kiosk look */
      ::-webkit-scrollbar {
        display: none;
      }
      body {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    
    <!-- KIOSK SECURITY: Early blocking of dangerous actions before React loads -->
    <script>
      // Block right-click globally (even before React mounts)
      document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; }, true);
      
      // Block keyboard shortcuts globally
      document.addEventListener('keydown', function(e) {
        const key = e.key?.toLowerCase();
        
        // Block F-keys
        if (e.key && e.key.startsWith('F') && !isNaN(e.key.substring(1))) {
          e.preventDefault();
          return false;
        }
        
        // Block Ctrl/Cmd shortcuts
        if (e.ctrlKey || e.metaKey) {
          // Block Zoom (+, -, 0)
          if (['=', '-', '0', '+'].includes(key)) {
            e.preventDefault();
            return false;
          }
          
          var blockedKeys = ['t','n','w','r','l','d','h','j','u','s','p','o','g','f','a','c','v','x'];
          if (blockedKeys.includes(key) || e.shiftKey) {
            e.preventDefault();
            return false;
          }
        }
        
        // Block Alt+Tab, Alt+F4
        if (e.altKey && ['tab','f4'].includes(key)) {
          e.preventDefault();
          return false;
        }
      }, true);
      
      // Block Mouse Wheel Zoom (Ctrl + Wheel)
      document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });

      // Block Pinch-to-zoom (touch gestures)
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // Block window.open before any script can use it
      window._originalOpen = window.open;
      window.open = function() { console.log('[KIOSK] window.open blocked'); return null; };
      
      // Block drag and drop
      document.addEventListener('dragstart', function(e) { e.preventDefault(); return false; }, true);
      document.addEventListener('drop', function(e) { e.preventDefault(); return false; }, true);
    </script>
    
    <title>Reliv Health Kiosk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

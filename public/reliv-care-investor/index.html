const foodSeed=[{id:1,type:'Breakfast',title:'Oats with banana, milk and almonds',cal:420,protein:18,carbs:65,fat:11,fiber:8,emoji:'🥣',time:'08:30 AM'},{id:2,type:'Lunch',title:'Rice, chicken curry and salad',cal:620,protein:38,carbs:74,fat:19,fiber:5,emoji:'🍛',time:'01:15 PM'},{id:3,type:'Snack',title:'Greek yogurt and honey',cal:180,protein:12,carbs:21,fat:6,fiber:1,emoji:'🥛',time:'04:40 PM'},{id:4,type:'Dinner',title:'Roti, dal and paneer',cal:300,protein:14,carbs:50,fat:12,fiber:6,emoji:'🍲',time:'08:10 PM'}];

const ingredients=[{name:'Curd',icon:'🥣',cal:98,protein:10},{name:'Garlic',icon:'🧄',cal:4,protein:.2},{name:'Banana',icon:'🍌',cal:105,protein:1.3},{name:'Honey',icon:'🍯',cal:64,protein:0},{name:'Peanut Butter',icon:'🥜',cal:95,protein:4},{name:'Paneer',icon:'🧀',cal:132,protein:9},{name:'Oats',icon:'🥣',cal:152,protein:5},{name:'Milk',icon:'🥛',cal:150,protein:8},{name:'Chia Seeds',icon:'🌱',cal:60,protein:2},{name:'Whey Protein',icon:'💪',cal:120,protein:24}];
const defaultState=()=>({mode:null,flow:'welcome',name:'Faizan',age:22,gender:'male',height:176,weight:68,target:75,goal:'gain',diet:'nonveg',mealTimes:{breakfast:'08:30',lunch:'13:15',dinner:'20:00'},kiosk:false,plan:'fitness',tab:'data',top:'dashboard',stage:'logging',streak:12,reminders:false,largeText:false,consumed:{cal:1520,protein:82,carbs:210,fat:48,fiber:20,water:1200},foodLog:structuredClone(foodSeed),days:structuredClone(seedDays),vitals:{bp:'118/76',spo2:98,pulse:72,temp:36.6},pantry:['Banana','Oats','Milk','Whey Protein'],shake:['Milk','Whey Protein','Peanut Butter'],reportOpen:0,goalStarted:68,activity:25,chat:[{role:'ai',text:'Hi! I can log food, water and weight, help plan meals, explain reports, or build recipes. What would you like to do?'}],mealExpanded:'Breakfast',shop:'bots',bot:'reminder',adDays:3,adVenue:'IEM Gurukul',adLength:10,adPlacement:'Idle screens',adMedia:null,adPreview:null,orderCount:0,profileImage:null,skipToScanner:false});

const niceGoal=()=>({gain:'Gain weight',lose:'Lose weight',maintain:'Maintain weight',wellness:'Feel healthier',skin:'Skin wellness'}[state.goal]||'Gain weight');
const targetFor=k=>{let w=state.weight, g=state.gender==='female'?-160:5;let base=10*w+6.25*state.height-5*state.age+g, maint=Math.round(base*1.4/10)*10;let cal=maint+(state.goal==='gain'?250:state.goal==='lose'?-350:0);return {cal:Math.max(1400,Math.round(cal/10)*10),protein:Math.round((state.goal==='gain'?1.8:state.goal==='lose'?1.6:1.4)*w),carbs:Math.round(Math.max(120,cal*.52/4)),fat:Math.round(cal*.28/9),water:Math.round((w*35)/100)*100,fiber:30}[k]};
const target=k=>state.manualTargets?.[k]||targetFor(k);
const today=()=>state.stage==='day1'?{cal:0,protein:0,carbs:0,fat:0,fiber:0,water:0}:state.stage==='end'?{cal:2860,protein:140,carbs:395,fat:92,fiber:28,water:2100}:state.consumed;
const stamp=()=>new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch{}}
function makeToast(msg,undo){const box=$('toast');box.innerHTML=`<div class="toast"><span>${safe(msg)}</span>${undo?'<button onclick="undoLast()">Undo</button>':''}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>box.innerHTML='',5000)}
function rememberUndo(){lastUndo=JSON.stringify({consumed:state.consumed,foodLog:state.foodLog,weight:state.weight,days:state.days,vitals:state.vitals,activity:state.activity})}
function undoLast(){if(!lastUndo)return;let old=JSON.parse(lastUndo);Object.assign(state,old);lastUndo=null;persist();render();makeToast('Entry reversed')}
function modeFit(){return state.mode==='fitness'||state.mode==='combined'}
function modeKiosk(){return state.mode==='combined'||state.mode==='kiosk'}
function ring(value,total,color){let p=percent(value,total);return `<span class="ring" style="--p:${p};--c:${color||'var(--orange)'}" data-p="${p}%" aria-label="${p}% of target"></span>`}
function metric(icon,title,value,sub,pair,color){return `<div class="metric"><div class="metricHead"><span class="ico">${icon}</span><span>${title}</span></div><div class="row between"><div style="min-width:0"><div class="metricNum">${value}</div><small>${sub||''}</small></div>${pair?ring(pair[0],pair[1],color):''}</div></div>`}
function head(){const header=$('header');const intro=state.mode===null;header.innerHTML=`<div class="logo"><span>Re</span>liv</div><div class="headerActions">${intro&&/Android/i.test(navigator.userAgent)?'<button class="install" onclick="installApp()">⬇ Install</button>':''}${intro?'':`<button class="pitchBtn" onclick="startInvestorTour()" aria-label="Start investor walkthrough">▶ Tour</button><button class="logBtn" onclick="openLog()">＋ Log</button><button class="avatar" onclick="go('me')" aria-label="Open profile">${safe(state.name.trim().split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()||'RC')}</button>`}</div>`}
function nav(){const labels=[['data','⌂','Data'],['diary','▤','Diary'],['scan','⌗','Scan'],['ai','✧','AI'],['me','♙','Me']];$('nav').innerHTML=labels.map(([id,icon,label])=>`<button class="${state.tab===id?'active ':''}${id==='scan'?'scanMiddle':''}" onclick="go('${id}')"><span class="navIcon">${icon}</span><span>${label}</span></button>`).join('');}
function render(){document.body.classList.toggle('largeText',!!state.largeText);head();nav();const content=state.mode===null?welcome():state.tab==='data'?dataScreen():state.tab==='diary'?diaryScreen():state.tab==='scan'?scanScreen():state.tab==='ai'?aiScreen():meScreen();$('main').innerHTML=content;persist();renderInvestorTour();}
function go(tab){if(state.mode===null&&tab!=='scan'){if(tab==='me'){startSetup();return;}state.tab='scan';state.mode='payment';}if(state.mode==='payment'&&tab!=='scan'&&tab!=='me'){makeToast('Set up your health to unlock fitness');state.tab='me'}else state.tab=tab;state.top='dashboard';render();window.scrollTo(0,0)}
function welcome(){return `<div class="screen"><div style="margin:13px 0 2px"><h1 style="font-size:32px;letter-spacing:-1.3px;line-height:1.15">Your health,<br><span style="color:var(--orange)">made simple.</span></h1><p class="sub" style="font-size:14px;margin-top:9px">Pay at a kiosk in seconds, or build a healthier routine at your own pace.</p></div><div class="heroStage" aria-label="Illustration of a health kiosk connecting to a mobile dashboard"><div class="heroGlow"></div><div class="heroDevice"><div class="heroDeviceHeader">RELIV KIOSK <span>●</span></div><div class="heroQr"><i></i><i></i><i></i><i></i><b>▦</b></div><div class="heroDeviceFoot">One scan. Your health.</div></div><div class="heroConnect"><span>↗</span><small>Scan & sync</small></div><div class="heroApp"><div class="heroAppTop">Reliv <span>♥</span></div><div class="heroAppText">My Health</div><div class="heroAppValue">68.0 kg</div><div class="heroAppBars"><span></span><span></span><span></span><span></span><span></span></div><div class="heroAppFoot">Goals · Progress · Reports</div></div></div><button class="btn w100" style="height:59px;font-size:17px" onclick="startScanOnly()">▣ &nbsp; Scan & Pay</button><p class="sub" style="text-align:center;margin-top:-8px">No registration or fitness setup needed.</p><button class="btn w100 outline" style="height:56px;font-size:16px" onclick="startSetup()">♙ &nbsp; Set up my health</button><p class="sub" style="text-align:center;margin-top:-8px">Track meals, goals, weight and kiosk health readings.</p><div class="investorCTA"><div class="pitchEyebrow">Reliv Care · Investor walkthrough</div><div class="pitchHeadline">One health companion. Multiple real-world journeys.</div><p class="sub">See how one app supports kiosk payments, everyday fitness, and continuous health history—without separate apps.</p><div class="pitchFeatures"><div class="pitchFeature"><b>①</b>Scan only</div><div class="pitchFeature"><b>②</b>Fitness at home</div><div class="pitchFeature"><b>③</b>Fitness + kiosk</div></div><button class="btn w100" style="height:49px" onclick="startInvestorTour()">▶ Start 3-minute investor tour</button><p class="hint" style="margin-top:8px">All values are fictional. No real payment or medical service will run.</p></div><div class="card noShadow"><div class="row between"><span class="sectionTitle">Preview every experience</span><span class="tinyPill">Demo</span></div><div class="grid2" style="margin-top:10px"><button class="btn sm secondary" onclick="switchPersona('fitness')">Fitness only</button><button class="btn sm secondary" onclick="switchPersona('combined')">Fitness + kiosk</button></div></div></div>`}
function startScanOnly(){state.mode='payment';state.tab='scan';render()}
function startSetup(){modal={type:'setup',step:0,data:{name:state.name,age:state.age,gender:state.gender,height:state.height,weight:state.weight,target:state.target,goal:state.goal,diet:state.diet,kiosk:state.kiosk,plan:state.plan,...state.mealTimes}};drawModal()}
function switchPersona(m){if(m==='payment')scanMode='payment';state.mode=m;state.kiosk=(m==='combined'||m==='kiosk');state.plan=(m==='fitness'?'fitness':'complete');state.tab=m==='payment'?'scan':'data';state.top='dashboard';state.stage='logging';render();makeToast(({payment:'Scan-only experience',fitness:'Fitness-only experience',combined:'Fitness and kiosk experience',kiosk:'Kiosk health experience'})[m]+' loaded')}
function dataScreen(){let c=today();let body=`<div class="row between"><div><div class="sub">Good morning,</div><h1 class="pageTitle">${safe(state.name)} 👋</h1><p class="sub">Stay consistent, better days ahead!</p></div><div class="tinyPill" style="font-size:12px;padding:10px">🔥 ${state.streak} day streak</div></div>`;
const k=modeKiosk();let eta=estimatedWeeks();body+=`<div class="goalBox"><div class="row between"><strong style="font-size:14px">${state.goal==='gain'?'Gain to':state.goal==='lose'?'Lose to':'Target'} ${fmt(state.target)} kg</strong><button class="btn ghost sm" onclick="openGoal()">Edit</button></div><div class="bar" style="margin:9px 0"><span class="fill" style="width:${percent(Math.max(.1,Math.abs(state.weight-state.goalStarted)),Math.max(1,Math.abs(state.target-state.goalStarted)))}%"></span></div><div class="row between"><small>Current: ${fmt(state.weight)} kg</small><small>Target: ${fmt(state.target)} kg</small></div><small style="display:block;margin-top:8px;color:var(--orange)">${eta}</small></div>`;
const tabs=k?['Dashboard','Charts','Recipe','Health Reports','Daily Reports']:['Dashboard','Charts','Recipe','Daily Reports'];body+=`<div class="topTabs">${tabs.map(t=>`<button class="${state.top===t.toLowerCase().replace(/\s+/g,'-')?'active':''}" onclick="changeTop('${t.toLowerCase().replace(/\s+/g,'-')}')">${t}</button>`).join('')}</div>`;
if(state.top==='charts')return `<div class="screen">${body}${chartsScreen()}</div>`;if(state.top==='recipe')return `<div class="screen">${body}${recipeScreen()}</div>`;if(state.top==='daily-reports')return `<div class="screen">${body}${dailyReportsScreen()}</div>`;if(state.top==='health-reports')return `<div class="screen">${body}${healthReportsScreen()}</div>`;
body+=`<div class="row between"><h2 class="sectionTitle">${k?'Health & wellness':'Today’s nutrition'}</h2><button class="btn ghost sm" onclick="state.top='charts';render()">See charts ›</button></div>`;
let measuredMetrics='',loggedMetrics='',derivedMetrics='';
if(k){measuredMetrics+=metric('🩺','Blood pressure',state.vitals.bp,'Sample kiosk reading · mmHg')+metric('🫁','Oxygen (SpO₂)',state.vitals.spo2+'%','Sample kiosk reading')+metric('💗','Heart rate',state.vitals.pulse+' bpm','Sample kiosk reading')+metric('🌡️','Temperature',state.vitals.temp+'°C','Sample kiosk reading');}
if(modeFit()){loggedMetrics+=metric('🔥','Calories',fmt(c.cal),'of '+fmt(target('cal'))+' kcal',[c.cal,target('cal')])+metric('🥩','Protein',fmt(c.protein)+' g','of '+target('protein')+' g',[c.protein,target('protein')]);loggedMetrics+=metric('🌾','Carbs',fmt(c.carbs)+' g','of '+target('carbs')+' g',[c.carbs,target('carbs')],'#ffb33a')+metric('🫒','Fats',fmt(c.fat)+' g','of '+target('fat')+' g',[c.fat,target('fat')]);loggedMetrics+=metric('💧','Water',fmt(c.water/1000)+' L','of '+fmt(target('water')/1000)+' L',[c.water,target('water')],'#369dea')+metric('🌿','Fiber',fmt(c.fiber)+' g','of '+target('fiber')+' g',[c.fiber,target('fiber')],'#33ac7c');}
derivedMetrics+=metric('⚖️','Current weight',fmt(state.weight)+' kg','Sample user / latest log')+metric('📊','BMI',(state.weight/(state.height/100)**2).toFixed(1),'Calculated from height + weight');
if(k){body+=`<div class="metricGroup"><div class="dataGroupHead"><strong class="metricGroupTitle">🩺 Kiosk readings</strong><span class="measured">Measured · sample</span></div><p class="groupSource">The real app displays verified device readings with dates and sources. This demo uses fictional values.</p><div class="metricGrid">${measuredMetrics}</div></div>`}
if(modeFit()){body+=`<div class="metricGroup"><div class="dataGroupHead"><strong class="metricGroupTitle">🍽️ Food & fitness</strong><span>Logged · sample</span></div><p class="groupSource">Nutrition totals update when meals and water are logged. All food quantities are examples.</p><div class="metricGrid">${loggedMetrics}</div></div>`}
body+=`<div class="metricGroup"><div class="dataGroupHead"><strong class="metricGroupTitle">⚖️ Weight & calculated metrics</strong><span class="estimated">Calculated / logged</span></div><div class="metricGrid">${derivedMetrics}</div></div>`;
if(k){body+=`<div class="card"><div class="row between"><strong>🧬 Body composition</strong><span class="tag">Example smart scale</span></div><p class="hint" style="margin:8px 0">Illustrative values from an optional smart-scale concept—not from Reliv kiosk sensors, age, height or weight. No body-composition measurement is available without a compatible device.</p><div class="grid3"><div>${metric('💪','Muscle mass','52.4 kg','Demo')}</div><div>${metric('🧈','Body fat','20.5%','Demo')}</div><div>${metric('🫀','Visceral fat','7','Demo')}</div></div><div class="grid2" style="margin-top:8px">${metric('💦','Body water','56%','Demo')}${metric('🕒','Metabolic age','24 yrs','Demo')}</div></div>`}
if(modeFit()){const completed=['cal','protein','carbs','fat','water','fiber'].filter(x=>percent(c[x],target(x))>=80).length;body+=`<button class="card" style="text-align:left;width:100%;background:linear-gradient(110deg,#fff0e6,#fff);border-color:#ffdfc8" onclick="openDailySummary()"><div class="row between"><div><strong>🎯 Day progress</strong><p class="sub" style="margin-top:5px">${percent(c.cal,target('cal'))}% of calorie goal logged · ${percent(c.protein,target('protein'))}% protein goal</p></div>${ring(Math.round((percent(c.cal,target('cal'))+percent(c.protein,target('protein')))/2),100)}</div></button>`}
return `<div class="screen">${body}</div>`}
function changeTop(t){state.top=t;render()}
function estimatedWeeks(){if(state.goal==='maintain')return 'Maintain your current healthy range';const diff=Math.abs(state.target-state.weight);if(diff<.1)return 'Target reached 🎉';return `Estimated: ~${Math.ceil(diff/.4)}–${Math.ceil(diff/.25)} weeks · illustrative`}
function scenarioMeals(){if(state.stage==='day1')return [];if(state.stage==='end')return [...state.foodLog,{id:'demo-extra-snack',type:'Snack',title:'Evening homemade recovery shake',cal:540,protein:24,carbs:85,fat:14,fiber:2,emoji:'🥤',time:'06:30 PM'},{id:'demo-extra-dinner',type:'Dinner',title:'Rice, paneer curry, dal and curd',cal:800,protein:34,carbs:100,fat:30,fiber:6,emoji:'🥘',time:'08:45 PM'}];return state.foodLog}
function visibleDays(){if(state.stage==='end')return [...state.days.slice(0,-1),{...state.days.at(-1),cal:2860,protein:140,carbs:395,fat:92,water:2100,fiber:28}];return state.days}
function dairyGroups(){return ['Breakfast','Lunch','Snack','Dinner'].map(group=>{const entries=scenarioMeals().filter(x=>x.type===group);let tcal=entries.reduce((s,x)=>s+x.cal,0),tpr=entries.reduce((s,x)=>s+x.protein,0);return `<details class="foodOptions" ${state.mealExpanded===group?'open':''} ontoggle="handleMealToggle(event,'${group}')"><summary><div class="row"><span style="font-size:22px">${{Breakfast:'🌤️',Lunch:'🍲',Snack:'🥤',Dinner:'🌙'}[group]}</span><div><strong>${group}</strong><small style="display:block">${tcal} kcal · ${tpr} g protein</small></div></div><span style="color:#7e8794">⌄</span></summary>${entries.length?entries.map(e=>`<div class="meal"><div class="foodIcon">${e.emoji||'🍽️'}</div><div class="mealText"><b>${safe(e.title)}</b><small>${e.cal} kcal · ${e.protein} g protein · ${safe(e.time||'')}</small></div><button class="copy" onclick="editFood(${e.id})">Edit</button></div>`).join(''):'<p class="sub">Nothing recorded yet. Add a meal when you are ready.</p>'}<button class="btn sm secondary w100" style="margin-top:10px" onclick="openFood('${group}')">＋ Add ${group.toLowerCase()}</button></details>`}).join('')}
function handleMealToggle(e,group){if(e.target.open)state.mealExpanded=group}
function diaryScreen(){if(state.mode==='payment')return paymentWelcome();let c=today();const count=['cal','protein','carbs','fat','water','fiber'].filter(k=>percent(c[k],target(k))>=80).length;let pct=percent(count,6);let glasses=Math.min(8,Math.round(c.water/250));return `<div class="screen"><div class="row between"><div><h1 class="pageTitle">Diary</h1><p class="sub">Friday, 30 October · My food & water</p></div><button class="btn sm secondary" onclick="openDailySummary()">Day summary ›</button></div><div class="card"><div class="row between"><div><strong>Today's progress</strong><p class="sub">${percent(c.cal,target('cal'))}% of calorie goal · ${percent(c.protein,target('protein'))}% protein</p></div>${ring(Math.round((percent(c.cal,target('cal'))+percent(c.protein,target('protein')))/2),100)}</div><div class="grid3" style="margin-top:14px">${[['🔥','Calories',fmt(c.cal),fmt(target('cal'))],['🥩','Protein',c.protein+'g',target('protein')+'g'],['🌾','Carbs',c.carbs+'g',target('carbs')+'g']].map(x=>`<div style="text-align:center;background:#fafbfc;border-radius:12px;padding:10px 3px"><div style="font-size:12px">${x[0]} ${x[1]}</div><strong style="display:block;font-size:16px;margin-top:5px">${x[2]}</strong><small>of ${x[3]}</small></div>`).join('')}</div></div><div class="card water"><div class="row between"><div class="row"><span style="font-size:25px">💧</span><div><strong>Water</strong><p class="sub">${fmt(c.water)} / ${fmt(target('water'))} ml</p></div></div><span class="tag blue">${percent(c.water,target('water'))}%</span></div><div class="glasses">${Array.from({length:8},(_,i)=>`<div class="glass"><span style="height:${i<glasses?'85%':'0%'}"></span></div>`).join('')}</div><div class="row between" style="margin-top:12px"><button class="btn sm outline" onclick="logWater(-250)">− 250 ml</button><button class="btn sm" onclick="logWater(250)">＋ 250 ml</button><button class="btn sm secondary" onclick="logWater(500)">＋ 500 ml</button></div></div><div class="row between"><h2 class="sectionTitle">Meals today</h2><button class="btn sm" onclick="openFood()">＋ Add meal</button></div>${dairyGroups()}<div class="card"><div class="row between"><strong>🏋️ Activity & check-ins</strong><button class="btn sm secondary" onclick="openLog()">＋ Log</button></div><p class="sub" style="margin-top:7px">${state.activity} minutes of activity · ${fmt(state.weight)} kg latest weight</p></div></div>`}
function chartsScreen(){let v=visibleDays();let display=[...v];return `<div class="screen"><div class="row between"><div><h2 class="tabHeading">Your progress</h2><p class="sub">Changes over time · last 5 days</p></div><span class="tinyPill">Sample history</span></div>${lineChart('⚖️ Weight trend',display.map(x=>x.weight),'kg','#ff7012')}${modeKiosk()?lineChart('🩺 Blood pressure', [119,117,121,120,118].map((v,i)=>i===4?parseInt(state.vitals.bp):v),'mmHg','#e9743c')+lineChart('🫁 Oxygen saturation', [98,97,98,99,state.vitals.spo2],'%','#1d9bdf'):''}${barGraph('🔥 Calories eaten',display.map(x=>x.cal),target('cal'),'kcal')}${barGraph('🥩 Protein eaten',display.map(x=>x.protein),target('protein'),'g')}</div>`}
function lineChart(title,values,unit,color){const low=Math.min(...values),high=Math.max(...values),diff=Math.max(high-low,1),pts=values.map((v,i)=>`${14+i*72},${128-(v-low)/diff*91}`).join(' ');return `<div class="chartBox"><div class="row between"><strong>${title}</strong><small>${fmt(values.at(-1))} ${unit}</small></div><svg viewBox="0 0 320 155" role="img" aria-label="${title}"><line x1="12" y1="130" x2="305" y2="130" stroke="#e8edf1"/><line x1="12" y1="80" x2="305" y2="80" stroke="#eef1f3"/><line x1="12" y1="30" x2="305" y2="30" stroke="#eef1f3"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>${values.map((v,i)=>`<circle cx="${14+i*72}" cy="${128-(v-low)/diff*91}" r="4" fill="white" stroke="${color}" stroke-width="2.5"/>`).join('')}${state.days.map((v,i)=>`<text x="${14+i*72}" y="149" font-size="10" text-anchor="middle" fill="#8a919c">${v.date.slice(4)}</text>`).join('')}</svg><p class="hint">Demo history. We never infer a weight trend from one reading.</p></div>`}
function barGraph(title,values,max,unit){return `<div class="chartBox"><div class="row between"><strong>${title}</strong><small>Daily target ${fmt(max)} ${unit}</small></div><div class="barChart">${values.map((v,i)=>`<div class="barCol"><b style="font-size:10px;color:#3e4858">${fmt(v)}</b><div class="vbar" style="height:${Math.max(7,Math.min(95,percent(v,max)))}px"></div><span>${state.days[i].date}</span></div>`).join('')}</div></div>`}
function recipeScreen(){const pantry=new Set(state.pantry);const chosen=new Set(state.shake);const calc=ingredients.filter(i=>chosen.has(i.name));const cal=calc.reduce((a,b)=>a+b.cal,0),protein=calc.reduce((a,b)=>a+b.protein,0);const matches=[{name:'Power banana oat shake',items:['Banana','Oats','Milk'],cal:407,protein:14.3},{name:'Protein recovery shake',items:['Whey Protein','Milk','Banana'],cal:375,protein:33.3},{name:'Peanut banana bulking shake',items:['Peanut Butter','Banana','Milk'],cal:350,protein:13.3},{name:'High-protein curd bowl',items:['Curd','Oats','Honey'],cal:314,protein:15},{name:'Paneer energy snack',items:['Paneer','Garlic'],cal:136,protein:9.2}];let found=matches.filter(x=>x.items.every(y=>pantry.has(y)));return `<div class="screen"><div><h2 class="tabHeading">🥣 Kitchen Mode</h2><p class="sub">Tick what you have. Reliv suggests recipes that use those ingredients.</p></div><div class="card"><div class="row between"><strong>What's in your kitchen?</strong><span class="tinyPill">${pantry.size} selected</span></div><div class="ingrid" style="margin-top:12px">${ingredients.map(i=>`<label class="ing"><input type="checkbox" ${pantry.has(i.name)?'checked':''} onchange="toggleIngredient('pantry','${i.name}',this.checked)"><span>${i.icon} ${i.name}</span></label>`).join('')}</div></div><div class="card"><strong>💪 Anabolic Shake Builder</strong><p class="sub" style="margin:5px 0 12px">Choose your shake ingredients and see the estimated nutrition.</p><div class="ingrid">${ingredients.map(i=>`<label class="ing"><input type="checkbox" ${chosen.has(i.name)?'checked':''} onchange="toggleIngredient('shake','${i.name}',this.checked)"><span>${i.icon} ${i.name}<small style="display:block">${i.cal} kcal · ${fmt(i.protein)} g</small></span></label>`).join('')}</div><div class="recipeResult" style="margin-top:12px"><div class="row between"><strong>My homemade shake</strong><span class="tinyPill">Estimate</span></div><div class="grid2" style="margin:11px 0"><div><small>Calories</small><div style="font-size:23px;font-weight:800">${cal} kcal</div></div><div><small>Protein</small><div style="font-size:23px;font-weight:800">${fmt(protein)} g</div></div></div><p class="sub">Blend the selected suitable ingredients, add water or milk as preferred, then adjust serving quantities. Nutrition shown is a simple demo ingredient sum.</p><button class="btn w100" style="margin-top:12px" onclick="logShake()">＋ Log this shake</button></div></div><div class="card"><div class="row between"><strong>🍽️ Matching recipes</strong><span class="tinyPill">${found.length} available</span></div><div class="gap" style="margin-top:12px">${(found.length?found:matches).map((x,i)=>`<div class="row between" style="padding:12px;background:#fafbfc;border-radius:12px"><div><strong style="font-size:12px">${safe(x.name)}</strong><p class="sub">${x.items.join(' · ')} · ~${x.cal} kcal</p></div><button class="btn sm secondary" onclick="showRecipe('${x.name}')">View</button></div>`).join('')}</div></div></div>`}
function toggleIngredient(k,name,checked){let v=new Set(state[k]);if(checked)v.add(name);else v.delete(name);state[k]=[...v];render()}
function logShake(){const chosen=ingredients.filter(i=>state.shake.includes(i.name));if(!chosen.length)return makeToast('Choose ingredients first');if(state.stage==='day1')state.stage='logging';rememberUndo();let e={id:Date.now(),type:'Snack',title:'Homemade shake ('+chosen.map(x=>x.name).join(', ')+')',emoji:'🥤',time:stamp(),cal:chosen.reduce((a,b)=>a+b.cal,0),protein:Math.round(chosen.reduce((a,b)=>a+b.protein,0)),carbs:40,fat:12,fiber:4};state.foodLog.push(e);sumAdded(e);render();makeToast('Shake added to Diary',true)}
function showRecipe(name){let r=[...ingredients].filter(i=>state.pantry.includes(i.name));openSheet('recipe', {name,items:r.map(x=>x.name).slice(0,5)})}
function dailyReportsScreen(){const entries=visibleDays();return `<div class="screen"><div class="row between"><div><h2 class="tabHeading">Daily fitness reports</h2><p class="sub">Five days, tap any one for complete details</p></div><span class="tinyPill">5 days</span></div>${entries.map((r,i)=>{const pc=percent(r.cal,target('cal')),pp=percent(r.protein,target('protein'));return `<details class="dayCard" ${state.reportOpen===i?'open':''} ontoggle="reportToggled(event,${i})"><summary><span style="height:29px;width:29px;background:#fff0e6;color:#d95e0b;border-radius:50%;display:grid;place-items:center;font-weight:850;font-size:12px">${i+1}</span><span style="flex:1;min-width:0"><strong>Day ${i+1}</strong><small style="display:block">${r.date}</small></span><span class="tag ${pc>90?'green':pc<65?'':'blue'}">${pc>90&&pp>90?'Great day!':pc>75?'On track':pc>60?'Keep going':'A lighter day'}</span><span style="font-size:13px;color:#758090">⌄</span></summary><div class="dayNums"><span>🔥 Calories<b>${fmt(r.cal)}</b><small>${pc}%</small></span><span>🥩 Protein<b>${r.protein} g</b><small>${pp}%</small></span><span>💧 Water<b>${fmt(r.water/1000)} L</b><small>${percent(r.water,target('water'))}%</small></span><span>🌿 Fiber<b>${r.fiber} g</b><small>${percent(r.fiber,target('fiber'))}%</small></span></div><div style="margin-top:12px"><div class="grid2">${[['Carbs',r.carbs+' g'],['Fats',r.fat+' g'],['Weight',r.weight+' kg'],['Day score',Math.round((pc+pp+percent(r.water,target('water')))/3)+'/100']].map(([n,v])=>`<div style="background:#f8f9fa;border-radius:9px;padding:9px"><small>${n}</small><strong style="display:block;font-size:13px">${v}</strong></div>`).join('')}</div><p class="sub" style="margin-top:11px">${pc>=95?'You met your energy goal. Keep your routine consistent.':pc<65?'One lighter day does not erase your progress.':'You made progress. Review protein and hydration for tomorrow.'}</p></div></details>`}).join('')}</div>`}
function reportToggled(e,i){if(e.target.open)state.reportOpen=i}
function healthReportsScreen(){let items=[['🩺','Blood pressure',state.vitals.bp+' mmHg','Latest scan · tap for report'],['🫁','SpO₂',state.vitals.spo2+'%','Oxygen saturation'],['❤️','Pulse',state.vitals.pulse+' bpm','Heart rate'],['🌡️','Temperature',state.vitals.temp+' °C','Latest reading'],['⚖️','BMI & weight',(state.weight/(state.height/100)**2).toFixed(1)+' · '+state.weight+' kg','Measured and calculated']];return `<div class="screen"><div><h2 class="tabHeading">Health reports</h2><p class="sub">Kiosk readings, history and explanations</p></div>${items.map((r,i)=>`<div class="card row between"><div class="row"><span style="font-size:24px">${r[0]}</span><div><strong style="font-size:13px">${r[1]}</strong><p class="sub">${r[2]}</p><small>${r[3]}</small></div></div><button class="btn sm secondary" onclick="viewHealthReport(${i})">Open ›</button></div>`).join('')}${lineChart('⚖️ Last five weigh-ins',state.days.map(x=>x.weight),'kg','#ff720e')}<div class="kioskNotice">All values are fictional examples. Actual reports require an authorized health-data QR transfer; no inference from an unrelated QR.</div></div>`}
function viewHealthReport(i){openSheet('health-report',{index:i})}
function openDailySummary(){openSheet('summary')}
function scanScreen(){const payment=scanMode==='payment';return `<div class="screen"><div><h1 class="pageTitle">${payment?'Scan & Pay':'Scan kiosk health QR'}</h1><p class="sub">${payment?'Point your camera at the payment QR on a Reliv kiosk.':'Scan an authorized Reliv health QR to import your readings.'}</p></div><div class="topTabs"><button onclick="scanMode='payment';render()" class="${payment?'active':''}">💳 Payment QR</button><button onclick="scanMode='health';render()" class="${payment?'':'active'}">🩺 Health QR</button></div><div class="scanner"><div class="scannerFrame"></div><div id="scanVisual"><div class="scannerIcon">▦</div><div style="font-size:12px">Place QR inside the frame</div></div><video id="scanVideo" autoplay muted playsinline style="display:none"></video></div><button class="btn w100" onclick="startCamera()">📷 Open camera scanner</button><button class="btn secondary w100" onclick="simulateScan()">Try a sample ${payment?'payment':'health'} QR</button><div class="card"><div class="scanSteps"><span>①<br>Scan kiosk QR</span><span>②<br>${payment?'Preview checkout':'Import readings'}</span><span>③<br>View result</span></div></div>${state.mode==='payment'?`<div class="card"><div class="row between"><div><strong>Want health tracking too?</strong><p class="sub">Optional, takes about a minute.</p></div><button class="btn sm outline" onclick="startSetup()">Set up ›</button></div></div>`:modeKiosk()?`<div class="card"><div class="row between"><strong>Latest health measurements</strong><span class="tag green">Demo data</span></div><div class="grid2" style="margin-top:10px">${metric('⚖️','Weight',state.weight+' kg','Imported')}${metric('🩺','BP',state.vitals.bp,'Latest')}${metric('🫁','SpO₂',state.vitals.spo2+'%','Latest')}${metric('❤️','Pulse',state.vitals.pulse+' bpm','Latest')}</div></div>`:''}<div class="kioskNotice">Camera scanning is a local preview. No live checkout, payment authorization, or kiosk sync is connected. You can safely explore example QR results.</div></div>`}
async function startCamera(){if(cameraStream){stopCamera();return;}const video=$('scanVideo');try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera access is unavailable');cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});video.srcObject=cameraStream;video.style.display='block';$('scanVisual').style.display='none';await video.play();makeToast('Camera opened. Use sample QR to test the full flow.');if('BarcodeDetector' in window){const detector=new BarcodeDetector({formats:['qr_code']});const scanLoop=async()=>{if(!cameraStream||!document.contains(video))return;try{const found=await detector.detect(video);if(found?.length){const raw=found[0].rawValue;stopCamera();detectedQR(raw);return}}catch{}window.qrTimeout=setTimeout(scanLoop,500)};scanLoop()}}catch(e){stopCamera();makeToast('Camera unavailable here. Try the sample QR button.')}}
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}clearTimeout(window.qrTimeout);const v=$('scanVideo');if(v){v.style.display='none';v.srcObject=null;}if($('scanVisual'))$('scanVisual').style.display='block'}
function detectedQR(raw){if(typeof raw!=='string'||raw.length>4096)return makeToast('This QR could not be read');if(/^RELIV:HEALTH:/i.test(raw)){scanMode='health';openSheet('qr-result',{mode:'health',sample:false})}else if(/^RELIV:PAY:/i.test(raw)){scanMode='payment';openSheet('qr-result',{mode:'payment',sample:false})}else makeToast('QR is not recognized as an authorized Reliv code')}
function simulateScan(){stopCamera();openSheet('qr-result',{mode:scanMode,sample:true})}
function importKiosk(){rememberUndo();state.vitals={bp:'122/78',spo2:98,pulse:73,temp:36.7};state.weight=68.2;state.kiosk=true;if(state.mode==='fitness')state.mode='combined';if(state.mode==='payment'){state.mode='kiosk';state.plan='complete';}state.days[state.days.length-1].weight=state.weight;state.top='dashboard';state.tab='data';closeSheet();render();makeToast('Sample health readings imported',true)}
function aiScreen(){return `<div class="screen"><div><h1 class="pageTitle">Reliv AI ✨</h1><p class="sub">Chat, speak or share food information. You stay in control of every log.</p></div><div class="card"><div class="chiprow">${['I drank 500ml water','I ate two eggs','What should I eat?','How is my progress?','Set breakfast reminder'].map(x=>`<button onclick="sendAI(${JSON.stringify(x).replace(/"/g,'&quot;')})">${safe(x)}</button>`).join('')}</div></div><div class="chat" id="chatLog">${state.chat.map(m=>`<div class="bubble ${m.role==='user'?'user':'ai'}">${safe(m.text)}</div>`).join('')}</div><div class="card"><div class="field"><label for="chatInput">Ask Reliv or describe what you ate</label><textarea id="chatInput" placeholder="I ate roti, rice and dal for lunch..."></textarea></div><div class="row"><button class="btn sm secondary" style="flex:1" onclick="voiceAI()">🎙️ Voice</button><button class="btn sm secondary" style="flex:1" onclick="photoAI()">📷 Photo</button><button class="btn sm" style="flex:1" onclick="sendAI()">Send ➤</button></div><p class="hint" style="margin-top:11px">The built-in demo understands common food, water, weight and reminder phrases with preset rules. Live AI and image nutrition analysis are not connected.</p></div></div>`}
function sendAI(text){const box=$('chatInput');text=String(text??box?.value??'').trim();if(!text)return;state.chat.push({role:'user',text});const t=text.toLowerCase();let answer='You can log food, water and weight, ask about reports, or change a goal. I can show a demo action.';
let n=/(\d+(?:\.\d+)?)\s*(ml|l|liters?|litres?)/i.exec(text);if(n&&/(water|drank|drink|hydration)/i.test(t)){let ml=Math.round(Number(n[1])*(n[2].toLowerCase()==='ml'?1:1000));logWater(ml,false);answer=`Logged ${ml} ml water. Your water ring and Diary have been updated.`}
else if(/(eggs?|roti|paneer|rice|dal|biryani|food|ate |had |meal)/.test(t)&&/(ate|had|log|add|egg|roti|rice|dal|paneer|biryani)/.test(t)){let match=foods.find(f=>t.includes(f[0].toLowerCase())||f[0].toLowerCase().split(' ').some(w=>w.length>4&&t.includes(w)));if(match){addFoodEntry({title:match[0],cal:match[1],protein:match[2],carbs:match[3],fat:match[4],fiber:match[5],emoji:match[6],type:'Snack'},false);answer=`Added ${match[0]} as a sample estimate: ${match[1]} kcal and ${match[2]} g protein. You can edit it in Diary.`}else answer='I can help record this. Please use + Log Food to choose or adjust the quantities. I won’t invent a precise nutritional value.'}
else if(/weight/.test(t)&&/\d/.test(t)){const m=/(\d+(?:\.\d+)?)/.exec(t);if(m&&Number(m[1])>=20&&Number(m[1])<=300){setWeight(Number(m[1]),false);answer=`Recorded your weight as ${m[1]} kg. Your chart and goal summary have updated.`}}
else if(/remind/.test(t)){answer='I can prepare meal reminders. Enable them from Me → Reminders to control whether notifications are allowed.'}
else if(/progress|week|chart/.test(t)){answer=`Your latest example weight is ${fmt(state.weight)} kg, target ${fmt(state.target)} kg. Open Data → Charts to review the five-day trend.`}
else if(/eat|recipe|dinner/.test(t)){answer='Try rice, dal and paneer or chicken, plus curd if it suits your diet. Open Data → Recipe to build a meal using your ingredients.'}
state.chat.push({role:'ai',text:answer});state.tab='ai';render();makeToast('Reliv AI demo response');}
function voiceAI(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){makeToast('Speech input is not available in this browser');return;}try{const r=new SR();r.lang='en-IN';r.interimResults=false;r.onresult=e=>{const text=e.results[0][0].transcript;sendAI(text)};r.onerror=()=>makeToast('Speech input could not be completed');r.start();makeToast('Listening… speak now')}catch{makeToast('Could not start microphone')}}
function photoAI(){openSheet('photo')}
function meScreen(){return `<div class="screen"><div class="row between"><div><h1 class="pageTitle">Me</h1><p class="sub">Your preferences and personal health</p></div><span class="tinyPill">Sample profile</span></div><div class="card"><div class="row"><div class="avatar" style="width:52px;height:52px;font-size:18px">${safe(state.name.slice(0,2).toUpperCase())}</div><div style="flex:1"><strong>${safe(state.name)}</strong><p class="sub">${state.age} years · ${state.height} cm · ${fmt(state.weight)} kg</p></div><button class="btn sm outline" onclick="openGoal()">Edit</button></div><p class="sub" style="margin-top:10px">${niceGoal()} · target ${fmt(state.target)} kg</p></div><div class="card"><div class="row between"><div><strong>Preview user experiences</strong><p class="sub">One app, different views. Demo data stays saved.</p></div><span class="tinyPill">Demo</span></div><div class="grid2" style="margin-top:12px"><button class="choice ${state.mode==='payment'?'selected':''}" onclick="switchPersona('payment')"><strong>📷 Scan only</strong><small>Payment without health setup</small></button><button class="choice ${state.mode==='fitness'?'selected':''}" onclick="switchPersona('fitness')"><strong>🏋️ Fitness</strong><small>Food, weight, goals</small></button><button class="choice ${state.mode==='combined'?'selected':''}" onclick="switchPersona('combined')"><strong>🩺 Fitness + kiosk</strong><small>Food, fitness, vitals, reports</small></button><button class="choice ${state.mode==='kiosk'?'selected':''}" onclick="switchPersona('kiosk')"><strong>📈 Kiosk history</strong><small>Vitals, weight and reports</small></button></div></div><div class="card gap"><div class="row between"><strong>🎭 Preview timeline</strong><span class="tag">Demo only</span></div><div class="topTabs">${[['day1','Day 1'],['logging','Logging'],['end','End of day']].map(([v,n])=>`<button class="${state.stage===v?'active':''}" onclick="setStage('${v}')">${n}</button>`).join('')}</div><p class="sub">Explore how your numbers and guidance appear before logging, while logging, and at day end.</p></div><div class="card"><div class="sectionTitle">Preferences</div>${[['Goal, height and weight','openGoal()'],['Meal times & food preferences','editMealTimes()'],['Notifications & reminders','editReminders()'],['Shop • Bots, kits & kiosk ads','openShop()'],['More health tools & routines','openExtraTools()'],['Install Reliv on this phone','installApp()'],['Privacy, export & reset demo','openPrivacy()']].map(([title,action])=>`<div class="moreRow" onclick="${action}" role="button" tabindex="0"><span>${title}</span><span style="color:#89909a">›</span></div>`).join('')}<div class="moreRow" onclick="toggleLargeText()" role="button" tabindex="0"><span>Larger, easier-to-read text</span><strong style="color:var(--orange)">${state.largeText?'On':'Off'}</strong></div></div></div>`}
function setStage(stage){state.stage=stage;if(state.mode==='payment')state.mode='fitness';state.tab='data';state.top='dashboard';render();makeToast(({day1:'Day 1: targets only',logging:'Logging: updated intake',end:'End of day: daily summary'})[stage]);}
function toggleLargeText(){state.largeText=!state.largeText;render()}
function openPrivacy(){openSheet('privacy')}
function editReminders(){openSheet('reminders')}
function editMealTimes(){openSheet('meal-times')}
function openGoal(){openSheet('goal')}
function openShop(){openSheet('shop')}
function openExtraTools(){openSheet('extras')}
function logWater(ml,notify=true){if(state.mode==='payment'){makeToast('Set up fitness to track water');return;}rememberUndo();if(state.stage==='day1'||state.stage==='end')state.stage='logging';state.consumed.water=Math.max(0,Math.round((state.consumed.water+ml)/10)*10);state.days.at(-1).water=state.consumed.water;persist();if(notify){render();makeToast(`${ml>0?'+':''}${ml} ml water recorded`,true)}}
function sumAdded(e){for(const k of ['cal','protein','carbs','fat','fiber'])state.consumed[k]=Math.max(0,+(state.consumed[k]+Number(e[k]||0)).toFixed(1));for(const k of ['cal','protein','carbs','fat','fiber'])state.days.at(-1)[k]=state.consumed[k]}
function addFoodEntry(e,notify=true){rememberUndo();if(state.stage==='day1'||state.stage==='end')state.stage='logging';const entry={...e,id:Date.now(),time:stamp(),cal:Number(e.cal||0),protein:Number(e.protein||0),carbs:Number(e.carbs||0),fat:Number(e.fat||0),fiber:Number(e.fiber||0)};state.foodLog.push(entry);sumAdded(entry);persist();if(notify){closeSheet();state.tab='diary';render();makeToast('Meal logged. Your progress updated.',true)}}
function setWeight(w,notify=true){if(!Number.isFinite(w)||w<20||w>300)return makeToast('Please enter a valid weight');rememberUndo();state.weight=+w.toFixed(1);state.days.at(-1).weight=state.weight;if(state.stage==='day1'||state.stage==='end')state.stage='logging';persist();if(notify){closeSheet();render();makeToast('Weight saved. Goal and chart updated.',true)}}
function openLog(){if(state.mode==='payment'){return makeToast('Set up your health to log weight and meals')}openSheet('log')}
function openFood(type=''){openSheet('food',{type:type||'Breakfast'})}
function editFood(id){openSheet('edit-food',{id})}
function installApp(){if(window.installPrompt){window.installPrompt.prompt();return;}if(/iPhone|iPad|iPod/i.test(navigator.userAgent))makeToast('In Safari: Share → Add to Home Screen');else makeToast('In Chrome: menu ⋮ → Install app or Add to Home Screen')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.installPrompt=e});
function openSheet(type,data={}){modal={type,data};drawModal()}
function closeSheet(){stopCamera();modal=null;$('overlay').innerHTML=''}
function drawModal(){if(!modal){$('overlay').innerHTML='';return;}let c=modalContent();$('overlay').innerHTML=`<div class="sheetLayer" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="Reliv interactive form"><div class="sheetHandle"></div><div class="row between" style="margin-bottom:17px"><h2>${c.title}</h2><button class="sheetClose" onclick="closeSheet()" aria-label="Close dialog">✕</button></div><div class="gap">${c.html}</div></section></div>`}
function modalContent(){const {type,data}=modal;
if(type==='setup'){let d=data,step=modal.step||0;return {title:`Set up Reliv · ${step+1} of 2`,html:step===0?`<p class="sub">Tell us a little about yourself. You can change everything later.</p><div class="field"><label>Full name</label><input id="setName" value="${safe(d.name)}" placeholder="Your name"></div><div class="grid2"><div class="field"><label>Age</label><input id="setAge" type="number" min="13" max="110" value="${d.age}"></div><div class="field"><label>Gender</label><select id="setGender"><option value="male" ${d.gender==='male'?'selected':''}>Male</option><option value="female" ${d.gender==='female'?'selected':''}>Female</option><option value="other" ${d.gender==='other'?'selected':''}>Other / prefer not to say</option></select></div><div class="field"><label>Height (cm)</label><input id="setHeight" type="number" min="100" max="230" value="${d.height}"></div><div class="field"><label>Weight (kg)</label><input id="setWeight" type="number" min="20" max="300" step="0.1" value="${d.weight}"></div></div><div class="field"><label>My goal</label><select id="setGoal"><option value="gain" ${d.goal==='gain'?'selected':''}>Gain weight</option><option value="lose" ${d.goal==='lose'?'selected':''}>Lose weight</option><option value="maintain" ${d.goal==='maintain'?'selected':''}>Maintain weight</option><option value="wellness" ${d.goal==='wellness'?'selected':''}>General wellness</option></select></div><div class="field"><label>Target weight (kg)</label><input id="setTarget" type="number" step="0.1" value="${d.target}" min="20" max="300"></div><div class="labelLine">Choose your experience</div><div class="grid2"><button class="choice ${d.plan==='fitness'?'selected':''}" onclick="setupChoice('plan','fitness')"><span style="font-size:25px">🏋️</span><strong>Only Fitness</strong><small>Food, daily intake, goals and charts.</small></button><button class="choice ${d.plan==='complete'?'selected':''}" onclick="setupChoice('plan','complete')"><span style="font-size:25px">❤️</span><strong>Complete Body Track</strong><small>Fitness and optional kiosk health history.</small></button></div><label class="radioText"><input type="checkbox" id="setKiosk" ${d.kiosk?'checked':''}>I have used a Reliv kiosk before</label><button class="btn w100" onclick="nextSetup()">Continue ›</button>`:`<p class="sub">Last step. Choose food preferences and your usual meal times. All optional and editable.</p><div class="field"><label>Eating preference</label><select id="setDiet"><option value="veg" ${d.diet==='veg'?'selected':''}>Vegetarian</option><option value="nonveg" ${d.diet==='nonveg'?'selected':''}>Non-vegetarian</option><option value="eggetarian" ${d.diet==='eggetarian'?'selected':''}>Eggetarian</option><option value="flex" ${d.diet==='flex'?'selected':''}>Flexible / no preference</option></select></div><div class="field"><label>Breakfast</label><input id="setBreakfast" type="time" value="${d.breakfast}"></div><div class="field"><label>Lunch</label><input id="setLunch" type="time" value="${d.lunch}"></div><div class="field"><label>Dinner</label><input id="setDinner" type="time" value="${d.dinner}"></div><div class="kioskNotice">Your dashboard will show the features you selected. Scan is always available and can be used without fitness setup.</div><div class="row"><button class="btn outline" style="flex:1" onclick="modal.step=0;drawModal()">Back</button><button class="btn" style="flex:2" onclick="finishSetup()">Start my health ›</button></div>`};}

if(type==='food'||type==='edit-food'){const old=type==='edit-food'?state.foodLog.find(e=>e.id===data.id):null;const e=old||{};return {title:old?'Edit meal':'Log your food',html:`<div class="field"><label>Choose a recent food</label><select id="foodPreset" onchange="fillFoodPreset(this.value)"><option value="">Write my own food</option>${foods.map((f,i)=>`<option value="${i}">${f[0]}</option>`).join('')}</select></div><div class="field"><label>What did you eat?</label><textarea id="foodName" placeholder="e.g. 2 roti, dal, rice and curd">${safe(e.title||'')}</textarea></div><div class="grid2"><div class="field"><label>Meal</label><select id="foodType">${['Breakfast','Lunch','Snack','Dinner'].map(s=>`<option ${s===(e.type||data.type)?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Portion</label><select id="foodPortion" onchange="foodAdjustPortion()"><option value="1">Normal</option><option value=".5">A little</option><option value="1.5">A lot</option><option value="0">Not sure</option></select></div></div><div class="mutedBox">Demo nutrition estimates only. Exact calories and macros cannot be determined from a food name or photo without verified quantities.</div><details class="foodOptions"><summary>More options · estimated nutrition <span>⌄</span></summary><div class="grid2"><div class="field"><label>Calories</label><input type="number" id="foodCal" value="${e.cal??420}" min="0"></div><div class="field"><label>Protein (g)</label><input type="number" id="foodProtein" value="${e.protein??18}" min="0"></div><div class="field"><label>Carbs (g)</label><input type="number" id="foodCarbs" value="${e.carbs??60}" min="0"></div><div class="field"><label>Fat (g)</label><input type="number" id="foodFat" value="${e.fat??14}" min="0"></div><div class="field"><label>Fiber (g)</label><input type="number" id="foodFiber" value="${e.fiber??5}" min="0"></div></div></details><div class="row"><button class="btn secondary" style="flex:1" onclick="photoAI()" iv><div class="field"><label>Mood</label><select id="exMood"><option>Good</option><option>Okay</option><option>Low energy</option><option>Great</option></select></div></div><button class="btn secondary w100" onclick="state.sleepHours=Number(getVal('exSleep'));state.mood=getVal('exMood');drawModal();makeToast('Sleep and mood recorded')">Save check-in</button></div><div class="card gap"><strong>✨ Skin & wellness</strong><p class="sub">Optional self-care routine — not a medical assessment.</p>${['☀️ Morning SPF','💧 Hydration reminder','🌙 Evening cleanse'].map(x=>`<label class="radioText"><input type="checkbox">${x}</label>`).join('')}</div><button class="btn w100" onclick="closeSheet();state.tab='data';state.top='recipe';render()">Open Kitchen Mode & recipes</button>`};

el>Location</label><select id="adVenue" onchange="state.adVenue=this.value"><option>IEM Gurukul</option><option>Example campus (demo)</option><option>All example venues</option></select></div><div class="grid2"><div class="field"><label>Campaign days</label><input id="adDays" type="number" min="1" max="90" value="${state.adDays}" oninput="updateAdEstimate()"></div><div class="field"><label>Ad length</label><select id="adLength" onchange="updateAdEstimate()"><option>5 seconds</option><option selected>10 seconds</option><option>15 seconds</option></select></div></div><div class="field"><label>Start date</label><input id="adDate" type="date" value="2026-11-02"></div><div class="field"><label>Upload an image or video</label><input type="file" id="adFile" accept="image/*,video/*" onchange="previewAd(this)"></div><div id="adPreview" class="empty" style="min-height:100px">YOUR AD PREVIEW</div><div class="row between"><div><small>Illustrative rate</small><strong id="adPrice" style="display:block;font-size:20px">₹150</strong></div><button class="btn sm" onclick="reviewAd()">Review campaign</button></div><p class="hint">₹50 per day is a placeholder, not a current Reliv quotation. Actual inventory and publication need backend approval.</p></div>`:`<div class="card"><strong>${state.orderCount} demo enquiries</strong><p class="sub" style="margin-top:8px">Your sample enquiries are stored locally in this browser. No real purchases or ad bookings have been submitted.</p></div>`}`};

function getVal(id){return $(id)?.value}
function snapshotSetup(){const d=modal.data;for(const [key,id] of Object.entries({name:'setName',age:'setAge',gender:'setGender',height:'setHeight',weight:'setWeight',target:'setTarget',goal:'setGoal',kiosk:'setKiosk'})){if($(id))d[key]=key==='kiosk'?$(id).checked:['age','height','weight','target'].includes(key)?Number(getVal(id)):getVal(id)}}
function setupChoice(k,v){snapshotSetup();modal.data[k]=v;if(k==='plan'&&v==='fitness')modal.data.kiosk=false;drawModal()}
function nextSetup(){snapshotSetup();const d=modal.data;if(!d.name?.trim()||d.age<13||d.age>110||d.height<100||d.height>230||d.weight<20||d.weight>300||d.target<20||d.target>300)return makeToast('Please check your basic details');modal.step=1;drawModal()}
function finishSetup(){const d=modal.data;d.diet=getVal('setDiet');d.breakfast=getVal('setBreakfast');d.lunch=getVal('setLunch');d.dinner=getVal('setDinner');Object.assign(state,{name:d.name.trim(),age:d.age,gender:d.gender,height:d.height,weight:d.weight,target:d.target,goal:d.goal,kiosk:!!d.kiosk,plan:d.plan,diet:d.diet,mealTimes:{breakfast:d.breakfast,lunch:d.lunch,dinner:d.dinner}});state.mode=d.kiosk?'combined':'fitness';state.goalStarted=d.weight;state.tab='data';state.top='dashboard';state.stage='logging';closeSheet();render();makeToast('Your personal Reliv dashboard is ready')}
function fillFoodPreset(index){if(index==='')return;let f=foods[Number(index)];$('foodName').value=f[0];for(const [id,v] of [['foodCal',f[1]],['foodProtein',f[2]],['foodCarbs',f[3]],['foodFat',f[4]],['foodFiber',f[5]]])$(id).value=v}
function foodAdjustPortion(){if(getVal('foodPortion')==='0')makeToast('Unknown portions should not receive precise macros. Use your best estimate or skip.')}
function saveFood(oldId){const title=getVal('foodName')?.trim();if(!title)return makeToast('Enter what you ate');let scale=Number(getVal('foodPortion'))||1;const e={title,type:getVal('foodType'),emoji:'🍽️',cal:Math.round(Number(getVal('foodCal'))*scale),protein:Math.round(Number(getVal('foodProtein'))*scale),carbs:Math.round(Number(getVal('foodCarbs'))*scale),fat:Math.round(Number(getVal('foodFat'))*scale),fiber:Math.round(Number(getVal('foodFiber'))*scale)};if(getVal('foodPortion')==='0')return makeToast('Unknown portion: choose an estimate or simply record a note; exact macros are not available.');if(Object.values(e).some(x=>typeof x==='number'&&!Number.isFinite(x)))return makeToast('Check the nutrition values');if(oldId){rememberUndo();let old=state.foodLog.find(x=>x.id===oldId);if(!old)return;for(const key of ['cal','protein','carbs','fat','fiber']){state.consumed[key]-=old[key]||0;state.days.at(-1)[key]-=old[key]||0;}Object.assign(old,e);sumAdded(e);closeSheet();render();makeToast('Meal updated',true)}else addFoodEntry(e)}
function deleteFood(id){rememberUndo();const old=state.foodLog.find(x=>x.id===id);if(!old)return;for(const k of ['cal','protein','carbs','fat','fiber']){state.consumed[k]=Math.max(0,state.consumed[k]-old[k]);state.days.at(-1)[k]=state.consumed[k]}state.foodLog=state.foodLog.filter(x=>x.id!==id);closeSheet();render();makeToast('Meal removed',true)}
function voiceFood(){closeSheet();go('ai');voiceAI()}
function customWater(){let x=Number(getVal('waterCustom'));if(!Number.isFinite(x)||x<1||x>5000)return makeToast('Enter an amount between 1 and 5,000 ml');logWater(x);closeSheet();render();makeToast(`${x} ml saved`,true)}
function saveActivity(){const minutes=Number(getVal('activityMinutes'));if(!Number.isFinite(minutes)||minutes<1||minutes>360)return makeToast('Enter a valid number of minutes');rememberUndo();state.activity+=minutes;closeSheet();render();makeToast(`${getVal('activityType')||'Activity'} recorded`,true)}
function saveGoal(){const name=getVal('goalName')?.trim(),age=Number(getVal('goalAge')),height=Number(getVal('goalHeight')),weight=Number(getVal('goalWeight')),target=Number(getVal('goalTarget')),goal=getVal('goalType');if(!name||age<13||age>110||height<100||height>230||weight<20||weight>300||target<20||target>300)return makeToast('Check your profile values');const oldGoal=state.goal;Object.assign(state,{name,age,height,weight,target,goal});if(oldGoal!==goal)state.goalStarted=weight;state.days.at(-1).weight=weight;closeSheet();render();makeToast('Goal saved; targets recalculated')}
function previewPhoto(input){const f=input.files?.[0];if(!f)return;const url=URL.createObjectURL(f);const box=$('photoPreview');box.innerHTML=`<img src="${url}" alt="Selected food photo" style="width:100%;max-height:190px;object-fit:contain;border-radius:12px">`;}
function saveMealTimes(){state.mealTimes={breakfast:getVal('timeBreakfast'),lunch:getVal('timeLunch'),dinner:getVal('timeDinner')};state.diet=getVal('timeDiet');closeSheet();render();makeToast('Meal times saved')}
function saveReminders(){state.reminders=!!$('reminderToggle').checked;closeSheet();render();makeToast(state.reminders?'Preference saved. Push delivery is not connected.':'Reminders remain off')}
function saveEnquiry(){state.orderCount++;state.shop='enquiries';drawModal();makeToast('Demo enquiry saved locally')}
function previewAd(input){const file=input.files?.[0];if(!file)return;const u=URL.createObjectURL(file);$('adPreview').innerHTML=file.type.startsWith('video/')?`<video controls style="width:100%;max-height:190px" src="${u}"></video>`:`<img alt="Your ad preview" src="${u}" style="max-height:190px;max-width:100%;object-fit:contain">`}
function updateAdEstimate(){const days=Math.max(1,Math.min(90,Number(getVal('adDays'))||1));state.adDays=days;state.adLength=Number((getVal('adLength')||'10').split(' ')[0]);if($('adPrice'))$('adPrice').textContent='₹'+fmt(days*50)}
function reviewAd(){const days=Number(getVal('adDays'))||3;let venue=getVal('adVenue')||'IEM Gurukul';openSheet('ad-review',{days,venue})}
const oldModalContent=modalContent;modalContent=function(){if(modal?.type==='ad-review'){const d=modal.data;return {title:'Campaign preview',html:`<div class="card"><strong>Advertise at ${safe(d.venue)}</strong><div class="moreRow">Duration <b>${d.days} days</b></div><div class="moreRow">Estimated demo rate <b>₹${fmt(d.days*50)}</b></div><p class="hint" style="margin-top:11px">This is a planning preview. No payment, advertising slot reservation or media publication has occurred.</p></div><button class="btn w100" onclick="state.orderCount++;closeSheet();makeToast('Demo ad request saved locally')">Save demo ad request</button>`}}return oldModalContent();}
function exportDemo(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='reliv-demo-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);makeToast('Example data exported')}
function resetDemo(){if(!confirm('Reset all demo entries and return to the first-launch screen?'))return;state=defaultState();closeSheet();render();makeToast('Demo reset')}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeSheet()});
window.addEventListener('popstate',()=>{if(modal)closeSheet();else go('data')});

// Investor Edition walkthrough: fully local and explicit about simulated services.
let investorTourStep=-1, investorTourBackup=null;
const investorSteps=[
{title:'Reliv Care: one product, three user journeys',detail:'Begin with Scan & Pay or set up a personal health companion. The same app adapts as users engage.',mode:null,tab:'data'},
{title:'1 · Scan-only: no onboarding required',detail:'A visitor can scan and preview a kiosk payment without creating a fitness profile. Checkout is simulated in this investor preview.',mode:'payment',tab:'scan'},
{title:'2 · Fitness: useful from the first day',detail:'Without ever visiting a kiosk, a user can create a weight goal and see calculated daily targets. No food is recorded on Day 1.',mode:'fitness',tab:'data',top:'dashboard',stage:'day1'},
{title:'3 · Fitness: progress updates in real time',detail:'Sample logs fill the calorie, protein, water and weight cards. The targets remain separate from consumed totals.',mode:'fitness',tab:'data',top:'dashboard',stage:'logging'},
{title:'4 · Diary: log, edit, undo',detail:'Use the water glasses and + Add meal controls. Log something and watch the Data screen update.',mode:'fitness',tab:'diary',stage:'logging'},
{title:'5 · Kitchen mode: make nutrition practical',detail:'Choose ingredients available at home. The shake builder estimates energy and protein from the selected portions.',mode:'fitness',tab:'data',top:'recipe'},
{title:'6 · Five days: proof of daily continuity',detail:'Expand each daily summary. Review calories, protein, water and other logged information without clutter.',mode:'fitness',tab:'data',top:'daily-reports'},
{title:'7 · Kiosk + fitness: a richer relationship',detail:'Reliv adds kiosk BP, oxygen, pulse, temperature and a report history to the same fitness app—no second installation.',mode:'combined',tab:'data',top:'dashboard'},
{title:'8 · Health reports: different from food logs',detail:'Device measurements have their own report area. Body composition is an optional smart-scale concept, clearly marked as unmeasured here.',mode:'combined',tab:'data',top:'health-reports'},
{title:'9 · Reliv AI: guided everyday actions',detail:'Try “I drank 500ml water” or “What should I eat?”. These are local demonstration rules, not a live model.',mode:'combined',tab:'ai'},
{title:'10 · Commercial possibilities',detail:'Explore hardware bot concepts, care kits, and kiosk ad campaign previews. Enquiries, prices and payments shown are illustrative, not verified revenue.',mode:'combined',tab:'me'},
{title:'End · The investment opportunity',detail:'Reliv connects occasional kiosk use with continuing health tracking, while supporting fitness-only users. Pilot traction, device accuracy, retention and revenue must be validated separately.',mode:'combined',tab:'data',top:'dashboard'}
];
function startInvestorTour(){if(investorTourStep!==-1)return investorGo(0);investorTourBackup=JSON.stringify(state);investorGo(0)}
function investorGo(n){
if(n<0||n>=investorSteps.length){endInvestorTour();return}
if(modal)closeSheet();
investorTourStep=n;
const s=investorSteps[n];
if(s.mode===null){state.mode=null;state.tab='data'}
else {state.mode=s.mode;state.kiosk=['combined','kiosk'].includes(s.mode);state.plan=s.mode==='fitness'?'fitness':'complete';state.tab=s.tab;state.top=s.top||'dashboard';state.stage=s.stage||'logging'}
render();window.scrollTo({top:0,behavior:'instant'});
}
function endInvestorTour(){investorTourStep=-1;const bar=$('tourOverlay');if(bar)bar.innerHTML='';if(investorTourBackup){try{state=JSON.parse(investorTourBackup)}catch{}investorTourBackup=null}render();makeToast('Investor tour closed · demo records preserved')}
function renderInvestorTour(){const p=$('tourOverlay');if(!p)return;if(investorTourStep<0){p.innerHTML='';return}const step=investorSteps[investorTourStep];let total=investorSteps.length;
p.innerHTML=`<section class="pitchBar" aria-label="Investor walkthrough step ${investorTourStep+1} of ${total}" role="region"><div class="pitchTop"><span>▶ INVESTOR TOUR</span><span>${investorTourStep+1} / ${total}</span></div><h3>${step.title}</h3><p>${step.detail}</p><div class="pitchProgress"><span style="width:${(investorTourStep+1)*100/total}%"></span></div><div class="pitchButtons"><button class="secondary" onclick="investorGo(${investorTourStep-1})" ${investorTourStep===0?'disabled':''}>Back</button><button class="primary" onclick="${investorTourStep===total-1?'endInvestorTour()':'investorGo('+(investorTourStep+1)+')'}">${investorTourStep===total-1?'Finish tour':'Next screen →'}</button><button class="exit" onclick="endInvestorTour()">Exit</button></div></section>`;
}

render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
</script></body></html>

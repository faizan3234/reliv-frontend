 const pct=Math.min(100,Math.max(0,Math.round((1-Math.abs(target-current)/change)*100)));

 else if((s.goal.type==='gain'&&pace>.05)||(s.goal.type==='loss'&&pace<-.05)){
  const w=Math.abs(target-current)/Math.abs(pace);eta=w<200?`Illustrative trend: about ${Math.round(w)} weeks at your recent pace`:'Longer-term goal — more readings recommended';
 }else if(arr.length>=2)eta='Recent readings do not yet show progress toward this target';

="btn" data-a="sub" data-id="achievements">🔥 Streaks & Milestones</button></div>`}

function parseMeal(desc,p){const t=desc.toLowerCase(),foods=[[/\broti|chapati/,110,3],[/\begg/,75,6],[/\bdal/,185,9],[/\brice/,200,4],[/biryani/,390,14],[/paneer/,260,14],[/chicken/,240,26],[/banana/,100,1],[/milk/,125,8],[/bread|toast/,100,3],[/apple/,95,0],[/curd|yogurt/,115,6],[/sweet|dessert|gulab jamun/,190,3]];let c=0,pr=0,matched=0;for(const [re,kcal,pro] of foods){if(re.test(t)){const rx=new RegExp('(\\d+)\\s*(?:x|pieces?|pcs?)?\\s*'+re.source.replaceAll('\\b',''),'i'),num=rx.exec(t),n=num?Math.min(Number(num[1]),6):1;c+=kcal*n;pr+=pro*n;matched++}}if(!matched)return null;let f={small:.65,normal:1,large:1.5,unknown:1}[p]||1;return{cal:Math.round(c*f),prot:Math.round(pr*f),approx:true}}
function saveMeal(){const desc=q('mealDesc')?.value.trim();if(!desc)return pop('Describe the meal first');const eCal=q('mealCalories').value,ePr=q('mealProtein').value,est=parseMeal(desc,portion);const calories=eCal!==''?+eCal:portion==='unknown'?null:(est?est.cal:null),protein=ePr!==''?+ePr:portion==='unknown'?null:(est?est.prot:null);log('meals',desc,{calories,protein,approx:(eCal===''||ePr===''),portion,desc});rclose();if(calories===null)pop('Meal saved with quantities unknown. No calories invented.');}
function sampleData(){s=initial();s.sample=true;s.initialized=true;s.modules=Object.keys(MODULES);s.custom={creatine:{name:'Creatine',icon:'⚡',unit:'g',desc:'Optional supplement log'}};s.modules.push('creatine');s.goal={type:'gain',target:'75',weight:'65',height:'185',age:'22',diet:'Any',kcal:2600,protein:110,water:2500};const now=Date.now();let ix=0;for(let day=-6;day<=0;day++){let dt=dateN(day),ts=now+(day*86400000);for(const [kind,value,extra] of [['weight',+(65+.22*(day+6)).toFixed(1),{}],['water',1400+150*(day+6),{}],['steps',4400+650*(day+6),{}],['sleep',+(6.6+.13*(day+6)).toFixed(1),{}],['meals','Roti, dal & rice',{calories:1250+140*(day+6),protein:54+7*(day+6),desc:'Roti, dal & rice',approx:false}]] )s.logs.push({id:'s'+(ix++),kind,value,date:dt,ts:ts+(ix*100),source:'Example data',...extra});}s.logs.push({id:'sbp',kind:'bp',sys:122,dia:78,date:today(),ts:now+10000,source:'Example kiosk scan',value:0});s.logs.push({id:'so2',kind:'oxygen',value:98,date:today(),ts:now+15000,source:'Example kiosk scan'});s.logs.push(...[
{id:'demo-heart',kind:'heart',value:74,ts:now+16000,date:today(),source:'Example kiosk scan'},
{id:'demo-temp',kind:'temp',value:36.7,ts:now+17000,date:today(),source:'Example kiosk scan'},

{id:'demo-supplements',kind:'supplements',value:'Vitamin D (example)',ts:now+20000,date:today(),source:'Example entry'},
{id:'demo-creatine',kind:'creatine',value:5,ts:now+21000,date:today(),source:'Example entry'},

{id:'demo-mood',kind:'mood',value:'Feeling good',ts:now+23000,date:today(),source:'Example entry'}]);s.messages=[];save();modal='';screen='main';tab='health';render();pop('All features are available. Sample entries are ready to explore.');}
function aiReply(msg){const t=msg.toLowerCase(),date=t.match(/(?:to|at)\s*(\d{2}(?:\.\d+)?)/),number=t.match(/(\d+(?:\.\d+)?)/);let response='I can help you track and understand your health. Try “Log 500ml water”, “I want to gain weight”, or “Summarize my week”.';if(/creatine|custom|button|tracker/.test(t)){let k=t.includes('creatine')?'Creatine':t.includes('walking')?'Walking minutes':t.includes('meditation')?'Meditation':'My Habit';response=`I can add “${k}” as a tracker. I’ll suggest it below for your confirmation.`;modal='';s.pending={type:'addCustom',name:k,unit:k==='Creatine'?'g':'minutes'}}else if(/walk|step/.test(t)&&/track|create|add/.test(t)){response='Your Walking & Steps tracker is already available. Open it in My Health whenever needed.';s.pending={type:'add',kind:'steps'}}else if(/water|drank/.test(t)&&number){response=`I understood ${number[1]} ml of water. Tap confirm to save it.`;s.pending={type:'water',value:Number(number[1])}}else if(/gain|lose|loss|weight goal|target/.test(t)){response='You can change your goal anytime without deleting previous readings. Tap Set Goal below.';s.pending={type:'goal'}}else if(/week|progress|summary/.test(t)){const recent=s.logs.filter(x=>x.date>=dateN(-6));response=`Over the past seven days, you have ${recent.length} recorded entries. Your latest weight is ${latest('weight')?valText(latest('weight'),'weight'):'not yet recorded'}. Days without logs are not counted as zero. Tap My Week for detailed trends.`;s.pending={type:'week'}}else if(/meal|food|buffet|dawat|wedding/.test(t)){response='Your meal logger is ready. Describe what you remember and choose “Not sure” for unknown portions. Reliv should never invent precise calories.';s.pending={type:'add',kind:'meals'}}else if(/remind|notification/.test(t)){response='Reminders stay off by default. You can turn them on and choose breakfast, lunch and dinner times yourself.';s.pending={type:'reminders'}}else if(/bp|blood pressure/.test(t)){response='Your Blood Pressure tracker is ready under Health & measurements. It shows your saved readings without diagnosing a condition.';s.pending={type:'add',kind:'bp'}}else if(/skincare|skin|acne/.test(t)){response='Your Skin Routine is ready under Skin & personal care. For persistent or severe skin concerns, seek professional assessment.';s.pending={type:'add',kind:'skin'}}else {s.pending=null};return response}
function aiConfirm(){let p=s.pending;if(!p)return; if(p.type==='add')addModule(p.kind);else if(p.type==='water'){if(!s.modules.includes('water'))s.modules.push('water');log('water',p.value);page('health')}else if(p.type==='addCustom'){let k='c'+Date.now();s.custom[k]={name:p.name,icon:'✦',unit:p.unit,desc:'My own tracker'};addModule(k)}else if(p.type==='goal'){modal='goal';renderModal()}else if(p.type==='week'){screen='week';tab='health';render()}else if(p.type==='reminders'){modal='reminders';renderModal()}s.pending=null;save()}
function sendAI(msg){msg=msg||q('chatInput')?.value.trim();if(!msg)return; s.messages.push({who:'me',text:msg});let answer=aiReply(msg);s.messages.push({who:'ai',text:answer});save();render();let el=q('chatwrap');if(el)el.scrollTop=el.scrollHeight}
function camera(){if(scanStream){stopCam();render();return}if(!navigator.mediaDevices?.getUserMedia){pop('Camera not supported here. Use the sample QR flow.');return}navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}).then(stream=>{scanStream=stream;render();let v=q('cam');if(v){v.srcObject=stream;v.play().catch(()=>{})}if('BarcodeDetector' in window){const detect=new BarcodeDetector({formats:['qr_code']});scanTimer=setInterval(async()=>{try{if(v&&v.readyState===4){const codes=await detect.detect(v);if(codes.length){const raw=codes[0].rawValue||'';if(!raw.startsWith('RELIV_HEALTH_DEMO:')){pop('Not a recognized demo health QR');return}stopCam();modal='sampleScan';render()}}}catch(e){}},1100)}else pop('Camera is open. Use the sample import on browsers without QR detection.');}).catch(()=>pop('Camera permission was declined or unavailable.'))}

function getClick(el){const b=el.closest('[data-a]');if(b?.dataset.a==='dismiss'&&!el.classList.contains('modalwrap'))return null;return b?{a:b.dataset.a,id:b.dataset.id,val:b.dataset.val,q:b.dataset.q,idx:b.dataset.index}:null}

document.addEventListener('click',ev=>{const x=getClick(ev.target);if(!x)return;const {a,id,val}=x;if(a==='store'){tab='health';screen='store';modal='';render();return}if(a==='storeCategory'){s.store.category=val;save();render();return}if(a==='quote'){s.store.bot=id;modal='shopQuote';renderModal();return}if(a==='previewAd'){const days=Number(q('adDays')?.value||0);if(!Number.isInteger(days)||days<1||days>30)return pop('Choose 1 to 30 days');s.store.days=days;s.store.venue=q('adVenue').value;s.store.slot=q('adSlot').value;s.store.start=q('adStart').value;if(!s.store.start)return pop('Choose your start date');s.store.adFile=q('adFile')?.files?.[0]?.name||'';modal='shopAd';save();renderModal();return}if(a==='saveShopRequest'){const type=id==='ads'?'Advertising enquiry':id?.startsWith('kit')?'Health Kit enquiry':'Bot enquiry';const nm=q('buyerName')?.value?.trim()||'';const contact=q('buyerContact')?.value?.trim()||'';if(!nm||!contact)return pop('Enter a name and contact detail');s.store.requests.push({id:'request'+Date.now(),type,product:id,person:nm,contact,date:today(),venue:s.store.venue,days:s.store.days,slot:s.store.slot,start:s.store.start});save();modal='shopDone';renderModal();return}if(a==='page')return page(id);if(a==='back'){screen='main';render();return}if(a==='sub'){screen=id;active='';render();return}if(a==='close'||a==='dismiss')return rclose();if(a==='catalog'){modal='catalog';renderModal();return}if(a==='add')return addModule(id);if(a==='hide'){s.modules=s.modules.filter(k=>k!==id);save();render();pop('Card hidden. Your records remain saved.');return}if(a==='custom'){modal='custom';renderModal();return}if(a==='saveCustom'){let name=q('customName')?.value.trim(),unit=q('customUnit')?.value.trim()||'';if(!name)return pop('Enter a button name');const k='custom'+Date.now();s.custom[k]={name,icon:'✦',unit,desc:'Custom health habit'};addModule(k);return}if(a==='log'){active=id||active;modal='log';portion='normal';renderModal();return}if(a==='details'){active nderModal();if(window._mealDraft)q('mealDesc').value=window._mealDraft;return}if(a==='goal'){goalDraft=s.goal.type;modal='goal';renderModal();return}if(a==='goalSelect'){goalDraft=val;renderModal();return}if(a==='saveGoal'){s.goal.type=q('goalType').value;const cw=+q('goalWeight').value,tw=+q('goalTarget').value;if(cw && (cw<15||cw>350)||tw&&(tw<15||tw>350))return pop('Enter a realistic weight in kg');s.goal.weight=q('goalWeight').value;s.goal.target=s.goal.type==='maintain'&&!tw?(q('goalWeight').value||''):q('goalTarget').value;if(s.goal.type==='gain'&&tw&&cw&&tw<=cw)return pop('For weight gain, choose a target above your current weight');if(s.goal.type==='loss'&&tw&&cw&&tw>=cw)return pop('For weight loss, choose a target below your current weight');s.goal.kcal=+q('goalCal').value||s.goal.kcal;s.goal.protein=+q('goalProt').value||s.goal.protein;s.goal.diet=q('goalDiet').value;save();rclose();render();pop('Goal updated. Your history is unchanged.');return}if(a==='noGoal'){s.goal.type='none';s.goal.target='';save();rclose();render();pop('No goal required. Keep tracking as you prefer.');return}if(a==='daymode'){s.dayMode=val;save();render();return}if(a==='quickwater'){if(!s.modules.includes('water'))s.modules.push('water');log('water',250);render();return}if(a==='reminders'){modal='reminders';renderModal();return}if(a==='saveReminders'){s.prefs.reminders=q('enableReminders').checked;s.prefs.breakfast=q('t-breakfast').value;s.prefs.lunch=q('t-lunch').value;s.prefs.dinner=q('t-dinner').value;s.prefs.water=q('waterRemind').checked;s.prefs.quietStart=q('quietStart').value;s.prefs.quietEnd=q('quietEnd').value;save();rclose();pop(s.prefs.reminders?'Reminder choices saved. Scheduled push needs backend setup.':'All reminder choices disabled.');return}if(a==='askPermission'){if(!s.prefs.reminders)return pop('Enable reminders and save your settings first');if(!('Notification' in window)){pop('This browser does not support web notifications.');return}Notification.requestPermission().then(v=>{s.prefs.notifyStatus=v;save();pop('Device permission: '+v+'. This demo does not schedule background notifications.')}).catch(()=>pop('Permission request unavailable.'));return}if(a==='settings'){modal='settings';renderModal();return}if(a==='savePrefs'){s.prefs.theme=q('theme').value;s.prefs.lang=q('language').value;save();rclose();pop('Settings saved. Full app translation is not included in this demo.');return}if(a==='sampleData')return sampleData();if(a==='sampleScan'){modal='sampleScan';renderModal();return}if(a==='importSample'){[['bp',0,{sys:122,dia:78}],['oxygen',98,{}],['heart',73,{}],['temp',36.7,{}],['weight',66.4,{}]].forEach(([k,v,extra],i)=>{s.logs.push({id:'scan'+Date.now()+i,kind:k,value:v,...extra,date:today(),ts:Date.now()+i,source:'Example health QR'})});save();modal='';page('health');pop('Sample readings imported. All linked health summaries updated.');return}if(a==='camera')return camera();if(a==='prompt'){q('chatInput').value=x.q;q('chatInput').focus();return}if(a==='send'){sendAI();return}if(a==='confirmAI'){aiConfirm();return}if(a==='speak'){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){pop('Voice input unavailable here. You can type instead.');return}let rec=new SR();rec.lang=s.prefs.lang.includes('हिन्दी')?'hi-IN':s.prefs.lang.includes('বাংলা')?'bn-IN':'en-IN';rec.onresult=e=>{const text=e.results[0][0].transcript;q('chatInput').value=text;pop('Transcribed. Tap send when ready.');};rec.onerror=()=>pop('Voice input unavailable right now');rec.start();return}if(a==='audio'){let text=tab==='health'?'My Health. All tracking features are already available in organized sections. Scan health codes using Scan.':tab==='scan'?'Scan your health QR to update your readings.':'Ask Reliv about your health logs and tracking buttons.';try{speechSynthesis.cancel();let sp=new SpeechSynthesisUtterance(text);sp.lang=s.prefs.lang.includes('हिन्दी')?'hi-IN':s.prefs.lang.includes('বাংলা')?'bn-IN':'en-IN';speechSynthesis.speak(sp)}catch(e){pop('Audio guide is not supported here.')}return}if(a==='streakSettings'){s.prefs.streaks=q('showStreak')?.checked||false;save();pop('Preference saved.');return}if(a==='removeLog'){if(!confirm('Delete this entry?'))return;s.logs=s.logs.filter(r=>r.id!==id);save();render();return}if(a==='savePhoto'){const file=q('progressPhoto')?.files?.[0];if(!file)return pop('Select a photo first');if(!file.type.startsWith('image/'))return pop('Please choose an image');let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let canv=document.createElement('canvas'),scale=Math.min(1,700/Math.max(im.width,im.height));canv.width=im.width*scale;canv.height=im.height*scale;canv.getContext('2d').drawImage(im,0,0,canv.width,canv.height);s.photos.push({date:today(),data:canv.toDataURL('image/jpeg',.65)});save();render();pop('Photo saved on this device only.')};im.src=reader.result};reader.readAsDataURL(file);return}if(a==='removePhoto'){s.photos.splice(Number(x.idx),1);save();render();return}if(a==='export'){const b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),link=document.createElement('a');link.href=url;link.download='Reliv_Care_My_Health_'+today()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1500);pop('Data file prepared');return}if(a==='confirmReset'){modal='confirmReset';renderModal();return}if(a==='reset'){s=initial();s.initialized=true;save();modal='';screen='main';tab='health';render();pop('Sample logs erased. All health tools remain ready.');return}});

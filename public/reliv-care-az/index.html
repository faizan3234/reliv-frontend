<body><div class="app" id="app"><header class="top"><div class="brand"><div class="brandlogo">♥</div><div><strong>reliv care</strong><small>Your health, your way</small></div></div><div class="head-actions"><button class="headshop" data-a="store" aria-label="Open Reliv Store">🛍️ <span>Store</span></button><button class="iconbtn" data-a="audio" title="Read screen aloud" aria-label="Read screen aloud">◖))</button><button class="iconbtn" data-a="settings" title="Settings" aria-label="Settings">⚙</button></div></header><main class="content" id="content"></main><nav class="bottom" id="nav" aria-label="Primary navigation"></nav></div><div id="modal"></div><div id="toast"></div><input id="v4-upload" type="file" accept="image/*" hidden>
<script>
(()=>{
'use strict';
const KEY='reliv-all-in-one-preset-v3';
const MODULES={weight:{name:'Weight',icon:'⚖️',unit:'kg',desc:'Home scale, kiosk and your weight goal'},bp:{name:'Blood Pressure',icon:'🩺',unit:'mmHg',desc:'Keep your BP readings together'},heart:{name:'Heart Rate',icon:'❤️',unit:'bpm',desc:'See pulse readings over time'},oxygen:{name:'Oxygen (SpO₂)',icon:'🫁',unit:'%',desc:'Track oxygen saturation readings'},temp:{name:'Body Temperature',icon:'🌡️',unit:'°C',desc:'Record temperature measurements'},meals:{name:'Food & Calories',icon:'🍽️',unit:'kcal',desc:'Simple food logging, protein and buffets'},water:{name:'Water',icon:'💧',unit:'ml',desc:'Log hydration in one tap'},steps:{name:'Walking & Steps',icon:'🚶',unit:'steps',desc:'Daily steps and walks'},exercise:{name:'Exercise',icon:'🏋️',unit:'min',desc:'Gym, walks, yoga or cardio'},sleep:{name:'Sleep',icon:'🌙',unit:'hrs',desc:'Hours slept and sleep patterns'},mood:{name:'Mood',icon:'😊',unit:'check-in',desc:'How you felt each day'},skin:{name:'Skin Routine',icon:'✨',unit:'routine',desc:'Morning and evening skin care'},waist:{name:'Waist',icon:'📏',unit:'cm',desc:'Optional waist measurement'},supplements:{name:'Supplements',icon:'💊',unit:'check-in',desc:'Track what you take'},notes:{name:'Health Journal',icon:'📔',unit:'note',desc:'Private notes and reminders'}};
const initial=()=>({initialized:false,modules:Object.keys(MODULES),custom:{},logs:[],goal:{type:'none',target:'',height:'',age:'',diet:'Any',kcal:2200,protein:90,water:2500,weight:''},prefs:{theme:'light',lang:'English',reminders:false,breakfast:'09:00',lunch:'14:00',dinner:'20:00',water:false,quietStart:'22:00',quietEnd:'07:00',skincare:false,streaks:false,notifyStatus:'off'},messages:[],dayMode:'Normal day',sample:false,photos:[],routine:{},store:{category:'bots',requests:[],bot:'',venue:'IEM Gurukul',days:3,slot:'10',start:''}});
let s;try{s=Object.assign(initial(),JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){s=initial();}s.prefs={...initial().prefs,...s.prefs};s.goal={...initial().goal,...s.goal};s.store={...initial().store,...(s.store||{})};let tab='health',screen='main',modal='',active='',subview='',photoData='',scanStream=null,scanTimer=null,demoQR='',portion='normal',remindType='breakfast',chartDays=7,voiceRec=null,toastTimer=null,goalDraft=s.goal.type;
const getMod=k=>MODULES[k]||s.custom[k]||{name:k,icon:'◉',unit:'',desc:''},els=(tag,cls,html)=>`<${tag} class="${cls}">${html}</${tag}>`,q=id=>document.getElementById(id),safe=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toLocaleDateString('en-CA'),dateN=offset=>{let x=new Date();x.setDate(x.getDate()+offset);return x.toLocaleDateString('en-CA')},fmt=n=>Number(n).toLocaleString('en-IN'),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){pop('Storage is full — export your data or remove large photos.')}};
function log(k,val,extra={}){const rec={id:'r'+Date.now()+Math.random().toString(36).slice(2,5),kind:k,value:val,date:today(),ts:Date.now(),source:'Manual',...extra};s.logs.push(rec);save();pop(`${getMod(k).name} updated`);return rec}
function logs(k){return s.logs.filter(x=>x.kind===k).sort((a,b)=>a.ts-b.ts)}
function latest(k){return logs(k).slice(-1)[0]}
function nowDate(){return new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
function pop(msg){q('toast').innerHTML=`<div class="toast" role="status">${safe(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>q('toast').innerHTML='',3500)}
function btn(name,a,cls='',attrs=''){return `<button class="btn ${cls}" data-a="${a}" ${attrs}>${name}</button>`}function rclose(){modal='';active='';photoData='';render()}
function page(t){tab=t;screen='main';modal='';stopCam();render();window.scrollTo({top:0,behavior:'instant'});}
function nav(){q('nav').innerHTML=[['health','♥','My Health'],['scan','▣','Scan'],['ai','✦','Reliv AI']].map(([id,icon,label])=>`<button data-a="page" data-id="${id}" class="${tab===id?'active':''}" aria-current="${tab===id?'page':'false'}" ><span class="navicon">${icon}</span>${label}</button>`).join('')}
function render(){document.documentElement.classList.toggle('dark',s.prefs.theme==='dark');q('content').innerHTML=screen==='main'?(tab==='health'?health():tab==='scan'?scanner():ai()):subScreen();nav();renderModal();}
function emptyState(){return `<div class="hero"><div style="font-size:31px">♥ +</div><h2>Your health starts here.</h2><p>Choose what you want to track. No setup forms. No unnecessary features.</p>${btn('＋ Add to My Health','catalog')}</div><div class="card stack"><div class="section">Not sure what to add?</div><div class="sub">Start with just one. You can add, hide or change anything later.</div><div class="row wrap">${['bp','weight','meals','water'].map(k=>`<button class="pillbtn" data-a="add" data-id="${k}">${getMod(k).icon} ${getMod(k).name} +</button>`).join('')}</div></div>`}
function weeklyMini(k){const arr=logs(k).filter(r=>typeof r.value==='number').slice(-6);if(arr.length<2)return '';let nums=arr.map(r=>r.value),min=Math.min(...nums),max=Math.max(...nums),rng=Math.max(max-min,1);const points=nums.map((v,i)=>`${12+i* (276/(nums.length-1))},${66-(v-min)/rng*48}`).join(' ');return `<svg viewBox="0 0 300 82" role="img" aria-label="Recent entries trend" class="minichart"><path d="M10 70H290" stroke="#f1dfd2" stroke-width="1"/><polyline points="${points}" fill="none" stroke="#ff7900" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${nums.map((v,i)=>`<circle cx="${12+i*276/(nums.length-1)}" cy="${66-(v-min)/rng*48}" r="4" fill="#fff" stroke="#ff7900" stroke-width="2"/>`).join('')}</svg>`}
function valText(r,k){if(!r)return 'No readings yet';if(k==='bp')return `${r.sys}/${r.dia} mmHg`;if(k==='meals')return `${fmt(sumToday('meals','calories'))} kcal logged`;if(k==='water')return `${fmt(sumToday('water','value'))} ml today`;if(k==='exercise')return `${fmt(sumToday('exercise','value'))} min today`;if(k==='steps')return `${fmt(sumToday('steps','value'))} steps today`;if(k==='skin')return String(r.value);return `${typeof r.value==='number'?fmt(r.value):safe(r.value)}${['weight','heart','oxygen','temp','sleep','waist'].includes(k)?' '+getMod(k).unit:''}`}
function sumToday(k,field){return s.logs.filter(x=>x.kind===k&&x.date===today()).reduce((v,r)=>v+Number(r[field]||0),0)}
function card(k){let m=getMod(k),r=latest(k),count=logs(k).length,unit=m.unit;let goalLine='';if(k==='weight' && s.goal.target && r && typeof r.value==='number')goalLine=`<div class="sub" style="margin:5px 0 9px">Your goal: ${safe(s.goal.target)} kg (${safe(s.goal.type)})</div><div class="progress"><span style="width:${Math.min(100,Math.max(4,Math.round(100-100*Math.abs(Number(s.goal.target)-r.value)/Math.max(Math.abs(Number(s.goal.target)-Number(s.goal.weight||r.value)),1))))}%"></span></div>`;
if(k==='meals'){goalLine=`<div class="grid2"><div class="stat"><strong>${fmt(sumToday('meals','calories'))}</strong><span>calories logged · goal ${fmt(s.goal.kcal)}</span></div><div class="stat"><strong>${fmt(sumToday('meals','protein'))} g</strong><span>protein logged · goal ${fmt(s.goal.protein)} g</span></div></div><div class="hint">${s.logs.some(x=>x.kind==='meals'&&x.date===today()&&x.approx)?'One or more meals are approximate or missing quantities. Totals may be incomplete.':'These are logged totals, not proof of everything eaten.'}</div>`}
if(k==='water')goalLine=`<div class="progress"><span style="width:${Math.min(100,Math.round(sumToday('water','value')/Math.max(s.goal.water,1)*100))}%"></span></div><div class="hint">Your chosen goal: ${fmt(s.goal.water)} ml</div>`;
return `<div class="card stack" data-card="${k}"><div class="row between"><div class="metric-head"><div class="tile-icon">${m.icon}</div><div><div class="section">${safe(m.name)}</div><div class="sub">${count} saved ${count===1?'entry':'entries'}</div></div></div><button class="iconbtn" data-a="hide" data-id="${k}" aria-label="Hide ${safe(m.name)}" title="Hide this card">−</button></div><div class="big" style="font-size:${k==='bp'?30:30}px">${valText(r,k)}</div>${goalLine}${weeklyMini(k)}<div class="row" style="margin-top:2px"><button class="btn sm" style="flex:1" data-a="log" data-id="${k}">＋ ${k==='meals'?'Add Food':k==='water'?'Add Water':'Log'}</button><button class="btn outline sm" style="flex:1" data-a="details" data-id="${k}">History & Details →</button></div></div>`}
function recommend(){let suggest=[];if(s.modules.includes('weight')&&!s.modules.includes('meals'))suggest.push({id:'meals',why:'Tracking weight? Food logs may help you understand your routine.'});if(s.modules.includes('bp')&&!s.modules.includes('heart'))suggest.push({id:'heart',why:'Your readings may also include heart rate.'});if(s.modules.includes('meals')&&!s.modules.includes('water'))suggest.push({id:'water',why:'Want a quick way to remember your water intake?'});if(s.modules.includes('steps')&&!s.modules.includes('sleep'))suggest.push({id:'sleep',why:'Would you like to observe your sleep pattern?'});return suggest.slice(0,1).map(v=>`<div class="recommend"><span class="reco-emoji">✨</span><div style="flex:1"><b style="font-size:13px">Only if you're interested</b><div class="sub">${v.why}</div><button class="link" data-a="add" data-id="${v.id}">＋ Add ${getMod(v.id).name}</button></div></div>`).join('')}
function entryRow(k){const m=getMod(k),r=latest(k);return `<div class="feature-row" data-name="${safe((m.name+' '+m.desc).toLowerCase())}"><button class="feature-main" data-a="details" data-id="${safe(k)}"><span class="feature-emoji">${m.icon}</span><span class="feature-text"><b>${safe(m.name)}</b><small>${r?safe(valText(r,k)):safe(m.desc)}</small></span><span class="feature-arrow">›</span></button><button class="feature-log" data-a="log" data-id="${safe(k)}" aria-label="Log ${safe(m.name)}">Log</button></div>`}
function directoryGroup(icon,title,subtitle,keys,opened=false){return `<details class="tool-group" ${opened?'open':''}><summary><span class="group-icon">${icon}</span><span class="group-title"><b>${title}</b><small>${subtitle}</small></span><span class="group-arrow">⌄</span></summary><div class="group-list">${keys.map(entryRow).join('')}</div></details>`}
function directoryTool(icon,title,desc,action,id){return `<button class="feature-row feature-main" data-a="${action}" ${id?'data-id="'+id+'"':''} data-name="${safe((title+' '+desc).toLowerCase())}"><span class="feature-emoji">${icon}</span><span class="feature-text"><b>${title}</b><small>${desc}</small></span><span class="feature-arrow">›</span></button>`}
function goalProgress(){
 const current=Number(latest('weight')?.value||s.goal.weight), target=Number(s.goal.target), start=Number(s.goal.weight)||current,change=Math.abs(target-start);
 if(!current||!target||!change)return `<p class="sub">${s.goal.type==='maintain'?'Maintaining your current weight is an ongoing goal.':'Add a current weight and target to see progress.'}</p>`;
 const pct=Math.min(100,Math.max(0,Math.round((1-Math.abs(target-current)/change)*100)));
 const arr=logs('weight').filter(x=>typeof x.value==='number').slice(-5),first=arr[0],last=arr.at(-1);
 const weeks=first&&last&&last.ts>first.ts?(last.ts-first.ts)/604800000:0;
 const pace=weeks>0?(last.value-first.value)/weeks:0;
 let eta='Add more measurements to estimate a trend';
 if(s.goal.type==='maintain')eta='Maintenance is ongoing — there is no finish date';
 else if((s.goal.type==='gain'&&pace>.05)||(s.goal.type==='loss'&&pace<-.05)){

const v4Open=(id)=>{screen='v4';v4Current=id||'index';modal='';render();document.getElementById('content')?.scrollTo(0,0)};
function v4Nav(){return `<button class="link" data-a="v4Back">← ${v4Current==='index'?'My Health':'All tools'}</button>`}
function v4FullIndex(){const by=['overview','planplus','foodplus','weightplus','archive','streakplus','kickstart','mission','skinplus','pcosplus','alertsplus','aiplus','progressplus','labs','profileplus','privacyplus','shopplus'];return `<div class="stack gap-lg">${v4Nav()}<div><div class="eyebrow">A–Z EXPLORE MODE</div><h1 class="h1">Every Reliv feature</h1><p class="subtitle">All tools are already available. Each opens into a sample screen, without putting everything on your homepage.</p></div><div class="v4notice"><b>Interactive example, not live healthcare or shopping.</b><p>Entries update this device's preview. Real AI, push messages, cloud sync, health-device verification and payments are not connected.</p></div><div class="v4list">${v4Modules.filter(x=>by.includes(x[1])).map(x=>v4Line(x[0],x[2],'v4Open',x[1],x[3])).join('')}</div></div>`}
function v4Stats(){let w=latest('weight')?.value||66.3,cal=sumToday('meals','calories'),pr=sumToday('meals','protein'),water=sumToday('water','value');return `<div class="v4-mini4"><span>Weight<strong>${w} kg</strong></span><span>Food<strong>${v4N(cal)} kcal</strong></span><span>Protein<strong>${v4N(pr)} g</strong></span><span>Water<strong>${(water/1000).toFixed(1)} L</strong></span></div>`}
function v4Goals(){const t=s.goal.type||'gain';return `<div class="card stack">${v4Tag('My chosen goal','Update this without losing your history','🎯')}<div class="v4-choice">${[['gain','Gain weight'],['loss','Lose weight'],['maintain','Maintain'],['general','Just be healthy']].map(([k,n])=>`<button data-a="v4Goal" data-id="${k}" class="${t===k?'on':''}">${n}</button>`).join('')}</div><div class="v4-row">Current ${safe(latest('weight')?.value||s.goal.weight||66.3)} kg <b>Target ${safe(s.goal.target||'—')} kg</b></div>${v4Button('Edit weight, diet & daily targets','goal','','outline')}</div>`}
const v4SummaryLog=(type)=>s.logs.filter(x=>x.kind===type&&x.date===today());
function v4Overview(){return `${v4Goals()}${v4Stats()}<div class="card stack">${v4Tag('My next useful action','Guidance based on what has been recorded','✦')}<div class="v4-highlight"><b>${safe(todaySuggestion().label)}</b><p>${safe(todaySuggestion().detail)}</p></div><div class="v4-act">${v4Button('Log water +250ml','quickwater')}${v4Button('Log food','log','meals','outline')}</div></div><div class="card stack">${v4Tag('Daily balance','Numbers change when you log something','📊')}${[['Calories',sumToday('meals','calories'),s.goal.kcal||2400,'kcal'],['Protein',sumToday('meals','protein'),s.goal.protein||100,'g'],['Water',sumToday('water','value'),s.goal.water||2500,'ml']].map(([n,a,b,u])=>`<div class="v4-progress"><div class="v4-row"><b>${n}</b><span>${v4N(a)} / ${v4N(b)} ${u}</span></div><div class="v4-bar"><span style="width:${Math.min(100,a/Math.max(1,b)*100)}%"></span></div></div>`).join('')}<p class="hint">Missing meals are not treated as 0 calories.</p></div><div class="v4-act">${v4Button('Daily plan →','v4Open','planplus')}${v4Button('Week & history →','v4Open','archive','outline')}</div>`}
function v4Plan(){const days=Array.from({length:7},(_,i)=>i-6);const tasks=[['water','Drink water','💧'],['meal','Log a meal','🍽️'],['move','Move a little','🚶'],['skinAM','Morning skincare','✨']];return `<div class="card stack">${v4Tag('Your week','Select a day to see the plan','🗓️')}<div class="v4-week">${days.map(i=>`<button data-a="v4Day" data-id="${i}" class="${v4.dayShift===i||(!v4.dayShift&&i===0)?'on':''}"><small>${new Date(Date.now()+i*864e5).toLocaleDateString('en-US',{weekday:'short'})}</small><b>${v4Date(i).split(' ')[0]}</b></button>`).join('')}</div><div class="v4-row"><span>Today: ${safe(v4.vibe)}</span>${v4Pill(v4Date(Number(v4.dayShift)||0))}</div></div><div class="card stack">${v4Tag('Adjust today','Your schedule is allowed to change','☀️')}<div class="v4-chips">${['Normal day','Very busy','Low energy','Travelling','Missed meals','Eating out / event','Can’t work out','Not feeling well'].map(n=>`<button data-a="v4Vibe" data-id="${safe(n)}" class="${v4.vibe===n?'on':''}">${safe(n)}</button>`).join('')}</div><p class="hint">Choosing a mode adjusts sample suggestions; it does not change health goals or erase logs.</p></div><div class="card stack">${v4Tag('Today’s priorities','Done, Skip or Why','✅')}${tasks.map(([k,n,ico])=>`<div class="v4-task"><span>${ico}</span><div><b>${n}</b><small>${v4.habits[k]?'Completed today':v4.habits[k+'_skip']?'Skipped without penalty':'Whenever it works for you'}</small></div><button data-a="v4Done" data-id="${k}">${v4.habits[k]?'✓ Done':'Done'}</button><button data-a="v4Skip" data-id="${k}">Skip</button><button data-a="v4Why" data-id="${k}" aria-label="Why ${n} matters">?</button></div>`).join('')}</div><div class="card stack">${v4Tag('Close the gap','What is left, based on logs—not prescriptions','🎯')}<p>Calories: ${Math.max(0,Number(s.goal.kcal||0)-sumToday('meals','calories'))} kcal · Protein: ${Math.max(0,Number(s.goal.protein||0)-sumToday('meals','protein'))}g · Water: ${Math.max(0,Number(s.goal.water||0)-sumToday('water','value'))}ml</p><p class="hint">Example ideas: dal, curd, eggs, paneer, fruit or a home meal according to your preference. Figures are approximate and not a clinical plan.</p>${v4Button('Mark my shake as consumed','v4Shake','','outline')}</div>`}
function v4Food(){const foods=[['Roti + dal','2 rotis and dal'],['Rice + chicken','Rice and chicken'],['Banana shake','Banana, milk, peanut butter'],['Wedding buffet','Wedding buffet / dawat']];return `<div class="card stack">${v4Tag('Log food your way','No need to count every gram','🍛')}<div class="v4-grid">${foods.map(([n,d])=>`<button data-a="v4FoodPreset" data-id="${safe(d)}"><span>🍽️</span><b>${n}</b><small>Tap to log</small></button>`).join('')}</div>${v4Button('Write what I ate','log','meals')}${v4Button('Take a meal photo (sample analysis)','v4Photo','meal','outline')}</div><div class="card stack">${v4Tag('Buffets & dawat','Select an approximate preset, or record unknown','🍲')}${[['600','Light tasting · ~600 kcal'],['850','Standard buffet · ~850 kcal'],['1200','Large feast · ~1200 kcal'],['700','Home thali · ~700 kcal'],['unknown','I don’t know the portion']].map(([v,t])=>v4Button(t,'v4Buffet',v,'outline')).join('')}<p class="hint">These are illustrative rough estimates, not measured calorie values. Choose “I don’t know” for uncertain amounts.</p></div><div class="card stack">${v4Tag('Quick macro adjustment','Only when you know the extra amount','⚖️')}<div class="v4-act">${[['100','+100 calories'],['500','+500 calories'],['p10','+10g protein'],['p25','+25g protein']].map(([k,t])=>v4Button(t,'v4Macro',k,'outline')).join('')}</div>${v4Button('Undo latest food or water log','v4Undo','','outline')}</div><div class="card stack">${v4Tag('My recent foods','One-tap reminders from your preferences','🥗')}${(v4.favFoods||[]).map(n=>v4Line(safe(n),'Tap to open food entry','v4FoodPreset',safe(n),'↻')).join('')}</div>`}
function v4Weight(){let weight=Number(latest('weight')?.value||s.goal.weight||66.3),tg=Number(s.goal.target||0),wlogs=s.logs.filter(x=>x.kind==='weight');const pace=wlogs.length>=2?((Number(wlogs.at(-1).value)-Number(wlogs[0].value))/Math.max(1,wlogs.length-1)*7).toFixed(2):'—';const gap=Math.abs(tg-weight);return `${v4Goals()}<div class="card stack">${v4Tag('Weight trend & forecast','Changes only when new measurements arrive','📈')}${v4Stats()}<div class="v4-graph">${wlogs.slice(-10).map((r,i)=>`<div title="${safe(r.value)} kg" style="height:${Math.max(18,Math.min(98,35+(Number(r.value)-weight)*15))}%"></div>`).join('')}</div><p class="sub">Observed sample change: ${pace} kg/week. Target difference: ${gap.toFixed(1)} kg.</p><p class="hint">Dates shown only when a meaningful trend can be estimated. Normal daily weight fluctuation is not a reliable forecast.</p><div class="v4-act">${v4Button('Log new weight','log','weight')}${v4Button('All measurements','sub','history','outline')}</div></div><div class="card stack">${v4Tag('Weight entry safeguards','Question unusual differences before counting a goal','🛡️')}<p class="sub">A change above 2 kg asks for confirmation. Above 5 kg is flagged as a large change. An example kiosk reading is not cryptographically verified.</p>${v4Button('Try unusual weight example','v4WeightFlag','','outline')}</div><div class="card stack">${v4Tag('Weigh-in frequency','No mandatory questionnaire','📆')}<div class="v4-chips">${['Daily','Every 3 days','Weekly','Whenever I like'].map(x=>`<button data-a="v4Frequency" data-id="${x}" class="${v4.frequency===x?'on':''}">${x}</button>`).join('')}</div>${v4Button('My private progress photos','sub','photos','outline')}</div>`}
function v4History(){const all=s.logs.slice().sort((a,b)=>b.ts-a.ts);return `<div class="card stack">${v4Tag('My 90-day archive','Not logged ≠ zero calories','🕘')}<div class="v4-scroll-list">${Array.from({length:90},(_,i)=>{const offset=-i,d=dateN(offset),n=all.filter(x=>x.date===new Date(Date.now()+offset*864e5).toLocaleDateString('en-CA')).length;return `<div class="v4-row v4-date"><b>${d}</b><span>${n?n+' entry'+(n>1?'s':''):'Not logged'}</span></div>`}).join('')}</div></div><div class="card stack">${v4Tag('Recent activity','Stored on this browser only','📜')}${all.slice(0,15).map(x=>`<div class="v4-row v4-date"><span>${safe(getMod(x.kind).name)} <small>${safe(x.date)}</small></span><b>${safe(x.kind==='bp'?x.sys+'/'+x.dia:x.kind==='meals'?x.desc||x.value:x.value)}</b></div>`).join('')}${v4Button('Undo latest entry','v4Undo','','outline')}${v4Button('Export everything','export','','outline')}</div>`}
function v4Streak(){const p=v4.streak,wb=v4.profile.wake||'07:00';let st=wb.split(':').map(Number),end=new Date();end.setHours(st[0],st[1],0,0);if(end<=new Date())end.setDate(end.getDate()+1);end.setTime(end.getTime()-3600000);const cycles= Math.max(0,Math.floor((end.getTime()-Date.now())/60000));return `<div class="card stack">${v4Tag('My 23-hour wellness cycle','Optional motivation, never punishment','🔥')}<div class="v4-mini4"><span>Streak<strong>${p.day} days</strong></span><span>Freeze Shields<strong>${p.freeze} / 3</strong></span><span>My XP<strong>${p.xp}</strong></span><span>Cycle ends in<strong>${Math.floor(cycles/60)}h ${cycles%60}m</strong></span></div><p>Wake-up time: ${safe(wb)} · Example first-week benchmark gradually increases from 55% toward 80%.</p><p class="hint">This is an illustrative streak engine, not certified historical scoring. Missing information is not silently counted as failure.</p><div class="v4-act">${v4Button('Use a Freeze Shield (demo)','v4Freeze')}${v4Button('View 7-Day Kickstart','v4Open','kickstart','outline')}</div></div><div class="card stack">${v4Tag('Streak restore','A missed day does not erase your progress','🌱')}<p class="sub">You can resume for free. Paid refundable restoration is described in the original spec, but financial transactions are deliberately disabled in this preview.</p>${v4Button('Resume free','v4Resume','','outline')}${v4Button('See commitment rules (sample)','v4Commit','','outline')}</div>`}
function v4Kickstart(){let days=['Start simple','Drink water','Measure or reflect','Keep a kind routine','Log a meal','Ask a question','Celebrate what worked'];return `<div class="card stack">${v4Tag('Your first 7 days','A short, optional habit starter','🚀')}<div class="v4-kick">${days.map((x,i)=>`<button data-a="v4Kick" data-id="${i}" class="${v4.streak.practice>i?'completed':''}"><span>${i+1}</span><b>${x}</b><small>${v4.streak.practice>i?'✓ Complete':'Start'}</small></button>`).join('')}</div><p class="hint">Original concept: +200 XP after completing seven days. This preview demonstrates the progression locally.</p></div>`}
function v4Mission(){return `<div class="card stack">${v4Tag('30-Second Mission','Only three tiny check-ins','⚡')}<p class="sub">Log water, your first meal, and how you feel. Completing all three awards +25 demonstration XP.</p>${[['water','I drank water','💧'],['meal','I ate something','🍳'],['mood','How I feel','🙂']].map(([k,t,ico])=>`<button class="v4-mission" data-a="v4Mission" data-id="${k}"><span>${ico}</span><b>${t}</b><em>${v4.streak.mission?.[k]?'✓ Done':'Tap to complete'}</em></button>`).join('')}${v4Button('See all achievements','v4Open','streakplus','','')}</div>`}
function v4Skin(){const active=v4.skin.goal;return `<div class="card stack">${v4Tag('My skin routine','Privacy-first, optional skin tracking','✨')}<div class="v4-chips">${['Glow & SPF','Acne & Oil','Deep Hydration','Anti-aging','Sensitive skin'].map(x=>`<button data-a="v4SkinGoal" data-id="${x}" class="${active===x?'on':''}">${x}</button>`).join('')}</div><div class="v4-task"><span>☀️</span><div><b>Morning: cleanse and SPF</b><small>Track only if useful to you</small></div><button data-a="v4SkinRoutine" data-id="am">${v4.skin.am?'✓ Done':'Log'}</button></div><div class="v4-task"><span>🌙</span><div><b>Evening: gentle skin care</b><small>Do not mix unfamiliar actives</small></div><button data-a="v4SkinRoutine" data-id="pm">${v4.skin.pm?'✓ Done':'Log'}</button></div><div class="v4-act">${v4Button('My skin care diary','log','skin')}${v4Button('Face photo demo','v4Photo','face','outline')}</div><p class="hint">This preview does not diagnose skin conditions, analyze facial images, or generate medical treatment regimens.</p></div><div class="card stack">${v4Tag('Skin type check','A simple optional guide','🧴')}<p class="sub">Wash gently and wait about an hour without applying products. Observe whether skin feels oily, dry, mixed or sensitive.</p>${v4Button('Edit my skin type','v4Open','profileplus','outline')}</div>`}
function v4PCOS(){const options=['Irregular or missed periods','Jawline acne','Excess facial or body hair','Scalp hair thinning','Difficulty losing weight','Dark neck or underarm patches'];return `<div class="card stack">${v4Tag('Hormonal health guidance','Optional self-reflection, not a PCOS diagnosis','🌸')}<p class="sub">Some symptoms overlap with multiple conditions. Only a qualified clinician can evaluate PCOS or hormonal disorders.</p>${options.map(x=>`<label class="v4-check"><input type="checkbox" data-v4pcos="${safe(x)}" ${v4.skin.symptoms.includes(x)?'checked':''}> <span>${x}</span></label>`).join('')}<div class="v4-highlight"><b>${v4.skin.symptoms.length} items noted</b><p>These notes can help prepare questions for a medical appointment. They do not produce a risk percentage or diagnosis.</p></div>${v4Button('Save my private checklist','v4SavePCOS','','outline')}</div>`}

function v4AI(){return `<div class="card stack">${v4Tag('Reliv AI studio','Explore what a connected coach would do','✦')}<p class="sub">This offline demo uses sample actions. It does not connect to Groq, Gemini or Whisper.</p><div class="v4-act">${v4Button('Ask AI and log by text','page','ai')}${v4Button('Create a custom tracker','custom','','outline')}</div></div><div class="card stack">${v4Tag('Recipe builder','Ingredients you already have','🥤')}<div class="v4-chips">${['Banana','Milk','Peanut butter','Oats','Paneer','Rice','Yogurt'].map(x=>`<label class="v4-chip-check"><input type="checkbox" data-v4ingredient="${x}"> ${x}</label>`).join('')}</div>${v4Button('Make a sample shake recipe','v4Recipe')}${v4Button('Make a gentle skin-care idea','v4SkinRecipe','','outline')}${v4.recipe?`<div class="v4-highlight"><b>${safe(v4.recipe.title)}</b><p>${safe(v4.recipe.body)}</p></div>`:''}</div><div class="card stack">${v4Tag('Undo and redo','Reverse recent demonstration actions','↩️')}<div class="v4-act">${v4Button('Undo latest logged action','v4Undo')}${v4Button('Redo','v4Redo','','outline')}</div></div>`}
function v4Progress(){const n=s.logs.filter(x=>x.kind==='weight');return `<div class="card stack">${v4Tag('All progress at a glance','Trends, milestones, photos and checkups','📈')}${v4Stats()}<div class="v4-graph">${n.slice(-15).map(r=>`<div style="height:${Math.max(18,Math.min(96,42+(Number(r.value)-66)*12))}%" title="${safe(r.value)} kg"></div>`).join('')}</div>${v4Button('Review my week','sub','week')}${v4Button('Track weight / waist','v4Open','weightplus','outline')}${v4Button('Open progress photos','sub','photos','outline')}${v4Button('Share milestone via WhatsApp','v4Share','','outline')}</div><div class="card stack">${v4Tag('Mastery & rewards','Only in the demo','🏆')}<div class="v4-mini4"><span>XP<strong>${v4.streak.xp}</strong></span><span>Level<strong>${Math.floor(v4.streak.xp/500)+1}</strong></span><span>Streak<strong>${v4.streak.day} days</strong></span><span>Shields<strong>${v4.streak.freeze}</strong></span></div>${v4Button('7-Day Kickstart','v4Open','kickstart')}${v4Button('Commitment / Trust Pool details','v4Commit','','outline')}</div>`}
function v4Labs(){const cards=[['Wellness vs diagnosis','A health app can log and explain. Diagnosis requires a clinician.'],['Protein basics','Protein comes from dals, legumes, dairy, eggs, meat and other foods.'],['Sleep habits','Irregular sleep can change energy, appetite and how you feel.'],['Health measurements','A single reading should be interpreted with context and correct technique.']];const idx=(v4.labs.flash||0)%cards.length;return `<div class="card stack">${v4Tag('Reliv Labs','PDF Academy · Mini lessons · Flashcards','🧪')}<label class="field"><span>Choose an educational PDF</span><input id="v4LabPDF" type="file" accept="application/pdf"></label>${v4Button('Preview selected filename','v4LabPDF','','outline')}<p class="hint">This demo does not parse PDF contents or interpret personal lab reports. The PDF remains on your device.</p></div><div class="card stack">${v4Tag('Flashcard '+(idx+1)+' / '+cards.length,'Tap Next to study something new','🧠')}<div class="v4-flash"><h3>${cards[idx][0]}</h3><p>${cards[idx][1]}</p></div>${v4Button('Next flashcard','v4Flash')}${v4Button('Take a mini quiz','v4Quiz','','outline')}</div>`}

function v4StoreView(){const cat=v4.store.kind||'bots',b=v4Bots.find(x=>x.id===v4.store.selected)||v4Bots[0];return `<div class="stack gap-lg"><button class="link" data-a="back">← My Health</button><div class="eyebrow">RELIV STORE · PRODUCT CONCEPTS</div><h1 class="h1">Reliv Store</h1><p class="subtitle">Explore health bots, kits and kiosk advertising. Nothing is charged or submitted in this preview.</p><div class="v4-store-tabs">${[['bots','🤖 Health Bots'],['kits','🧰 Care Kits'],['ads','📺 Kiosk Ads'],['requests','🧾 My Enquiries']].map(([k,n])=>`<button data-a="v4StoreTab" data-id="${k}" class="${cat===k?'on':''}">${n}</button>`).join('')}</div>${cat==='bots'?`<div class="v4-store-feature"><p>SHOP BY WHAT YOU NEED</p><div class="v4-products">${v4Bots.map(x=>`<button class="v4-product ${v4.store.selected===x.id?'active':''}" data-a="v4BotChoose" data-id="${x.id}">${v4ProductArt(x.id)}<b>${x.name}</b><small>${x.desc}</small><span>${x.price}</span></button>`).join('')}</div></div><div class="card stack">${v4Tag(b.name,b.desc,b.icon)}<div class="v4-row">${v4Pill(b.badge)}<b>${b.price}</b></div><div class="v4-checklist">${b.includes.map(x=>`<div>✓ ${x}</div>`).join('')}</div><label class="field"><span>Choose finish</span><select id="v4Finish"><option>Classic orange & white</option><option>Warm ivory</option><option>Graphite</option></select></label><label class="field"><span>Quantity</span><input type="number" id="v4Qty" value="1" min="1" max="20"></label>${v4Button('Add this bot to my enquiry','v4CartBot',b.id)}${v4Button('Compare bot features','v4BotCompare','','outline')}</div>`:''}${cat==='kits'?`<div class="v4-products">${[['women','Women’s Care Kit','🌸'],['travel','Travel Health Kit','🧳'],['firstaid','First Aid Kit','🩹'],['hygiene','Hygiene & Safety Kit','🛡️'],['digestion','Digestion Kit','🍵'],['immunity','Immunity Support Kit','🌿']].map(([k,n,e])=>`<div class="v4-product"><span class="v4-bot-figure v4-kit-art">${e}</span><b>${n}</b><small>Contents and product availability must be confirmed.</small><button class="btn subtle" data-a="v4KitCart" data-id="${k}">Enquire about kit →</button></div>`).join('')}</div>`:''}${cat==='ads'?v4AdView():''}${cat==='requests'?`<div class="card stack">${v4Tag('My sample enquiries','Nothing has been sent to Reliv','🧾')}${(v4.store.requests||[]).length?v4.store.requests.map(x=>`<div class="v4-row v4-date"><span>${safe(x.label)}</span><b>${safe(x.when||'Saved')}</b></div>`).join(''):'<p class="sub">Your demo enquiry list is empty.</p>'}${v4Button('Return to bots','v4StoreTab','bots','outline')}</div>`:''}<p class="v4-notice">This is a prototype store. Bot models are concept configurations, not confirmed in-stock products. Indicative ad prices are not binding quotes; no payment, ad scheduling or order fulfilment occurs.</p></div>`}
function v4AdView(){const v=v4.store;return `<div class="card stack">${v4Tag('Place an ad on a Reliv kiosk','Choose where, when and what to show','📺')}<div class="field"><label>Choose kiosk locations</label><select id="v4-venue">${['IEM Gurukul','DPS Megacity','Beeu Resorts','All venues'].map(x=>`<option ${v.venue===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="v4-formgrid"><div class="field"><label>Starting date</label><input type="date" id="v4-adStart" value="${safe(v.start)}"></div><div class="field"><label>Number of days</label><input type="number" id="v4-adDays" value="${safe(v.days||3)}" min="1" max="90"></div></div><div class="v4-formgrid"><div class="field"><label>Ad length</label><select id="v4-adSlot">${['5','10','15'].map(x=>`<option value="${x}" ${v.slot===x?'selected':''}>${x} seconds</option>`).join('')}</select></div><div class="field"><label>Placement</label><select id="v4-adPlace"><option>Idle-screen takeover</option><option>Between checkups</option><option>Venue campaign</option></select></div></div><div class="field"><label>Upload your image or video</label><input type="file" id="v4-adMedia" accept="image/*,video/*"></div><div id="v4-media-area" class="v4-ad-preview"><div class="v4-ad-screen"><b>RELIV</b><span>YOUR AD HERE</span><small>Preview appears when you upload media</small></div></div><div class="v4-price"><small>Illustrative rate (one selected venue)</small><strong>₹50 × <span id="v4-priceDays">${Number(v.days||3)}</span> day(s) = ₹<span id="v4-priceTotal">${Number(v.days||3)*50}</span></strong><small>Multiple venues, discounts, slots, tax and availability require a confirmed quote.</small></div>${v4Button('Review ad campaign request','v4ReviewAd')}</div>`}

 if(v4Current==='botcompare')return `<div class="stack gap-lg">${v4Nav()}<h1 class="h1">Compare Reliv Bots</h1><p class="subtitle">Concept configurations to understand which option fits your needs.</p><div class="card stack">${v4Bots.map(b=>`<div class="v4-line"><span class="v4-line-i">${b.icon}</span><span><b>${b.name}</b><small>${b.includes.join(' · ')}</small></span><button class="btn sm subtle" data-a="v4BotChoose" data-id="${b.id}">Choose</button></div>`).join('')}</div><p class="hint">Product specifications and actual prices will be confirmed before any order.</p></div>`;

 if(v4Current==='help')return `<div class="stack gap-lg">${v4Nav()}<h1 class="h1">Help & Guidance</h1><p class="subtitle">Everything in simple words.</p><div class="card stack">${[['How to record food','Tap Quick log → Food. Describe a meal. If you are unsure of the portion, select Not sure.'],['How to record weight','Tap Weight. Type your measurement. You can view it later in My Week.'],['How to check progress','Open Progress & insights, then tap My Week or Weight journey.'],['How to see every feature','Open Complete feature library at the bottom of My Health.'],['How to turn on reminders','Go to Reminders, opt in and choose meal times. This preview cannot deliver background push.'],['How to try bots and ads','Open Store in the header and choose Health Bots or Kiosk Ads. All requests are sample only.']].map(([n,t])=>`<div class="v4-highlight"><b>${n}</b><p>${t}</p></div>`).join('')}</div></div>`;

function v4ExtraDirectory(){return `<details class="tool-group"><summary><span class="group-icon">🧩</span><span class="group-title"><b>Complete feature library</b><small>Daily plan, streaks, AI recipes, Labs, alerts, all tools</small></span><span class="group-arrow">⌄</span></summary><div class="group-list">${v4Modules.map(x=>directoryTool(x[3],x[0],x[2],'v4Open',x[1])).join('')}</div></details>`}
function v4Handle(a,id,val){if(a==='v4Open'){v4Open(id);return true}if(a==='v4Back'){if(v4Current!=='index')v4Open('index');else{screen='main';render()}return true}
if(a==='v4StoreTab'){v4.store.kind=id;v4Save();render();return true}
if(a==='v4BotChoose'){v4.store.selected=id;v4.store.kind='bots';screen='store';v4Save();render();return true}
if(a==='v4CartBot'||a==='v4KitCart'){const b=v4Bots.find(x=>x.id===id);let label=b?b.name:id==='women'?'Women’s Care Kit':'Reliv kit: '+id;const qty=Number(q('v4Qty')?.value)||1;if(qty<1||qty>20)return pop('Choose quantity 1–20'),true;v4.store.requests.push({label,qty,when:v4Time(),type:'product',status:'Local enquiry only'});v4.store.kind='requests';v4Save();render();pop('Added to your demo enquiries. Nothing was purchased.');return true}
if(a==='v4BotCompare'){v4Current='botcompare';screen='v4';render();return true}
if(a==='v4ReviewAd'){let d=Number(q('v4-adDays')?.value);if(!Number.isInteger(d)||d<1||d>90){pop('Enter 1–90 days');return true}const start=q('v4-adStart')?.value;if(!start){pop('Choose a starting date');return true}if(start<today()){pop('Choose today or a future date');return true}v4.store.days=d;v4.store.start=start;v4.store.venue=q('v4-venue').value;v4.store.slot=q('v4-adSlot').value;v4.store.placement=q('v4-adPlace').value;v4.store.requests.push({label:`${v4.store.venue} · ${d} days · ${v4.store.slot} sec`,when:start,type:'ads',status:'Planning enquiry only'});v4.store.kind='requests';v4Save();render();pop('Campaign saved in your browser. Not published.');return true}
if(a==='v4Goal'){s.goal.type=id;if(id==='maintain'){s.goal.target=String(latest('weight')?.value||s.goal.weight||'66.3')}else if(id==='gain'&&Number(s.goal.target)<=Number(latest('weight')?.value)){s.goal.target='75'}else if(id==='loss'&&Number(s.goal.target)>=Number(latest('weight')?.value)){s.goal.target='60'}save();render();pop('Goal changed. Existing records kept.');return true}
if(a==='v4Vibe'){v4.vibe=id;s.dayMode=id;v4Save();save();render();return true}
if(a==='v4Day'){v4.dayShift=Number(id);v4Save();render();return true}
if(a==='v4Done'||a==='v4Skip'){v4.habits[id]=a==='v4Done';v4.habits[id+'_skip']=a==='v4Skip';v4Save();render();return true}
if(a==='v4Why'){pop(({water:'Hydration matters for day-to-day wellbeing.',meal:'Recording meals helps you understand patterns without judgment.',move:'Regular movement supports wellbeing.',skinAM:'A gentle routine and sunscreen may help protect skin.'})[id]||'This is an optional habit.');return true}
if(a==='v4Shake'){log('meals','Homemade banana shake',{desc:'Homemade banana shake (user-confirmed)',calories:350,protein:12,approx:true});render();return true}
if(a==='v4FoodPreset'){modal='log';active='meals';renderModal();let el=q('mealDesc');if(el)el.value=id;return true}
if(a==='v4Buffet'){if(id==='unknown')log('meals','Buffet / portion unknown',{desc:'Buffet or dawat – food not quantified',calories:null,protein:null,approx:true});else log('meals','Buffet example',{desc:'Buffet meal · rough estimate',calories:Number(id),protein:null,approx:true});v4Save();render();pop('Buffet logged; estimates are illustrative.');return true}
if(a==='v4Macro'){let k=id.startsWith('p')?'protein':'calories',amount=Number(id.replace('p',''));log('meals','Manual adjustment',{desc:`Known ${k} adjustment`,[k]:amount,approx:false});render();return true}
if(a==='v4Undo'){if(!s.logs.length){pop('No activity to undo.');return true}v4.undo.push(s.logs.pop());v4.redo=[];save();v4Save();render();pop('Last activity undone.');return true}
if(a==='v4Redo'){if(!v4.undo.length){pop('Nothing to redo.');return true}s.logs.push(v4.undo.pop());save();v4Save();render();pop('Activity restored.');return true}
if(a==='v4Photo'){v4.photoPurpose=id;document.getElementById('v4-upload')?.click();return true}
if(a==='v4Frequency'){v4.frequency=id;v4Save();render();pop('Weigh-in preference updated.');return true}
if(a==='v4WeightFlag'){v4.weightFlags.push({date:today(),note:'Example: a new reading differed by >5 kg; confirm the measurement before trusting the goal score.'});pop('Example flagged. Please repeat the reading.');return true}
if(a==='v4Freeze'){if(v4.streak.freeze<=0){pop('No Freeze Shields available');return true}v4.streak.freeze--;v4Save();render();pop('Demo Freeze Shield used.');return true}
if(a==='v4Resume'){v4.streak.day=1;v4Save();render();pop('New free streak started.');return true}
if(a==='v4Commit'){modal='v4Commit';renderModal();return true}
if(a==='v4Kick'){const n=Number(id);if(n!==v4.streak.practice){pop('Complete your current day first.');return true}v4.streak.practice=Math.min(7,n+1);v4.streak.xp+=n===6?200:20;v4Save();render();return true}
if(a==='v4Mission'){v4.streak.mission=v4.streak.mission||{};v4.streak.mission[id]=true;if(Object.values(v4.streak.mission).filter(Boolean).length===3&&!v4.streak.missionReward){v4.streak.xp+=25;v4.streak.missionReward=true;pop('30-second mission complete: +25 sample XP')}v4Save();render();return true}
if(a==='v4SkinGoal'){v4.skin.goal=id;v4Save();render();return true}
if(a==='v4SkinRoutine'){v4.skin[id]=!v4.skin[id];log('skin',id==='am'?'AM cleanse + SPF':'PM care');v4Save();render();return true}
if(a==='v4SavePCOS'){pop('Symptom checklist saved privately in this browser. Not a diagnosis.');return true}
if(a==='v4SaveAlerts'){const en=q('v4-remindersEnabled')?.checked;v4.alerts.enabled=en;v4.alerts.breakfast=q('v4-br').value;v4.alerts.lunch=q('v4-lu').value;v4.alerts.dinner=q('v4-di').value;for(const key of ['meal','water','skin','goal','beforeEnd'])v4.alerts[key]=!!(en&&q('v4-alert-'+key).checked);v4.alerts.quiet=!!q('v4-quiet').checked;v4.alerts.quietStart=q('v4-qs').value;v4.alerts.quietEnd=q('v4-qe').value;v4Save();render();pop(en?'Choices saved. Real push is not active.':'All reminders disabled.');return true}
if(a==='v4TestAlert'){v4.alerts.inbox.unshift({id:Date.now(),label:'Example: lunch reminder',state:'Preview only · no push sent'});v4Save();render();pop('Test message added to local preview inbox.');return true}
if(a==='v4AlertAction'){const [num,...rest]=id.split(':');if(v4.alerts.inbox[Number(num)])v4.alerts.inbox[Number(num)].state=rest.join(':')+' · '+v4Time();v4Save();render();return true}
if(a==='v4Recipe'||a==='v4SkinRecipe'){const ingredients=Array.from(document.querySelectorAll('[data-v4ingredient]:checked')).map(x=>x.dataset.v4ingredient);v4.recipe=a==='v4Recipe'?{title:'Example home shake',body:`Blend ${ingredients.join(', ')||'banana, milk and oats'} with water or milk to a texture you like. Quantities, allergies and nutritional information must be checked before use.`}:{title:'Skin routine idea',body:'Gentle cleanse, moisturize and use appropriate sun protection. Homemade masks can irritate skin; patch testing or professional advice is preferable.'};v4Save();render();return true}
if(a==='v4Flash'){v4.labs.flash=(v4.labs.flash||0)+1;v4Save();render();return true}
if(a==='v4Quiz'){const ok=confirm('True or false: A wellness tracking app can diagnose a disease on its own.\n\nOK = True · Cancel = False');v4.labs.quiz++;v4Save();pop(!ok?'Correct — a qualified clinician is needed.':'Not quite — tracking is not diagnosis.');return true}
if(a==='v4LabPDF'){const f=q('v4LabPDF')?.files?.[0];pop(f?`Selected ${f.name}. No document contents have been read.`:'Select a PDF to preview its name.');return true}
if(a==='v4SaveProfile'){let age=Number(q('v4-age').value),height=Number(q('v4-height').value);if(age<13||age>110||height<80||height>230){pop('Please check age and height.');return true}v4.profile={...v4.profile,name:q('v4-name').value.trim(),age,sex:q('v4-sex').value,height,wake:q('v4-wake').value,diet:q('v4-diet').value,eating:q('v4-eating').value,skinType:q('v4-skinType').value};s.goal.height=height;s.goal.age=age;s.goal.diet=v4.profile.diet;v4Save();save();render();pop('Profile saved on this device.');return true}
if(a==='v4SetupChoice'){v4.setupChoice=id;v4Save();pop('Preference stored. Nothing is mandatory.');return true}
if(a==='v4Import'){q('v4ImportInput')?.click();return true}
if(a==='v4Diagnostics'){v4Current='diagnostics';screen='v4';render();return true}
if(a==='v4Help'){v4Current='help';screen='v4';render();return true}
if(a==='v4Share'){let msg=`My Reliv demo progress: latest weight ${latest('weight')?.value||'—'}kg. This is sample data.`;if(navigator.share){navigator.share({text:msg}).catch(()=>{});}else window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank','noopener');return true}
return false}

const target=ev.target;
if(target?.dataset?.v4pcos){let x=target.dataset.v4pcos; if(target.checked){if(!v4.skin.symptoms.includes(x))v4.skin.symptoms.push(x)}else v4.skin.symptoms=v4.skin.symptoms.filter(y=>y!==x);v4Save();const n=document.querySelector('.v4-highlight b');if(n)n.textContent=v4.skin.symptoms.length+' items noted';return}

if(target?.id==='v4-upload'){let file=target.files?.[0];if(!file||!file.type.startsWith('image/'))return pop('Choose an image file');let url=URL.createObjectURL(file);if(v4.photoPurpose==='meal'){v4.lastPhoto={purpose:'meal',name:file.name,estimate:'Example only: food image was selected, but no AI analysis is connected.'};pop('Meal image selected. No photo AI is connected.');modal='v4PhotoPreview';renderModal();let holder=q('v4-photoHolder');if(holder)holder.innerHTML='<img src="'+url+'" alt="Your selected food photo" style="max-width:100%;max-height:240px;object-fit:contain">'}else{v4.lastPhoto={purpose:'skin',name:file.name,estimate:'Image selected, but no face or skin analysis is performed.'};modal='v4PhotoPreview';renderModal();let holder=q('v4-photoHolder');if(holder)holder.innerHTML='<img src="'+url+'" alt="Your selected photo" style="max-width:100%;max-height:240px;object-fit:contain">'}return}
if(target?.id==='v4-adMedia'){let file=target.files?.[0];if(!file)return;v4.store.media=file.name;v4Save();if(v4File)URL.revokeObjectURL(v4File);v4File=URL.createObjectURL(file);const host=q('v4-media-area');if(host){host.innerHTML=file.type.startsWith('image/')?'<img src="'+v4File+'" alt="Ad preview">':file.type.startsWith('video/')?'<video src="'+v4File+'" controls muted playsinline></video>':'Preview unavailable'}pop('Ad preview loaded on this device. Not uploaded.');return}

.settingButton span:last-child{color:#8492a3}
.stage{display:grid;gap:14px}
.stageHero{border:1px solid #ffdfc5;border-radius:21px;background:linear-gradient(135deg,#fff4e9,#fff);padding:18px}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{border:1px solid #e9edf1;background:#fff;border-radius:13px;padding:9px 11px;color:#4f5b70;font-size:12px;font-weight:750}
.pill.active{border-color:#f97316;color:#c65d11;background:#fff1e6}
.tinyStat{display:grid;gap:4px;border-radius:14px;background:#f8fafc;padding:11px;min-width:0}
.tinyStat small{font-size:11px}
.tinyStat strong{font-size:15px;overflow-wrap:anywhere}
.topTabs{scrollbar-width:none}
.foodOptions summary{cursor:pointer}
.formButtons{display:grid;gap:9px;margin-top:11px}
.touch{min-height:44px}
.a11yHint{font-size:12px;color:#657286;line-height:1.45}
.inlineSpin{display:inline-block;height:8px;width:8px;border-radius:100%;background:#f97316}
[hidden]{display:none!important}
body.largeText{font-size:18px}body.largeText .sub{font-size:16px}body.largeText .metricHead{font-size:15px}body.largeText small{font-size:14px}body.largeText .hint{font-size:15px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

</style>
  <title>Reliv Care · Personal Health</title>
</head>
<body>
  <div id="app" class="app">
    <header id="header" class="head"></header>
    <main id="main" class="main" aria-live="polite"></main>
    <nav id="nav" class="nav" aria-label="Primary navigation"></nav>
    <div id="overlay"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <script>
'use strict';
/* Reliv Care UI/UX-only build — no preloaded people, health measurements, food diaries or payment outcomes. */
const KEY = 'reliv-care-ui-only-v1';
const TODAY = () => {const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const defaults = () => ({
  mode:null, tab:'data', top:'dashboard', scanMode:'payment',
  profile:{name:'',age:'',gender:'',height:'',weight:'',target:'',goal:'gain',diet:'flex',mealTimes:{breakfast:'',lunch:'',dinner:''}},
  meals:[], water:[], weights:[], activities:[], vitals:[], sleep:[], mood:[], notes:[],
  pantry:[], shake:[], recipes:[], chat:[], reminders:false, largeText:false,
  routine:'Normal', kickstart:0, morningMission:false, care:[],
  shopTab:'bots', selectedBot:'reminder', enquiries:[], adDraft:{venue:'',days:3,seconds:10,start:'',media:null},
  reportExpanded:null, mealExpanded:'Breakfast', consent:false
});
function load(){try{const stored=JSON.parse(localStorage.getItem(KEY)||'null');if(stored&&typeof stored==='object'&&!Array.isArray(stored)){
  const fresh=defaults();return {...fresh,...stored,profile:{...fresh.profile,...(stored.profile||{}),mealTimes:{...fresh.profile.mealTimes,...(stored.profile?.mealTimes||{})}}};
}}catch(err){console.warn('Unable to restore local UI state',err)}return defaults()}
let s=load(), overlay=null, stream=null, scanResult=null, noticeTimer=null, pendingImageUrl=null;
const $=id=>document.getElementById(id);
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nval=v=>v===''||v===null||v===undefined?null:Number(v);
const fmt=v=>v===null||v===undefined||!Number.isFinite(Number(v))?'—':new Intl.NumberFormat('en-IN',{maximumFractionDigits:1}).format(Number(v));
const round=(v,d=0)=>Number(Number(v).toFixed(d));
const mark=v=>v===null||v===undefined?'—':String(v);
const daysAgo=n=>{const dt=new Date();dt.setHours(12,0,0,0);dt.setDate(dt.getDate()-n);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`};
const prettyDate=key=>{const [y,m,d]=String(key).split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-IN',{day:'numeric',month:'short'})};
const timeNow=()=>new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
const fields=['cal','protein','carbs','fat','fiber'];
const selected=v=>v?'selected':'';
function persist(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(err){console.warn('Save failed',err)}}
function notify(text,action=null){clearTimeout(noticeTimer);$('toast').innerHTML=`<div class="toast"><span>${safe(text)}</span>${action?`<button onclick="undo()">Undo</button>`:''}</div>`;noticeTimer=setTimeout(()=>{$('toast').innerHTML=''},4000)}
let snapshot=null;
function remember(){snapshot=JSON.stringify({meals:s.meals,water:s.water,weights:s.weights,activities:s.activities,vitals:s.vitals,profile:s.profile})}
function undo(){if(!snapshot)return;Object.assign(s,JSON.parse(snapshot));snapshot=null;persist();render();notify('Last change reversed')}
const hasFitness=()=>s.mode==='fitness'||s.mode==='combined';
const hasKiosk=()=>s.mode==='combined'||s.mode==='kiosk';
const userName=()=>s.profile.name.trim()||'there';
const latest=(arr)=>arr?.length?[...arr].sort((a,b)=>String(a.at||a.date).localeCompare(String(b.at||b.date))).at(-1):null;
const lastWeight=()=>Number(latest(s.weights)?.value??s.profile.weight)||null;
const height=()=>Number(s.profile.height)||null;
const bmi=()=>lastWeight()&&height()?lastWeight()/((height()/100)**2):null;
const dailyMeals=d=>s.meals.filter(x=>x.date===d);
const dailyWater=d=>s.water.filter(x=>x.date===d).reduce((a,e)=>a+Number(e.ml||0),0);
const diaryTotals=(day=TODAY())=>{
  const food=dailyMeals(day);const total={cal:null,protein:null,carbs:null,fat:null,fiber:null,water:null};
  for(const k of fields){const numeric=food.map(x=>x[k]).filter(x=>x!==null&&x!==''&&Number.isFinite(Number(x)));if(numeric.length)total[k]=round(numeric.reduce((a,x)=>a+Number(x),0),1)}
  const water=s.water.filter(x=>x.date===day);if(water.length)total.water=round(water.reduce((a,x)=>a+Number(x.ml||0),0));
  return total;
};
const targets=()=>{
  const age=nval(s.profile.age),weight=lastWeight(),ht=height(),gender=s.profile.gender;
  if(!age||!weight||!ht||!['male','female'].includes(gender))return null;
  const bmr=10*weight+6.25*ht-5*age+(gender==='male'?5:-161);
  const maintenance=bmr*1.35;
  const cal=Math.round((maintenance+(s.profile.goal==='gain'?250:s.profile.goal==='lose'?-350:0))/10)*10;
  return {cal:Math.max(1200,cal),protein:Math.round(weight*(s.profile.goal==='gain'?1.8:1.6)),carbs:Math.round(cal*.5/4),fat:Math.round(cal*.3/9),water:Math.round(weight*35/100)*100,fiber:30};
};
const progress=(actual,goal)=>actual===null||goal===null||!Number.isFinite(Number(actual))||!goal?null:Math.min(100,Math.max(0,Math.round(Number(actual)/goal*100)));
const hasLogToday=()=>dailyMeals(TODAY()).length>0||s.water.some(x=>x.date===TODAY())||s.activities.some(x=>x.date===TODAY());
function streak(){const active=new Set([...s.meals,...s.water,...s.activities].map(x=>x.date).filter(Boolean));let count=0;let d=0;if(!active.has(daysAgo(0)))d=1;while(active.has(daysAgo(d))){count++;d++}return count}
const weightLabel=()=>lastWeight()===null?'—':fmt(lastWeight())+' kg';
function ring(v,goal,color='#f97316'){
 const p=progress(v,goal);return `<span class="ring" style="--p:${p??0};--c:${color}" data-p="${p===null?'—':p+'%'}" aria-label="${p===null?'No progress recorded':p+' percent of target'}"></span>`;
}
function metric(icon,title,value,subtitle,actual=null,goal=null,color=null){return `<div class="metric"><div class="metricHead"><span class="ico">${icon}</span><span>${title}</span></div><div class="row between"><div style="min-width:0"><div class="metricNum">${safe(value)}</div><small>${safe(subtitle)}</small></div>${goal&&actual!==null?ring(actual,goal,color||'#f97316'):''}</div></div>`}
function empty(icon,title,detail,button='',action=''){return `<div class="empty"><span class="emptyIcon">${icon}</span><h3>${safe(title)}</h3><p>${safe(detail)}</p>${button?`<button class="btn sm secondary" onclick="${action}">${safe(button)}</button>`:''}</div>`}
function heading(title,subtitle=''){return `<div><h1 class="pageTitle">${title}</h1>${subtitle?`<p class="sub">${subtitle}</p>`:''}</div>`}
function nav(){const items=[['data','⌂','Data'],['diary','▤','Diary'],['scan','⌗','Scan'],['ai','✧','AI'],['me','♙','Me']];$('nav').innerHTML=items.map(([id,icon,name])=>`<button type="button" class="${s.tab===id?'active ':''}${id==='scan'?'scanMiddle':''}" onclick="go('${id}')" aria-label="${name}"><span class="navIcon">${icon}</span><span>${name}</span></button>`).join('')}
function header(){const intro=s.mode===null;const initials=s.profile.name.trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()||'RC';$('header').innerHTML=`<div class="logo"><span>Re</span>liv</div><div class="headerActions">${intro&&/Android/i.test(navigator.userAgent)?'<button class="install" onclick="installApp()">⬇ Install</button>':''}${intro?'':`<button class="logBtn" onclick="openLog()">＋ Log</button><button class="avatar" onclick="go('me')" aria-label="Profile">${safe(initials)}</button>`}</div>`}
function render(){document.body.classList.toggle('largeText',!!s.largeText);header();nav();$('main').innerHTML=s.mode===null?welcome():s.tab==='data'?dataScreen():s.tab==='diary'?diaryScreen():s.tab==='scan'?scanScreen():s.tab==='ai'?aiScreen():meScreen();persist()}
function go(tab){if(s.mode===null){if(tab==='scan'){s.mode='payment';s.tab='scan'}else if(tab==='me'){openSheet('setup');return}else{openSheet('setup');return}}else if(s.mode==='payment'&&tab!=='scan'&&tab!=='me'){s.tab='scan';notify('Set up My Health to use fitness features');render();return}else{s.tab=tab}if(s.tab!=='data')s.top='dashboard';stopCamera();closeSheet(false);render();window.scrollTo({top:0,behavior:'instant'})}
function changeTop(top){s.top=top;render()}
function welcome(){return `<div class="screen"><div style="margin:13px 0 2px"><h1 style="font-size:32px;letter-spacing:-1.3px;line-height:1.15">Your health,<br><span style="color:var(--orange)">made simple.</span></h1><p class="sub" style="font-size:14px;margin-top:9px">One app for kiosk visits and everyday health tracking.</p></div><div class="heroStage"><div class="heroGlow"></div><div class="heroDevice"><div class="heroDeviceHeader">RELIV KIOSK <span>●</span></div><div class="heroQr"><i></i><i></i><i></i><i></i><b>▦</b></div><div class="heroDeviceFoot">One scan. Your health.</div></div><div class="heroConnect"><span>↗</span><small>Scan & sync</small></div><div class="heroApp"><div class="heroAppTop">Reliv <span>♥</span></div><div class="heroAppText">My Health</div><div class="heroAppValue" style="font-size:15px">My progress</div><div class="heroAppBars"><span></span><span></span><span></span><span></span><span></span></div><div class="heroAppFoot">Goals · Progress · Reports</div></div></div><button class="btn w100" style="height:59px;font-size:17px" onclick="scanOnly()">▣ &nbsp; Scan & Pay</button><p class="sub" style="text-align:center;margin-top:-8px">No fitness setup needed.</p><button class="btn w100 outline" style="height:56px;font-size:16px" onclick="openSheet('setup')">♙ &nbsp; Set up my health</button><p class="sub" style="text-align:center;margin-top:-8px">Set a goal, track meals and optionally connect your kiosk.</p></div>`}
function scanOnly(){s.mode='payment';s.tab='scan';render()}
function enterSetup(){openSheet('setup')}
function activateMode(mode){if(!['payment','fitness','combined','kiosk'].includes(mode))return;s.mode=mode;s.tab=mode==='payment'?'scan':'data';s.top='dashboard';render()}
function goalName(){return ({gain:'Gain weight',lose:'Lose weight',maintain:'Maintain weight',wellness:'General wellness'})[s.profile.goal]||'Health goal'}
function goalBox(){const w=lastWeight(),t=nval(s.profile.target);return `<div class="goalBox"><div class="row between"><strong style="font-size:14px">🎯 ${safe(goalName())}</strong><button class="btn ghost sm" onclick="openSheet('goal')">Edit</button></div>${w!==null&&t!==null?`<div style="font-size:17px;font-weight:850;margin-top:8px">${fmt(w)} kg <span style="font-weight:450;font-size:12px;color:#657286">→ ${fmt(t)} kg</span></div><div class="bar" style="margin:10px 0"><span class="fill" style="width:0%"></span></div><small>Progress and estimated target date appear after consecutive weigh-ins.</small>`:`<p class="sub" style="margin:9px 0 11px">Set a current and target weight to display your goal and progress.</p><button class="btn sm secondary" onclick="openSheet('goal')">Set weight goal</button>`}</div>`}
function dataScreen(){const kiosk=hasKiosk(),fitness=hasFitness(),t=targets(),c=diaryTotals();const tabs=kiosk?['Dashboard','Charts','Recipe','Health Reports','Daily Reports']:['Dashboard','Charts','Recipe','Daily Reports'];let body=`<div class="row between"><div><p class="sub">Good morning,</p><h1 class="pageTitle">${safe(userName())} 👋</h1><p class="sub">${hasLogToday()?'Keep your momentum going.':'Start with one small action today.'}</p></div><div class="tinyPill">🔥 ${streak()?streak()+' day streak':'Start a streak'}</div></div>${goalBox()}<div class="topTabs">${tabs.map(label=>{const id=label.toLowerCase().replaceAll(' ','-');return `<button class="${s.top===id?'active':''}" onclick="changeTop('${id}')">${label}</button>`}).join('')}</div>`;
 if(s.top==='charts')return `<div class="screen">${body}${chartsScreen()}</div>`;
 if(s.top==='recipe')return `<div class="screen">${body}${recipeScreen()}</div>`;
 if(s.top==='daily-reports')return `<div class="screen">${body}${dailyReportsScreen()}</div>`;
 if(s.top==='health-reports')return `<div class="screen">${body}${healthReportsScreen()}</div>`;
 if(kiosk){const v=latest(s.vitals);body+=`<div class="metricGroup"><div class="dataGroupHead"><strong class="metricGroupTitle">🩺 Kiosk readings</strong><span class="measured">Device source</span></div><p class="sub">Readings appear here after a verified kiosk health QR import.</p><div class="metricGrid">${metric('🩺','Blood pressure',v?.bp||'—',v?'From health record':'Not connected')}${metric('🫁','Oxygen (SpO₂)',v?.spo2!=null?fmt(v.spo2)+'%':'—',v?'From health record':'Not connected')}${metric('💗','Heart rate',v?.pulse!=null?fmt(v.pulse)+' bpm':'—',v?'From health record':'Not connected')}${metric('🌡️','Temperature',v?.temp!=null?fmt(v.temp)+' °C':'—',v?'From health record':'Not connected')}</div><button class="btn outline w100" onclick="s.scanMode='health';go('scan')">Scan kiosk health QR</button></div>`}
 if(fitness){const specs=[['🔥','Calories','cal','kcal'],['🥩','Protein','protein','g'],['🌾','Carbohydrates','carbs','g'],['🫒','Fat','fat','g'],['💧','Water','water','ml'],['🌿','Fiber','fiber','g']];body+=`<div class="metricGroup"><div class="dataGroupHead"><strong class="metricGroupTitle">🍽️ Food & fitness</strong><span>My logs</span></div><p class="sub">Only information you enter is shown. Daily targets are estimates calculated from your profile.</p><div class="metricGrid">${specs.map(([icon,name,k,unit])=>{const val=c[k],tar=t?.[k]??null;return metric(icon,name,val===null?'—':`${fmt(val)} ${unit}`,tar===null?(val===null?'Not logged':'Logged'):`of ${fmt(tar)} ${unit}`,val,tar,k==='water'?'#369dea':null)}).join('')}</div></div>`}
 const v=lastWeight(),b=bmi();body+=`<div class="metricGroup"><div class="dataGroupHead"><strong class="metricGroupTitle">⚖️ Weight & calculated metrics</strong><span class="estimated">Profile-derived</span></div><div class="metricGrid">${metric('⚖️','Current weight',v===null?'—':fmt(v)+' kg',v===null?'No entry yet':'Manually entered')}${metric('📊','BMI',b===null?'—':fmt(round(b,1)),b===null?'Enter height and weight':'Calculated, not measured')}</div></div>`;
 if(kiosk){body+=`<div class="card"><div class="row between"><strong>🧬 Body composition</strong><span class="tag">Optional device</span></div><p class="sub" style="margin:10px 0">Muscle mass, body fat, visceral fat, metabolic age and body water require a compatible measuring device.</p><div class="grid2">${[['💪','Muscle mass'],['🧈','Body fat'],['🫀','Visceral fat'],['💧','Body water'],['🕒','Metabolic age']].map(([icon,name])=>metric(icon,name,'—','Not measured')).join('')}</div></div>`}
 if(fitness){body+=`<button class="card" style="text-align:left;width:100%;background:linear-gradient(110deg,#fff0e6,#fff);border-color:#ffdfc8" onclick="openSheet('summary')"><div class="row between"><div><strong>🎯 Day progress</strong><p class="sub" style="margin-top:5px">${hasLogToday()?'View today’s logged totals':'Log your first meal or glass of water'}</p></div>${ring(c.cal,t?.cal||null)}</div></button>`}
 return `<div class="screen">${body}</div>`}
function diaryScreen(){if(s.mode==='payment')return scanOnlyPrompt();const totals=diaryTotals(),t=targets();const kcal=totals.cal??null,protein=totals.protein??null;const glasses=totals.water===null?0:Math.min(8,Math.round(totals.water/250));return `<div class="screen"><div class="row between">${heading('Diary','Today · '+prettyDate(TODAY()))}<button class="btn sm secondary" onclick="openSheet('summary')">Day summary ›</button></div><div class="card"><div class="row between"><div><strong>Today's progress</strong><p class="sub">${hasLogToday()?'Your meals and hydration update throughout the day.':'Your first entry starts today’s record.'}</p></div>${ring(kcal,t?.cal||null)}</div><div class="grid3" style="margin-top:13px">${[['🔥','Calories',kcal,t?.cal,'kcal'],['🥩','Protein',protein,t?.protein,'g'],['🌾','Carbs',totals.carbs,t?.carbs,'g']].map(([icon,label,val,target,unit])=>`<div class="tinyStat"><small>${icon} ${label}</small><strong>${val===null?'—':fmt(val)+unit}</strong><small>${target?'of '+fmt(target)+unit:'No target yet'}</small></div>`).join('')}</div></div><div class="card water"><div class="row between"><div class="row"><span style="font-size:24px">💧</span><div><strong>Water</strong><p class="sub">${totals.water===null?'Not logged':fmt(totals.water)+' ml'} ${t?.water?' / '+fmt(t.water)+' ml':''}</p></div></div><span class="tag blue">${progress(totals.water,t?.water)||0}%</span></div><div class="glasses">${Array.from({length:8},(_,i)=>`<div class="glass" aria-label="${i<glasses?'Water logged':'Empty glass'}"><span style="height:${i<glasses?'85%':'0%'}"></span></div>`).join('')}</div><div class="row between" style="margin-top:12px"><button class="btn sm outline" onclick="addWater(-250)">− 250ml</button><button class="btn sm" onclick="addWater(250)">＋ 250ml</button><button class="btn sm secondary" onclick="addWater(500)">＋ 500ml</button></div></div><div class="row between"><h2 class="sectionTitle">Meals today</h2><button class="btn sm" onclick="openSheet('food')">＋ Add meal</button></div>${['Breakfast','Lunch','Snack','Dinner'].map(mealGroup).join('')}<div class="card"><div class="row between"><strong>🏋️ Activity & check-ins</strong><button class="btn sm secondary" onclick="openSheet('activity')">＋ Log</button></div><p class="sub" style="margin-top:7px">${s.activities.filter(x=>x.date===TODAY()).length?`${s.activities.filter(x=>x.date===TODAY()).reduce((a,x)=>a+x.minutes,0)} minutes recorded`:'No activity recorded today'}</p><button class="btn ghost sm" onclick="openSheet('weight')">⚖️ Log weight</button></div></div>`}
function mealGroup(group){const entries=dailyMeals(TODAY()).filter(x=>x.type===group);const t=entries.reduce((a,e)=>a+(nval(e.cal)||0),0);return `<details class="foodOptions" ${s.mealExpanded===group?'open':''} ontoggle="if(this.open)s.mealExpanded='${group}'"><summary><div class="row"><span style="font-size:22px">${({Breakfast:'🌤️',Lunch:'🍲',Snack:'🥤',Dinner:'🌙'})[group]}</span><div><strong>${group}</strong><small style="display:block">${entries.length?entries.length+' logged · '+(entries.some(x=>x.cal!==null)?fmt(t)+' kcal':'Nutrition not provided'):'No entries yet'}</small></div></div><span style="color:#7e8794">⌄</span></summary>${entries.length?entries.map(x=>`<div class="meal"><div class="foodIcon">${x.emoji||'🍽️'}</div><div class="mealText"><b>${safe(x.title)}</b><small>${x.cal!==null?fmt(x.cal)+' kcal · ':''}${x.protein!==null?fmt(x.protein)+'g protein · ':''}${safe(x.time||'')}</small></div><button class="copy" onclick="openSheet('food',{id:'${x.id}'})">Edit</button></div>`).join(''):'<p class="sub">Nothing recorded yet. Add a meal when you are ready.</p>'}<button class="btn sm secondary w100" onclick="openSheet('food',{type:'${group}'})">＋ Add ${group.toLowerCase()}</button></details>`}
function chartsScreen(){const weights=[...s.weights].sort((a,b)=>a.at.localeCompare(b.at));const fitness=hasFitness(),kiosk=hasKiosk();return `<div class="stage"><div>${heading('Your progress','See changes as you record more information.')}</div>${weights.length>1?lineChart('⚖️ Weight over time',weights.map(x=>Number(x.value)),'kg',weights.map(x=>prettyDate(x.date))):empty('📈','Your weight chart will appear here','Add weight on at least two different dates to see a trend.','Log weight',"openSheet('weight')")}${kiosk?healthTrend():''}${fitness?['cal','protein','water'].map(k=>dailyBar(k)).join(''):''}</div>`}
function healthTrend(){const withBP=s.vitals.filter(v=>v.bp&&Number(v.bp.split('/')[0]));return withBP.length>1?lineChart('🩺 Blood pressure (systolic)',withBP.map(v=>Number(v.bp.split('/')[0])),'mmHg',withBP.map(v=>prettyDate(v.date))):empty('🩺','Kiosk chart is ready','After verified device readings are imported, blood-pressure and oxygen trends will appear here.')}
function lineChart(title,values,unit,labels){if(values.length<2)return empty('📈','No trend yet','At least two measurements are needed.');const w=320,margin=18;const low=Math.min(...values),high=Math.max(...values),range=Math.max(1,high-low),dx=(w-2*margin)/(values.length-1);const coords=values.map((v,i)=>`${margin+i*dx},${123-((v-low)/range)*86}`);return `<div class="chartBox"><div class="row between"><strong>${safe(title)}</strong><small>${fmt(values.at(-1))} ${unit}</small></div><svg viewBox="0 0 320 158" role="img" aria-label="${safe(title)}"><line x1="18" y1="126" x2="302" y2="126" stroke="#e6edf2"/><line x1="18" y1="80" x2="302" y2="80" stroke="#e6edf2"/><line x1="18" y1="32" x2="302" y2="32" stroke="#e6edf2"/><polyline fill="none" stroke="#f97316" stroke-width="3.5" stroke-linejoin="round" points="${coords.join(' ')}"/>${coords.map(p=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3.8" fill="white" stroke="#f97316" stroke-width="2"/>`).join('')}${labels.map((v,i)=>`<text font-size="10" fill="#8692a1" x="${margin+i*dx}" y="149" text-anchor="middle">${safe(v)}</text>`).join('')}</svg></div>`}
function dailyBar(kind){const entries=Array.from({length:5},(_,i)=>({date:daysAgo(4-i),v:diaryTotals(daysAgo(4-i))[kind]}));if(!entries.some(x=>x.v!==null))return empty(kind==='cal'?'🔥':kind==='protein'?'🥩':'💧',`No ${kind==='cal'?'calorie':kind==='protein'?'protein':'water'} history yet`,'Your last five days will be charted here as you log.');const goal=targets()?.[kind]||1;return `<div class="chartBox"><div class="row between"><strong>${({cal:'🔥 Calories',protein:'🥩 Protein',water:'💧 Water'})[kind]}</strong><small>Last 5 days</small></div><div class="barChart">${entries.map(({date,v})=>`<div class="barCol"><b style="font-size:11px">${v===null?'—':fmt(v)}</b><div class="vbar" style="height:${v===null?4:Math.max(8,Math.min(94,progress(v,goal)||0))}px;background:${kind==='water'?'#43a1ef':'#f97316'}"></div><span>${prettyDate(date)}</span></div>`).join('')}</div></div>`}
const ingredients=[['Curd','🥣'],['Garlic','🧄'],['Banana','🍌'],['Honey','🍯'],['Peanut butter','🥜'],['Paneer','🧀'],['Oats','🌾'],['Milk','🥛'],['Chia seeds','🌱'],['Whey protein','💪']];
const recipeList=[{name:'Banana oat smoothie',items:['Banana','Oats','Milk']},{name:'High-protein curd bowl',items:['Curd','Oats','Honey']},{name:'Peanut-butter shake',items:['Peanut butter','Banana','Milk']},{name:'Paneer snack bowl',items:['Paneer','Garlic']},{name:'Recovery shake',items:['Milk','Whey protein','Banana']}];
function recipeScreen(){const match=recipeList.filter(r=>r.items.every(n=>s.pantry.includes(n)));return `<div class="stage">${heading('🥣 Kitchen Mode','Choose ingredients available in your kitchen.') }<div class="card"><div class="row between"><strong>What's in your kitchen?</strong><span class="tinyPill">${s.pantry.length} selected</span></div><div class="ingrid" style="margin-top:13px">${ingredients.map(([name,icon])=>`<label class="ing"><input type="checkbox" ${s.pantry.includes(name)?'checked':''} onchange="toggleIngredient('pantry','${name}',this.checked)"><span>${icon} ${name}</span></label>`).join('')}</div></div><div class="card"><strong>💪 Anabolic Shake Builder</strong><p class="sub" style="margin:7px 0 12px">Choose ingredients for a homemade shake. Portions and nutrition require verified food data.</p><div class="ingrid">${ingredients.map(([name,icon])=>`<label class="ing"><input type="checkbox" ${s.shake.includes(name)?'checked':''} onchange="toggleIngredient('shake','${name}',this.checked)"><span>${icon} ${name}</span></label>`).join('')}</div><div class="recipeResult" style="margin-top:14px"><div class="row between"><strong>My selected ingredients</strong><span class="tinyPill">${s.shake.length} items</span></div><p class="sub" style="margin-top:9px">${s.shake.length?s.shake.map(safe).join(' · '):'Nothing selected yet.'}</p><div class="grid2" style="margin-top:11px"><div class="tinyStat"><small>Calories</small><strong>—</strong></div><div class="tinyStat"><small>Protein</small><strong>—</strong></div></div><p class="hint" style="margin:10px 0">Connect a validated recipe database before showing energy and protein totals.</p><button class="btn w100" onclick="saveRecipe()">Save my shake recipe</button></div></div><div class="card"><div class="row between"><strong>🍽️ Matching recipes</strong><span class="tinyPill">${match.length} matches</span></div>${match.length?`<div class="gap" style="margin-top:12px">${match.map(r=>`<div class="row between" style="padding:12px;border-radius:12px;background:#fafbfc"><div><strong>${safe(r.name)}</strong><p class="sub">${r.items.map(safe).join(' · ')}</p></div><button class="btn sm secondary" onclick="openSheet('recipe',{name:'${r.name}'})">View</button></div>`).join('')}</div>`:empty('🍌','Select ingredients to see matches','Matching recipe suggestions will appear here.','Select all ingredients',"chooseAllIngredients()")}</div></div>`}
function chooseAllIngredients(){s.pantry=ingredients.map(x=>x[0]);render()}
function toggleIngredient(which,name,checked){const xs=new Set(s[which]);if(checked)xs.add(name);else xs.delete(name);s[which]=[...xs];render()}
function saveRecipe(){if(!s.shake.length)return notify('Choose ingredients first');s.recipes.push({id:crypto.randomUUID?.()||String(Date.now()),name:'My homemade shake',items:[...s.shake],date:TODAY()});persist();notify('Recipe saved to this device')}
function dailyReportsScreen(){return `<div class="stage">${heading('Daily fitness reports','Five expandable days. No reports are preloaded.')}<div class="row between"><span class="tinyPill">Last 5 days</span><button class="btn sm outline" onclick="openSheet('summary')">Today’s summary</button></div>${Array.from({length:5},(_,i)=>{const d=daysAgo(4-i),vals=diaryTotals(d),meals=dailyMeals(d),has=meals.length||s.water.some(x=>x.date===d)||s.weights.some(x=>x.date===d);return `<details class="dayCard" ${s.reportExpanded===d?'open':''}><summary><span style="height:29px;width:29px;background:#fff0e6;color:#d95e0b;border-radius:50%;display:grid;place-items:center;font-weight:850;font-size:12px">${i+1}</span><span style="flex:1"><strong>Day ${i+1}</strong><small style="display:block">${prettyDate(d)}</small></span><span class="tag ${has?'blue':''}">${has?'Entries recorded':'No entries'}</span><span>⌄</span></summary>${has?`<div class="dayNums">${[['🔥','Calories',vals.cal,'kcal'],['🥩','Protein',vals.protein,'g'],['💧','Water',vals.water===null?null:round(vals.water/1000,2),'L'],['🌿','Fiber',vals.fiber,'g']].map(([icon,name,v,unit])=>`<span>${icon} ${name}<b>${v===null?'—':fmt(v)+' '+unit}</b></span>`).join('')}</div><p class="sub" style="margin-top:10px">${meals.length} meal(s) recorded. Open Diary to edit today's entries.</p>`:`<div style="padding:15px 0">${empty('📋','Nothing logged on this day','Report details will fill automatically from recorded meals, water and weight.')}</div>`}</details>`}).join('')}</div>`}
function healthReportsScreen(){const v=latest(s.vitals);const list=[['🩺','Blood pressure',v?.bp?`${v.bp} mmHg`:'—'],['🫁','SpO₂',v?.spo2!=null?fmt(v.spo2)+'%':'—'],['💗','Pulse',v?.pulse!=null?fmt(v.pulse)+' bpm':'—'],['🌡️','Temperature',v?.temp!=null?fmt(v.temp)+' °C':'—'],['⚖️','BMI & weight',bmi()!==null?fmt(round(bmi(),1))+' · '+weightLabel():'—']];return `<div class="stage">${heading('Health reports','Kiosk measurements, sources and history.')}<div class="dataNotice">Only authorized kiosk health data belongs here. Body composition requires a separate compatible device.</div>${list.map(([icon,name,value],i)=>`<div class="card row between"><div class="row"><span style="font-size:24px">${icon}</span><div><strong>${name}</strong><p class="sub">${safe(value)}</p><small>${v?'Latest saved health entry':'No device reading yet'}</small></div></div><button class="btn sm secondary" onclick="openSheet('health-detail',{index:${i}})">Open ›</button></div>`).join('')}${s.vitals.length>1?healthTrend():empty('📈','No kiosk history yet','Verified imported measurements will appear here as a timeline.')}<button class="btn w100" onclick="s.scanMode='health';go('scan')">Scan a kiosk health QR</button></div>`}
function scanOnlyPrompt(){return `<div class="screen">${empty('📷','Scan to begin','Kiosk payments can be scanned without setting up a fitness profile.','Open scanner',"go('scan')")}</div>`}
function scanScreen(){const payment=s.scanMode==='payment',v=latest(s.vitals);return `<div class="screen">${heading(payment?'Scan & Pay':'Scan kiosk health QR',payment?'Point your camera at the kiosk payment QR.':'Import readings from a secure, authorized Reliv health QR.')}<div class="topTabs"><button class="${payment?'active':''}" onclick="s.scanMode='payment';stopCamera();render()">💳 Payment QR</button><button class="${payment?'':'active'}" onclick="s.scanMode='health';stopCamera();render()">🩺 Health QR</button></div><div class="scanner"><div class="scannerFrame"></div><div id="scanVisual"><div class="scannerIcon">▦</div><div style="font-size:13px">Align a Reliv QR code inside the frame</div></div><video id="scanVideo" autoplay muted playsinline style="display:none"></video></div><button class="btn w100" onclick="startCamera()">📷 ${stream?'Close camera':'Open camera'}</button><div class="card"><strong>Have a QR code already?</strong><div class="field" style="margin-top:11px"><label>Paste scanned content</label><textarea id="qrText" placeholder="Paste an authorized QR payload..."></textarea></div><button class="btn secondary w100" onclick="handlePastedQR()">Continue with code</button></div><div class="card"><div class="scanSteps"><span>①<br>Scan QR</span><span>②<br>${payment?'Verify payment request':'Verify health record'}</span><span>③<br>${payment?'Continue to checkout':'Import your data'}</span></div></div>${s.mode==='payment'?`<div class="card row between"><div><strong>Would you like health tracking?</strong><p class="sub">Optional. You can set up later.</p></div><button class="btn sm outline" onclick="openSheet('setup')">Set up ›</button></div>`:hasKiosk()?`<div class="card"><div class="row between"><strong>Latest kiosk readings</strong><span class="tag">${v?'Saved on this device':'Not connected'}</span></div>${v?`<div class="grid2" style="margin-top:10px">${metric('🩺','BP',v.bp||'—','From device record')}${metric('🫁','SpO₂',v.spo2!=null?fmt(v.spo2)+'%':'—','From device record')}${metric('💗','Pulse',v.pulse!=null?fmt(v.pulse)+' bpm':'—','From device record')}${metric('🌡️','Temperature',v.temp!=null?fmt(v.temp)+' °C':'—','From device record')}</div>`:empty('🩺','No kiosk readings yet','Verified readings appear after QR validation and account authorization.')}</div>`:''}<div class="dataNotice">Camera preview is available where supported. Payment checkout, QR verification, and health-record import require backend connections. This UI does not manufacture a success result.</div></div>`}
async function startCamera(){if(stream){stopCamera();render();return}const video=$('scanVideo');try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera unavailable');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});video.srcObject=stream;video.style.display='block';$('scanVisual').style.display='none';await video.play();notify('Camera is open');if(window.BarcodeDetector){const decoder=new BarcodeDetector({formats:['qr_code']});const loop=async()=>{if(!stream||!video.isConnected)return;try{const hits=await decoder.detect(video);if(hits?.length){scanResult=hits[0].rawValue;stopCamera();openSheet('qr-result');return}}catch{}setTimeout(loop,600)};setTimeout(loop,600)}}catch{stream=null;notify('Camera access is unavailable. Try paste instead.')}}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function handlePastedQR(){const text=$('qrText')?.value.trim();if(!text)return notify('Paste a QR code first');scanResult=text;openSheet('qr-result')}
function aiScreen(){return `<div class="screen">${heading('Reliv AI ✨','Chat, voice and food photo — ready for a real AI provider.')}<div class="card"><strong>What would you like help with?</strong><div class="chiprow" style="margin-top:12px">${['Log a meal','Check my nutrition','Plan a recipe','Explain a health report','Set a meal reminder'].map(q=>`<button onclick="quickAsk('${q}')">${q}</button>`).join('')}</div></div>${s.chat.length?`<div class="chat">${s.chat.map(msg=>`<div class="bubble ${msg.role==='user'?'user':'ai'}">${safe(msg.text)}</div>`).join('')}</div>`:empty('✦','Start a conversation','Type a question, use supported voice input, or upload a food image. Your conversation starts empty.')}<div class="card"><div class="field"><label>Ask Reliv or describe what you ate</label><textarea id="chatInput" placeholder="I ate two rotis with dal..."></textarea></div><div class="row"><button class="btn sm secondary" style="flex:1" onclick="speechInput()">🎙️ Voice</button><button class="btn sm secondary" style="flex:1" onclick="openSheet('photo')">📷 Photo</button><button class="btn sm" style="flex:1" onclick="sendMessage()">Send ›</button></div><p class="hint" style="margin-top:10px">A production AI connection is required to generate advice or write health logs. This frontend does not invent AI results.</p></div></div>`}
function quickAsk(message){s.chat.push({id:Date.now(),role:'user',text:message});persist();render();notify('Connect the AI service to receive a response')}
function sendMessage(){const x=$('chatInput')?.value.trim();if(!x)return notify('Enter a message first');s.chat.push({id:Date.now(),role:'user',text:x});persist();render();notify('Message saved locally · AI not connected')}
function speechInput(){const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech)return notify('Speech input is not supported in this browser');try{const speech=new Speech();speech.lang='en-IN';speech.onresult=e=>{const phrase=e.results[0][0].transcript;if($('chatInput'))$('chatInput').value=phrase;notify('Transcript ready to review')};speech.onerror=()=>notify('Microphone could not be accessed');speech.start();notify('Listening…')}catch{notify('Microphone unavailable')}}
function meScreen(){const p=s.profile,profileFilled=Boolean(p.name);return `<div class="screen"><div class="row between">${heading('Me','Profile, targets, devices and preferences')}<span class="tinyPill">My account</span></div><div class="card"><div class="row"><div class="avatar" style="width:52px;height:52px;font-size:18px">${safe((p.name||'RC').slice(0,2).toUpperCase())}</div><div style="flex:1"><strong>${safe(p.name||'Your profile')}</strong><p class="sub">${p.age?p.age+' years · ':''}${p.height?p.height+' cm · ':''}${lastWeight()!==null?fmt(lastWeight())+' kg':''}</p></div><button class="btn sm outline" onclick="openSheet('goal')">Edit</button></div><p class="sub" style="margin-top:11px">${safe(goalName())}${p.target?' · target '+fmt(p.target)+' kg':''}</p></div><div class="card"><div class="row between"><strong>My Reliv experience</strong><span class="statusBadge">Choose features</span></div><p class="sub" style="margin:8px 0 12px">Switch between scan-only, fitness, kiosk health, or both. Your local entries stay intact.</p><div class="grid2"><button class="choice ${s.mode==='payment'?'selected':''}" onclick="setMode('payment')"><strong>📷 Scan only</strong><small>No fitness tracking</small></button><button class="choice ${s.mode==='fitness'?'selected':''}" onclick="setMode('fitness')"><strong>🏋️ Fitness</strong><small>Meals, water, weight</small></button><button class="choice ${s.mode==='combined'?'selected':''}" onclick="setMode('combined')"><strong>🩺 Fitness + kiosk</strong><small>Tracking and health records</small></button><button class="choice ${s.mode==='kiosk'?'selected':''}" onclick="setMode('kiosk')"><strong>📈 Kiosk history</strong><small>Measurements and reports</small></button></div></div><div class="card"><h2 class="sectionTitle">Profile & preferences</h2>${[['Goal, height and weight','goal'],['Meal times and dietary choices','meal-times'],['Notifications and reminders','reminders'],['Store · Bots, kits and kiosk ads','shop'],['Daily routines and extra tools','extras'],['Privacy, export and reset','privacy']].map(([name,key])=>`<button class="settingButton" onclick="openSheet('${key}')"><span>${name}</span><span>›</span></button>`).join('')}<button class="settingButton" onclick="installApp()"><span>Install Reliv on this phone</span><span>›</span></button><button class="settingButton" onclick="toggleLargeText()"><span>Larger text</span><strong>${s.largeText?'On':'Off'}</strong></button></div></div>`}
function setMode(mode){if(mode==='payment'&&s.mode!=='payment'){stopCamera();s.scanMode='payment'}s.mode=mode;s.tab=mode==='payment'?'scan':'data';s.top='dashboard';render();notify('Your Reliv layout has been updated')}
function toggleLargeText(){s.largeText=!s.largeText;render()}
function openLog(){if(s.mode==='payment'||s.mode===null)return openSheet('setup');openSheet('log')}
function addWater(amount){if(!hasFitness())return notify('Enable fitness tracking to log water');const total=dailyWater(TODAY());if(amount<0&&total<=0)return notify('There is no water entry to remove');remember();s.water.push({id:id(),at:new Date().toISOString(),date:TODAY(),ml:amount});persist();render();notify(`${amount>0?'+':''}${amount} ml recorded`,true)}
function saveWeight(value){const number=Number(value);if(!Number.isFinite(number)||number<20||number>300)return notify('Enter a valid weight between 20 and 300 kg');remember();s.weights.push({id:id(),at:new Date().toISOString(),date:TODAY(),value:round(number,1),source:'manual'});s.profile.weight=round(number,1);closeSheet();render();notify('Weight saved on this device',true)}
function addActivity(){const mins=Number($('activityMinutes')?.value);if(!Number.isFinite(mins)||mins<1||mins>360)return notify('Enter valid minutes');remember();s.activities.push({id:id(),date:TODAY(),at:new Date().toISOString(),type:$('activityType').value,minutes:mins});closeSheet();render();notify('Activity saved',true)}
function id(){return window.crypto?.randomUUID?.()||`${Date.now()}-${Math.floor(Math.random()*100000)}`}
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
function installApp(){if(installPrompt){installPrompt.prompt();return}notify(/iPhone|iPad|iPod/i.test(navigator.userAgent)?'Safari → Share → Add to Home Screen':'Browser menu → Install app / Add to Home Screen')}
let sheet=null;
function openSheet(type,data={}){stopCamera();sheet={type,data,step:0};if(type==='setup')sheet.data={...s.profile,mealTimes:{...s.profile.mealTimes},plan:hasKiosk()?'complete':'fitness',kiosk:hasKiosk()};drawSheet()}
function closeSheet(clear=true){if(clear){sheet=null;$('overlay').innerHTML=''}else if(sheet){sheet=null;$('overlay').innerHTML=''}}
function drawSheet(){if(!sheet)return;const item=sheetBody();$('overlay').innerHTML=`<div class="sheetLayer" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="${safe(item.title)}"><div class="sheetHandle"></div><div class="row between" style="margin-bottom:16px"><h2>${safe(item.title)}</h2><button class="sheetClose" onclick="closeSheet()" aria-label="Close">×</button></div><div class="gap">${item.body}</div></section></div>`}
function get(id){return $(id)?.value||''}
function captureSetup(){if(!sheet||sheet.type!=='setup')return;const d=sheet.data;const names={name:'sName',age:'sAge',gender:'sGender',height:'sHeight',weight:'sWeight',target:'sTarget',goal:'sGoal'};for(const [key,input] of Object.entries(names)){if($(input))d[key]=get(input)}}
function setupPick(plan){captureSetup();sheet.data.plan=plan;drawSheet()}
function setupNext(){captureSetup();const d=sheet.data;if(!d.name?.trim()||Number(d.age)<13||Number(d.age)>110||Number(d.height)<100||Number(d.height)>230||Number(d.weight)<20||Number(d.weight)>300||Number(d.target)<20||Number(d.target)>300)return notify('Please complete the required profile fields');d.kiosk=!!$('sKiosk')?.checked;sheet.step=1;drawSheet()}
function setupFinish(){const d=sheet.data;const old=s.profile;const age=Number(d.age),height=Number(d.height),weight=Number(d.weight),target=Number(d.target);const goal=d.goal||'gain',gender=d.gender||'';if(!d.name?.trim())return notify('Enter your name');s.profile={name:d.name.trim(),age,gender,height,weight,target,goal,diet:get('sDiet')||'flex',mealTimes:{breakfast:get('sBreakfast'),lunch:get('sLunch'),dinner:get('sDinner')}};s.mode=d.plan==='fitness'?'fitness':d.kiosk?'combined':'fitness';s.tab='data';s.top='dashboard';if(!s.weights.length)s.weights.push({id:id(),at:new Date().toISOString(),date:TODAY(),value:weight,source:'manual'});closeSheet();render();notify('Your health dashboard is ready')}
function saveProfile(){const p=s.profile;const name=get('gName').trim(),age=Number(get('gAge')),height=Number(get('gHeight')),weight=Number(get('gWeight')),target=Number(get('gTarget')),goal=get('gGoal');if(!name||age<13||age>110||height<100||height>230||weight<20||weight>300||target<20||target>300)return notify('Please complete your profile information');remember();Object.assign(p,{name,age,height,weight,target,goal});const recent=latest(s.weights);if(!recent||round(Number(recent.value),1)!==round(weight,1))s.weights.push({id:id(),date:TODAY(),at:new Date().toISOString(),value:round(weight,1),source:'manual'});closeSheet();render();notify('Profile and goal updated',true)}
function saveMeal(){const title=get('mName').trim();if(!title)return notify('Describe what you ate');const type=get('mType')||'Breakfast';const old=s.meals.find(m=>m.id===sheet?.data?.id);let values={};for(const [key,field] of [['cal','mCal'],['protein','mProtein'],['carbs','mCarbs'],['fat','mFat'],['fiber','mFiber']]){const raw=get(field);if(raw!==''&&(!Number.isFinite(Number(raw))||Number(raw)<0))return notify('Check the nutrition fields');values[key]=raw===''?null:Number(raw)}remember();const entry={id:old?.id||id(),date:old?.date||TODAY(),at:old?.at||new Date().toISOString(),title,type,emoji:'🍽️',time:timeNow(),...values};if(old)Object.assign(old,entry);else s.meals.push(entry);closeSheet();render();notify('Meal saved',true)}

function savePreferences(){s.profile.mealTimes={breakfast:get('tBreakfast'),lunch:get('tLunch'),dinner:get('tDinner')};s.profile.diet=get('tDiet');closeSheet();render();notify('Preferences saved')}
function saveReminders(){s.reminders=!!$('rEnabled')?.checked;closeSheet();render();notify(s.reminders?'Reminder preference saved; delivery requires a push service':'Reminders are off')}
function saveCare(){const values=Array.from(document.querySelectorAll('[name=care]:checked')).map(el=>el.value);s.care=values;closeSheet();notify('Care routine saved locally')}
function saveWellness(){const sleep=Number(get('sleepHours'));if(get('sleepHours')&&(!Number.isFinite(sleep)||sleep<0||sleep>24))return notify('Check hours of sleep');s.sleep.push({id:id(),date:TODAY(),at:new Date().toISOString(),hours:get('sleepHours')===''?null:sleep});s.mood.push({id:id(),date:TODAY(),at:new Date().toISOString(),value:get('moodSelect')});closeSheet();render();notify('Check-in saved')}

function markKickstart(){s.kickstart=Math.min(7,(s.kickstart||0)+1);drawSheet();persist()}
function mission(){s.morningMission=!s.morningMission;drawSheet();persist()}
function saveEnquiry(){const type=s.shopTab==='kits'?'Care kit':'Health bot';s.enquiries.push({id:id(),type,product:s.selectedBot,date:TODAY(),status:'Draft · not submitted'});s.shopTab='enquiries';drawSheet();persist();notify('Enquiry saved as a local draft')}
function reviewAd(){const days=Number(get('adDays'));if(!get('adVenue').trim())return notify('Enter a location');if(!Number.isFinite(days)||days<1||days>90)return notify('Enter 1–90 days');const seconds=Number(get('adLength')),date=get('adDate');if(!date)return notify('Choose a start date');s.adDraft={...s.adDraft,venue:get('adVenue').trim(),days,seconds,start:date};sheet={type:'ad-review',data:{...s.adDraft}};drawSheet()}
function saveAdDraft(){s.enquiries.push({id:id(),type:'Kiosk advertising',product:s.adDraft.venue,date:TODAY(),status:'Draft · not submitted',...s.adDraft});s.shopTab='enquiries';closeSheet();render();notify('Campaign saved as a draft. Not booked.')}
function previewMedia(el){const file=el.files?.[0];if(!file)return;if(file.size>20*1024*1024)return notify('Choose a file under 20 MB for preview');if(pendingImageUrl)URL.revokeObjectURL(pendingImageUrl);pendingImageUrl=URL.createObjectURL(file);const target=$('mediaPreview');if(!target)return;target.innerHTML=file.type.startsWith('video/')?`<video src="${pendingImageUrl}" controls style="width:100%;max-height:220px"></video>`:`<img src="${pendingImageUrl}" alt="Selected media preview" style="width:100%;max-height:220px;object-fit:contain;border-radius:12px">`;s.adDraft.media=file.name}
function previewPhoto(el){const file=el.files?.[0];if(!file)return;if(pendingImageUrl)URL.revokeObjectURL(pendingImageUrl);pendingImageUrl=URL.createObjectURL(file);const target=$('photoPreview');if(target)target.innerHTML=`<img src="${pendingImageUrl}" alt="Food photo preview" style="width:100%;max-height:220px;object-fit:contain;border-radius:12px">`}
function saveExport(){const data=JSON.stringify({version:1,exportedAt:new Date().toISOString(),profile:s.profile,meals:s.meals,water:s.water,weights:s.weights,activities:s.activities,vitals:s.vitals,recipes:s.recipes,reminders:s.reminders},null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='reliv-care-my-local-data.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Your local data was exported')}
function resetLocal(){if(!confirm('Clear your local UI data and return to the welcome screen?'))return;stopCamera();s=defaults();localStorage.removeItem(KEY);closeSheet();render();notify('Local UI data cleared')}
function sheetBody(){const {type,data}=sheet;const p=s.profile;
 if(type==='setup'){const d=data,step=sheet.step||0;return {title:`Set up Reliv · ${step+1} of 2`,body:step===0?`<p class="sub">Tell us a little about yourself. Nothing is prefilled.</p><div class="field"><label for="sName">Full name</label><input id="sName" value="${safe(d.name)}" placeholder="Your name" autocomplete="name"></div><div class="grid2"><div class="field"><label for="sAge">Age</label><input id="sAge" type="number" min="13" max="110" value="${safe(d.age)}" placeholder="Years"></div><div class="field"><label for="sGender">Gender</label><select id="sGender"><option value="">Select</option>${[['male','Male'],['female','Female'],['other','Other / prefer not to say']].map(([v,label])=>`<option value="${v}" ${d.gender===v?'selected':''}>${label}</option>`).join('')}</select></div><div class="field"><label for="sHeight">Height (cm)</label><input id="sHeight" type="number" min="100" max="230" value="${safe(d.height)}" placeholder="cm"></div><div class="field"><label for="sWeight">Weight (kg)</label><input id="sWeight" type="number" min="20" max="300" step="0.1" value="${safe(d.weight)}" placeholder="kg"></div></div><div class="field"><label for="sGoal">Goal</label><select id="sGoal">${[['gain','Gain weight'],['lose','Lose weight'],['maintain','Maintain weight'],['wellness','General wellness']].map(([v,label])=>`<option value="${v}" ${d.goal===v?'selected':''}>${label}</option>`).join('')}</select></div><div class="field"><label for="sTarget">Target weight</label><input id="sTarget" type="number" min="20" max="300" step=".1" value="${safe(d.target)}" placeholder="kg"></div><strong>Choose your experience</strong><div class="grid2"><button class="choice ${d.plan==='fitness'?'selected':''}" onclick="setupPick('fitness')"><span style="font-size:23px">🏋️</span><strong>Only Fitness</strong><small>Meals, hydration, weight, goals and charts.</small></button><button class="choice ${d.plan==='complete'?'selected':''}" onclick="setupPick('complete')"><span style="font-size:23px">❤️</span><strong>Complete Body Track</strong><small>Fitness plus optional kiosk health reports.</small></button></div><label class="radioText"><input id="sKiosk" type="checkbox" ${d.kiosk?'checked':''}> I have used a Reliv kiosk</label><button class="btn w100" onclick="setupNext()">Continue ›</button>`:`<p class="sub">Optional meal preferences. You can edit these any time.</p><div class="field"><label for="sDiet">Food preference</label><select id="sDiet">${[['flex','No preference'],['veg','Vegetarian'],['nonveg','Non-vegetarian'],['eggetarian','Eggetarian']].map(([v,label])=>`<option value="${v}" ${d.diet===v?'selected':''}>${label}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>Breakfast</label><input id="sBreakfast" type="time" value="${safe(d.mealTimes?.breakfast)}"></div><div class="field"><label>Lunch</label><input id="sLunch" type="time" value="${safe(d.mealTimes?.lunch)}"></div></div><div class="field"><label>Dinner</label><input id="sDinner" type="time" value="${safe(d.mealTimes?.dinner)}"></div><div class="notice">This frontend stores what you enter only on this device. Connect a secure account backend before public release.</div><div class="row"><button class="btn outline" style="flex:1" onclick="sheet.step=0;drawSheet()">Back</button><button class="btn" style="flex:2" onclick="setupFinish()">Open my health ›</button></div>`};}
 if(type==='log')return {title:'Quick Log',body:`<p class="sub">What would you like to record?</p><div class="grid2">${[['🍽️','Food & meals','Enter a food or meal',"openSheet('food')"],['💧','Water','Add a glass or bottle',"openSheet('water')"],['⚖️','Weight','Update your weight',"openSheet('weight')"],['🏋️','Activity','Walk, gym or yoga',"openSheet('activity')"]].map(([ico,name,sub,action])=>`<button class="choice" onclick="${action}"><span style="font-size:26px">${ico}</span><strong>${name}</strong><small>${sub}</small></button>`).join('')}</div><button class="btn secondary w100" onclick="closeSheet();go('ai')">✧ Tell Reliv AI instead</button>`};
 if(type==='food'){const old=s.meals.find(x=>x.id===data.id),e=old||{};return {title:old?'Edit meal':'Log food',body:`<div class="field"><label for="mName">What did you eat?</label><textarea id="mName" placeholder="e.g. two rotis with dal, curd and rice">${safe(e.title||'')}</textarea></div><div class="field"><label for="mType">Meal</label><select id="mType">${['Breakfast','Lunch','Snack','Dinner'].map(x=>`<option ${x===(e.type||data.type)?'selected':''}>${x}</option>`).join('')}</select></div><div class="notice">You can save a food description without guessing calories or macros. Connect a verified nutrition database for automated estimates.</div><details class="foodOptions"><summary>More options · nutrition if known <span>⌄</span></summary><div class="grid2">${[['Calories (kcal)','cal','mCal'],['Protein (g)','protein','mProtein'],['Carbs (g)','carbs','mCarbs'],['Fat (g)','fat','mFat'],['Fiber (g)','fiber','mFiber']].map(([name,k,id])=>`<div class="field"><label>${name}</label><input type="number" id="${id}" min="0" step="0.1" value="${e[k]??''}" placeholder="Optional"></div>`).join('')}</div></details><div class="row"><button class="btn secondary" style="flex:1" onclick="openSheet('photo')">📷 Photo</button><button class="btn secondary" style="flex:1" onclick="closeSheet();go('ai');speechInput()">🎙️ Speak</button></div><button class="btn w100" onclick="saveMeal()">${old?'Save changes':'Save meal'}</button>${old?`<button class="btn outline w100" onclick="deleteMeal()">Delete meal</button>`:''}`};}
 if(type==='water')return {title:'Add water',body:`<p class="sub">${dailyWater(TODAY())?fmt(dailyWater(TODAY()))+' ml logged today':'No water logged yet'}</p><div class="grid2">${[250,500,750,1000].map(amount=>`<button class="choice" style="min-height:66px;text-align:center" onclick="addWater(${amount});closeSheet()"><strong>💧 ${amount} ml</strong><small>Tap to add</small></button>`).join('')}</div><div class="field"><label>Custom amount (ml)</label><input id="waterAmount" type="number" min="1" max="5000" placeholder="Enter ml"></div><button class="btn w100" onclick="const amt=Number(get('waterAmount'));if(amt>0&&amt<=5000){addWater(amt);closeSheet()}else notify('Enter 1–5000 ml')">Add amount</button>`};
 if(type==='weight')return {title:'Log weight',body:`<div class="field"><label>Current weight (kg)</label><input id="weightAmount" type="number" min="20" max="300" step="0.1" value="${lastWeight()??''}" placeholder="Enter weight"></div><p class="sub">Saving this value updates your profile, goal and chart.</p><button class="btn w100" onclick="saveWeight(Number(get('weightAmount')))">Save weight</button>`};
 if(type==='activity')return {title:'Record activity',body:`<div class="field"><label>Activity</label><select id="activityType">${['Walking','Strength training','Yoga','Cardio','Mobility','Other movement'].map(name=>`<option>${name}</option>`).join('')}</select></div><div class="field"><label>Minutes</label><input type="number" id="activityMinutes" min="1" max="360" placeholder="Time in minutes"></div><button class="btn w100" onclick="addActivity()">Save activity</button>`};
 if(type==='goal')return {title:'Your profile & goal',body:`<div class="field"><label>Your name</label><input id="gName" value="${safe(p.name)}" placeholder="Full name"></div><div class="grid2"><div class="field"><label>Age</label><input id="gAge" type="number" value="${safe(p.age)}"></div><div class="field"><label>Height (cm)</label><input id="gHeight" type="number" value="${safe(p.height)}"></div><div class="field"><label>Current weight (kg)</label><input id="gWeight" type="number" step=".1" value="${lastWeight()??''}"></div><div class="field"><label>Target weight (kg)</label><input id="gTarget" type="number" step=".1" value="${safe(p.target)}"></div></div><div class="field"><label>Goal</label><select id="gGoal">${[['gain','Gain weight'],['lose','Lose weight'],['maintain','Maintain weight'],['wellness','General wellness']].map(([v,label])=>`<option value="${v}" ${p.goal===v?'selected':''}>${label}</option>`).join('')}</select></div><div class="notice">Nutrition targets are estimates from your entered profile, not measured energy expenditure.</div><button class="btn w100" onclick="saveProfile()">Save profile & goal</button>`};
 if(type==='meal-times')return {title:'Meal times & preferences',body:`${[['Breakfast','breakfast','tBreakfast'],['Lunch','lunch','tLunch'],['Dinner','dinner','tDinner']].map(([name,k,input])=>`<div class="field"><label>${name}</label><input type="time" id="${input}" value="${safe(p.mealTimes?.[k])}"></div>`).join('')}<div class="field"><label>Food preference</label><select id="tDiet">${[['flex','No preference'],['veg','Vegetarian'],['nonveg','Non-vegetarian'],['eggetarian','Eggetarian']].map(([v,label])=>`<option value="${v}" ${p.diet===v?'selected':''}>${label}</option>`).join('')}</select></div><button class="btn w100" onclick="savePreferences()">Save preferences</button>`};
 if(type==='reminders')return {title:'Reminders & notifications',body:`<label class="radioText"><input id="rEnabled" type="checkbox" ${s.reminders?'checked':''}> Enable reminders</label><div class="notice">Notifications are off until you enable them. Delivery needs an installed PWA, permission and push backend.</div><div class="card noShadow"><strong>Preferred meal times</strong><p class="sub">${['breakfast','lunch','dinner'].map(k=>`${k}: ${p.mealTimes[k]||'Not set'}`).join(' · ')}</p><button class="btn sm outline" onclick="openSheet('meal-times')">Edit meal times</button></div><button class="btn w100" onclick="saveReminders()">Save reminder preference</button>`};
 if(type==='summary'){const t=targets(),v=diaryTotals();return {title:'Today’s summary',body:`<div class="card"><div class="row between"><div><strong>📅 ${prettyDate(TODAY())}</strong><p class="sub">${hasLogToday()?'Only saved entries are counted.':'No entries saved today.'}</p></div>${ring(v.cal,t?.cal||null)}</div></div><div class="metricGrid">${[['🔥','Calories','cal','kcal'],['🥩','Protein','protein','g'],['💧','Water','water','ml'],['🌿','Fiber','fiber','g']].map(([icon,name,k,unit])=>metric(icon,name,v[k]===null?'—':fmt(v[k])+' '+unit,t?.[k]?'of '+fmt(t[k])+' '+unit:'Not logged',v[k],t?.[k]||null)).join('')}</div><button class="btn w100" onclick="closeSheet();s.tab='data';s.top='daily-reports';render()">View daily reports</button>`};}
 if(type==='recipe'){const r=recipeList.find(x=>x.name===data.name);return {title:r?.name||'Recipe',body:`<div class="card"><strong>Suggested ingredients</strong><p class="sub" style="margin-top:10px">${(r?.items||[]).join(' · ')}</p></div><div class="notice">Connect a recipe service for quantities, instructions, verified macros and dietary checks.</div><button class="btn w100" onclick="closeSheet();s.top='recipe';render()">Back to Kitchen Mode</button>`};}
 if(type==='health-detail'){const readings=latest(s.vitals),labels=['Blood pressure','SpO₂','Pulse','Temperature','BMI & weight'],k=data.index;const keys=['bp','spo2','pulse','temp'];const value=k===4?(bmi()===null?null:fmt(round(bmi(),1))):readings?.[keys[k]];return {title:labels[k]||'Health details',body:`<div class="card"><p class="eyebrow">LATEST READING</p><h2 style="font-size:27px;margin:10px 0">${value??'—'}</h2><p class="sub">${readings?`Saved ${prettyDate(readings.date)}`:'No verified measurements have been imported.'}</p></div>${empty('📈','Measurement history','A detailed chart, device source, reference information and export options appear here after connected data is available.')}<button class="btn w100" onclick="closeSheet();s.scanMode='health';go('scan')">Scan health QR</button>`};}
 if(type==='qr-result')return {title:'QR code detected',body:`<div class="card"><strong>Scan received</strong><p class="sub" style="margin-top:9px">The next step is to validate the QR signature and user authorization with the appropriate service.</p></div><div class="notice">This UI-only build does not complete a payment or import a health record.</div><button class="btn w100" onclick="closeSheet()">Done</button>`};
 if(type==='photo')return {title:'Food photo',body:`<div class="field"><label>Choose a food picture</label><input type="file" accept="image/*" capture="environment" onchange="previewPhoto(this)"></div><div id="photoPreview" class="empty">${empty('📷','Photo preview','Your selected photo appears here. No food recognition runs locally.')}</div><div class="notice">Image analysis needs a connected, consented AI service and nutrition database.</div><button class="btn w100" onclick="closeSheet();openSheet('food')">Enter meal details manually</button>`};
 if(type==='extras')return {title:'More health tools',body:`<div class="card"><div class="row between"><strong>🔥 My daily streak</strong><span class="tinyPill">${streak()} days</span></div><p class="sub" style="margin-top:8px">Counts days with actual locally recorded food, water or activity. No streak points are preloaded.</p></div><div class="card"><strong>🗓️ Flexible daily plan</strong><p class="sub" style="margin:7px 0 11px">Choose a routine that fits your day.</p><div class="pills">${['Normal','Busy','Travel','Low energy'].map(label=>`<button class="pill ${s.routine===label?'active':''}" onclick="setRoutine('${label}')">${label}</button>`).join('')}</div><p class="sub" style="margin-top:12px">${s.routine==='Busy'?'Keep the essentials: meals, water and an easy walk.':s.routine==='Travel'?'Flexible meal timing and regular hydration.':s.routine==='Low energy'?'Focus on rest, hydration and easier meal options.':'Your usual food, hydration and activity routine.'}</p></div><div class="card"><strong>🎯 7-Day Kickstart</strong><p class="sub" style="margin:8px 0 11px">${s.kickstart} of 7 days completed</p><div class="bar" style="margin-bottom:12px"><span class="fill" style="width:${Math.round(s.kickstart/7*100)}%"></span></div><button class="btn secondary w100" onclick="markKickstart()" ${s.kickstart>=7?'disabled':''}>Complete today’s action</button></div><div class="card"><strong>⚡ 30-Second Morning Mission</strong><p class="sub" style="margin:8px 0">Choose one meal intention, drink some water and check in with yourself.</p><button class="btn secondary w100" onclick="mission()">${s.morningMission?'✓ Mission completed':'Mark mission completed'}</button></div><div class="card"><strong>🌙 Sleep and mood</strong><div class="grid2" style="margin:12px 0"><div class="field"><label>Sleep (hours)</label><input type="number" id="sleepHours" min="0" max="24" step="0.5" placeholder="Optional"></div><div class="field"><label>Mood</label><select id="moodSelect"><option>Good</option><option>Okay</option><option>Low energy</option><option>Great</option></select></div></div><button class="btn w100" onclick="saveWellness()">Save check-in</button></div><div class="card"><strong>✨ Skin & personal care</strong><div class="gap" style="margin:12px 0">${['☀️ Morning SPF','💧 Skin hydration','🌙 Evening cleanse'].map(name=>`<label class="radioText"><input name="care" value="${name}" type="checkbox" ${s.care.includes(name)?'checked':''}> ${name}</label>`).join('')}</div><button class="btn secondary w100" onclick="saveCare()">Save routine</button></div><button class="btn w100" onclick="closeSheet();s.tab='data';s.top='recipe';render()">Open Kitchen Mode & recipes</button>`};
 if(type==='privacy')return {title:'Privacy & local data',body:`<div class="notice">This is a frontend-only UI package. Personal entries are saved locally in this browser. It has no registered accounts, encrypted health server, cloud backup, or approved deletion workflow.</div><button class="btn outline w100" onclick="saveExport()">Export my local entries (JSON)</button><button class="btn outline w100" onclick="resetLocal()">Clear local entries and start over</button><button class="btn secondary w100" onclick="closeSheet()">Close</button>`};
 if(type==='shop')return {title:'Reliv Store',body:`<div class="topTabs">${[['bots','Health Bots'],['kits','Care Kits'],['ads','Kiosk Ads'],['enquiries','My Enquiries']].map(([id,label])=>`<button class="${s.shopTab===id?'active':''}" onclick="s.shopTab='${id}';drawSheet()">${label}</button>`).join('')}</div>${storeBody()}`};
 if(type==='ad-review')return {title:'Review campaign',body:`<div class="card"><strong>📺 Kiosk advertisement</strong><div class="moreRow">Location <b>${safe(data.venue)}</b></div><div class="moreRow">Days <b>${data.days}</b></div><div class="moreRow">Length <b>${data.seconds}s</b></div><div class="moreRow">Start date <b>${safe(data.start)}</b></div><div class="moreRow">Price <b>Request quote</b></div></div><div class="notice">The campaign is not booked. Payment, available slots, and approval require a production backend.</div><button class="btn w100" onclick="saveAdDraft()">Save campaign as a draft</button>`};
 return {title:'Reliv Care',body:empty('✦','Connect this feature','This UI is ready for the production service to be integrated.')};
}
function storeBody(){const tab=s.shopTab;
 if(tab==='bots'){const bots=[['reminder','⏰','Reminder Mini','Simple alerts and schedules'],['speaker','🔊','Speaker Bot','Spoken prompts and reminders'],['all','🩺','All-in-One','Health assistant with voice and integrations'],['custom','✨','Custom Bot','Configure your own combination']];const selected=bots.find(x=>x[0]===s.selectedBot)||bots[0];return `<div class="grid2">${bots.map(([id,icon,name,detail])=>`<button class="shopProduct ${s.selectedBot===id?'choice selected':''}" onclick="s.selectedBot='${id}';drawSheet()"><div class="art">${icon}</div><strong>${name}</strong><small>${detail}</small></button>`).join('')}</div><div class="card"><div class="row between"><strong>${selected[2]}</strong><span class="tag">Request quote</span></div><p class="sub" style="margin:8px 0">${selected[3]}. Real product photography, availability and specifications can be connected here.</p><button class="btn w100" onclick="saveEnquiry()">Request product information</button></div>`}
 if(tab==='kits'){return `<div class="grid2">${[['🧰','First Aid Kit'],['🧪','Testing Kit'],['🧳','Travel Care'],['🧴','Daily Wellness']].map(([icon,name])=>`<div class="shopProduct"><div class="art">${icon}</div><strong>${name}</strong><small>Availability and price on request</small><button class="btn sm secondary w100" onclick="s.selectedBot='${name}';saveEnquiry()">Enquire</button></div>`).join('')}</div>`}
 if(tab==='ads'){return `<div class="card gap"><div><strong>📺 Advertise on Reliv kiosks</strong><p class="sub">Prepare your ad, select a place and review the request.</p></div><div class="field"><label>Location or campus</label><input id="adVenue" value="${safe(s.adDraft.venue)}" placeholder="Choose available venue"></div><div class="grid2"><div class="field"><label>Campaign days</label><input id="adDays" type="number" min="1" max="90" value="${s.adDraft.days}"></div><div class="field"><label>Ad length</label><select id="adLength">${[5,10,15].map(n=>`<option value="${n}" ${Number(s.adDraft.seconds)===n?'selected':''}>${n} seconds</option>`).join('')}</select></div></div><div class="field"><label>Start date</label><input type="date" id="adDate" value="${safe(s.adDraft.start)}"></div><div class="field"><label>Upload ad image or video</label><input type="file" accept="image/*,video/*" id="adFile" onchange="previewMedia(this)"></div><div id="mediaPreview" class="empty" style="min-height:100px">${empty('🖼️','Ad preview','Choose an image or video to preview your creative.')}</div><div class="row between"><strong>Price: Request quote</strong><button class="btn sm" onclick="reviewAd()">Review request</button></div><p class="hint">No price or availability is invented. Campaign scheduling and payment are not connected.</p></div>`}
 return s.enquiries.length?`<div class="gap">${s.enquiries.map(e=>`<div class="card"><strong>${safe(e.type)}</strong><p class="sub">${safe(e.product)}</p><span class="tinyPill">${safe(e.status)}</span></div>`).join('')}</div>`:empty('🛍️','No enquiries saved','Requests you draft on this device will appear here. They are not sent to Reliv.')
}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet()});
window.addEventListener('popstate',()=>{if(sheet)closeSheet();else if(s.mode&&s.tab!=='data')go('data')});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
render();

</script>
</body>
</html>

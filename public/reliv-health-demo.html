*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.46;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:2px}svg{max-width:100%}.app{max-width:460px;min-height:100dvh;margin:0 auto;position:relative;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 90px #63350b10}.top{height:76px;padding:14px 20px 11px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;background:var(--bg);z-index:6;border-bottom:1px solid #f4e9e0}.brand{display:flex;gap:10px;align-items:center}.brandlogo{width:41px;height:41px;display:grid;place-items:center;background:var(--orange);border-radius:14px;color:white;font-size:24px;font-weight:800}.brand strong{font-size:20px;letter-spacing:-.7px;color:#bb5000}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:1px}.head-actions{display:flex;gap:6px}.iconbtn{height:39px;min-width:39px;border:1px solid #f0e0d1;background:var(--card);border-radius:13px;color:var(--orangeDeep);display:grid;place-items:center;font-size:17px}.content{padding:17px 18px 115px;flex:1}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:460px;width:100%;height:calc(68px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line);background:rgba(255,250,246,.98);z-index:10;backdrop-filter:blur(15px)}.bottom button{border:0;background:transparent;color:#9b8272;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:650}.bottom button .navicon{font-size:24px}.bottom button.active{color:var(--orangeDeep)}.bottom button.active .navicon{background:var(--soft);padding:5px 14px;border-radius:12px;margin:-5px -14px}.h1{f rgin:12px 0 5px;letter-spacing:-.8px;line-height:1.14}.hero p{color:#fff3e8;font-size:13px;line-height:1.5;margin:0 0 16px;max-width:260px}.hero .btn{background:#fff;color:#b84900}.catalog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choose{background:white;border:1px solid var(--line);border-radius:16px;padding:15px 12px;text-align:left;min-height:107px}.choose .emoji{font-size:26px;display:block;margin-bottom:8px}.choose strong{display:block;font-size:12px;color:var(--ink)}.choose span:last-child{font-size:11px;color:var(--orangeDeep);display:block;margin-top:8px;font-weight:650}.recommend{border:1px solid #ffe0c8;border-radius:15px;background:#fff4eb;padding:13px;display:flex;gap:11px}.reco-emoji{font-size:24px}.metric-head{display:flex;align-items:center;gap:11px}.tile-icon{font-size:22px;width:42px;height:42px;display:grid;place-items:center;background:var(--soft);border-radius:12px}.value{font-size:27px;font-weight:760;letter-spacing:-.6px}.line{height:1px;background:var(--line);margin:4px 0}.minichart{height:84px;width:100%;display:block}.minichart text{font-size:8px;fill:#ad9584}.progress{height:8px;background:#ffe6d2;border-radius:20px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--orange);border-radius:inherit}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff8f2;padding:12px;border:1px solid #f2e2d5;border-radius:13px}.stat strong{font-size:19px;display:block}.stat span{color:var(--muted);font-size:11px}.listrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border:0}.listrow strong{font-size:13px}.hint{font-size:11px;color:#8d7767;line-height:1.55}.modalwrap{position:fixed;inset:0;background:#1c120c7a;z-index:40;display:flex;align-items:end;justify-content:center}.sheet{width:min(460px,100vw);max-height:89dvh;overflow-y:auto;background:var(--bg);padding:20px 19px calc(30px + env(safe-area-inset-bottom));border-radius:25px 25px 0 0;box-shadow:0 -20px 35px #1d100c1a}.handle{margin:0 auto 18px;background:#ecd4c2;width:43px;height:5px;border-radius:20px}.sheet h2{font-size:22px;margin:0 0 7px;letter-spacing:-.6px}.field{margin:10px 0 15px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:7px;color:#624536}.field input,.field select,.field textarea{min-height:48px;width:100%;border:1px solid #e9d5c6;border-radius:12px;background:white;color:var(--ink);padding:11px 13px;font-size:15px;outline:none}.field textarea{min-height:82px;resize:vertical}.seg{display:flex;flex-wrap:wrap;gap:7px}.seg button{padding:9px 12px;min-height:36px;border:1px solid #e8d7ca;background:white;border-radius:25px;color:#6d5140;font-size:12px}.seg button.selected{background:var(--orange);color:white;border-color:var(--orange)}.checkline{display:flex;align-items:flex-start;gap:10px;font-size:13px;padding:10px 0;color:#614d40}.checkline input{accent-color:var(--orange);width:19px;height:19px;margin-top:1px;flex-shrink:0}.pillbtn{border:1px solid #f0d8c6;border-radius:25px;background:#fff;min-height:36px;padding:8px 12px;font-size:12px;color:var(--orangeDeep);font-weight:650}.toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom));max-width:420px;width:calc(100% - 36px);padding:13px 15px;border-radius:13px;background:#3e3027;color:white;box-shadow:0 12px 35px #2226;font-size:12px}.avatar{background:#fff2e8;color:var(--orangeDeep);font-size:12px;font-weight:800;border-radius:11px;padding:10px}.chatwrap{display:flex;flex-direction:column;gap:13px;min-height:200px}.bubble{max-width:92%;padding:13px 14px;border-radius:16px;font-size:13px;line-height:1.55}.bubble.ai{background:#fff1e5;align-self:flex-start;border-bottom-left-radius:4px}.bubble.you{background:#ff7900;color:white;align-self:flex-end;border-bottom-right-radius:4px}.chat-entry{display:flex;gap:8px;margin-top:15px}.chat-entry textarea{flex:1;resize:none;background:white;border:1px solid var(--line);border-radius:13px;padding:13px;min-height:52px;font-size:14px;color:var(--ink)}.chat-entry button{width:50px;border:0;border-radius:13px;background:var(--orange);color:white;font-size:23px}.scanbox{height:238px;background:#30241e;border-radius:22px;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff8f2;text-align:center}.scanbox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.scan-corners{position:absolute;width:164px;height:164px;border:3px solid #ffffffaa;border-radius:21px;pointer-events:none;z-index:2}.scantext{position:relative;z-index:2;text-shadow:0 1px 4px #0008;font-size:14px;font-weight:700}.tag{font-size:11px;font-weight:650;color:#98683e;background:#fff3e9;border-radius:25px;padding:6px 9px}.disabledtext{color:#b69c89}.dark{--ink:#f6e7dc;--muted:#c1a899;--line:#503d34;--soft:#503324;--bg:#1e1815;--card:#2c2420;--quiet:#342b26;--shadow:none}.dark .choose,.dark .card,.dark .stat,.dark .iconbtn,.dark .pillbtn,.dark .field input,.dark .field select,.dark .field textarea,.dark .chat-entry textarea{background:var(--card);color:var(--ink)}.dark .sheet{background:var(--bg)}.dark .sub,.dark .hint{color:var(--muted)}.dark .stat{background:var(--card)}.dark .bottom{background:#1e1815}.dark .hero .btn{background:white;color:#a94b00}.dark .choose strong,.dark .choose span:last-child{color:var(--ink)}.dark .bubble.ai,.dark .recommend{background:#493124}.dark .recommend,.dark .pill{color:var(--ink)}@media (min-width:670px){body{background:#f4eee8}.app{margin:30px auto;min-height:840px;border:1px solid #eadacd;border-radius:26px;overflow:hidden}.bottom{max-width:460px}}
</style></head>
<body><div class="app" id="app"><header class="top"><div class="brand"><div class="brandlogo">♥</div><div><strong>reliv care</strong><small>Your health, your way</small></div></div><div class="head-actions"><button class="iconbtn" data-a="audio" title="Read screen aloud" aria-label="Read screen aloud">◖))</button><button class="iconbtn" data-a="settings" title="Settings" aria-label="Settings">⚙</button></div></header><main class="content" id="content"></main><nav class="bottom" id="nav" aria-label="Primary navigation"></nav></div><div id="modal"></div><div id="toast"></div>
<script>
(()=>{
'use strict';
const KEY='reliv-health-only-lab-v1';
const MODULES={weight:{name:'Weight',icon:'⚖️',unit:'kg',desc:'Home scale, kiosk and your weight goal'},bp:{name:'Blood Pressure',icon:'🩺',unit:'mmHg',desc:'Keep your BP readings together'},heart:{name:'Heart Rate',icon:'❤️',unit:'bpm',desc:'See pulse readings over time'},oxygen:{name:'Oxygen (SpO₂)',icon:'🫁',unit:'%',desc:'Track oxygen saturation readings'},temp:{name:'Body Temperature',icon:'🌡️',unit:'°C',desc:'Record temperature measurements'},meals:{name:'Food & Calories',icon:'🍽️',unit:'kcal',desc:'Simple food logging, protein and buffets'},water:{name:'Water',icon:'💧',unit:'ml',desc:'Log hydration in one tap'},steps:{name:'Walking & Steps',icon:'🚶',unit:'steps',desc:'Daily steps and walks'},exercise:{name:'Exercise',icon:'🏋️',unit:'min',desc:'Gym, walks, yoga or cardio'},sleep:{name:'Sleep',icon:'🌙',unit:'hrs',desc:'Hours slept and sleep patterns'},mood:{name:'Mood',icon:'😊',unit:'check-in',desc:'How you felt each day'},skin:{name:'Skin Routine',icon:'✨',unit:'routine',desc:'Morning and evening skin care'},waist:{name:'Waist',icon:'📏',unit:'cm',desc:'Optional waist measurement'},supplements:{name:'Supplements',icon:'💊',unit:'check-in',desc:'Track what you take'},notes:{name:'Health Journal',icon:'📔',unit:'note',desc:'Private notes and reminders'}};
const initial=()=>({modules:[],custom:{},logs:[],goal:{type:'none',target:'',height:'',age:'',diet:'Any',kcal:2200,protein:90,water:2500,weight:''},prefs:{theme:'light',lang:'English',reminders:false,breakfast:'09:00',lunch:'14:00',dinner:'20:00',water:false,quietStart:'22:00',quietEnd:'07:00',skincare:false,streaks:false,notifyStatus:'off'},messages:[],dayMode:'Normal day',sample:false,photos:[],routine:{}});
let s;try{s=Object.assign(initial(),JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){s=initial();}s.prefs={...initial().prefs,...s.prefs};s.goal={...initial().goal,...s.goal};let tab='health',screen='main',modal='',active='',subview='',photoData='',scanStream=null,scanTimer=null,demoQR='',portion='normal',remindType='breakfast',chartDays=7,voiceRec=null,toastTimer=null;
const getMod=k=>MODULES[k]||s.custom[k]||{name:k,icon:'◉',unit:'',desc:''},els=(tag,cls,html)=>`<${tag} class="${cls}">${html}</${tag}>`,q=id=>document.getElementById(id),safe=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toLocaleDateString('en-CA'),dateN=offset=>{let x=new Date();x.setDate(x.getDate()+offset);return x.toLocaleDateString('en-CA')},fmt=n=>Number(n).toLocaleString('en-IN'),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){pop('Storage is full — export your data or remove large photos.')}};
function log(k,val,extra={}){const rec={id:'r'+Date.now()+Math.random().toString(36).slice(2,5),kind:k,value:val,date:today(),ts:Date.now(),source:'Manual',...extra};s.logs.push(rec);save();pop(`${getMod(k).name} updated`);return rec}
function logs(k){return s.logs.filter(x=>x.kind===k).sort((a,b)=>a.ts-b.ts)}
function latest(k){return logs(k).slice(-1)[0]}
function nowDate(){return new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
function pop(msg){q('toast').innerHTML=`<div class="toast" role="status">${safe(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>q('toast').innerHTML='',3500)}
function btn(name,a,cls='',attrs=''){return `<button class="btn ${cls}" data-a="${a}" ${attrs}>${name}</button>`}function rclose(){modal='';active='';photoData='';render()}
function page(t){tab=t;screen='main';modal='';stopCam();render();window.scrollTo({top:0,behavior:'instant'});}
function nav(){q('nav').innerHTML=[['health','♥','My Health'],['scan','▣','Scan'],['ai','✦','Reliv AI']].map(([id,icon,label])=>`<button data-a="page" data-id="${id}" class="${tab===id?'active':''}" aria-current="${tab===id?'page':'false'}" ><span class="navicon">${icon}</span>${label}</button>`).join('')}
function render(){document.documentElement.classList.toggle('dark',s.prefs.theme==='dark');q('content').innerHTML=screen==='main'?(tab==='health'?health():tab==='scan'?scanner():ai()):subScreen();nav();renderModal();}
function emptyState(){return `<div class="hero"><div style="font-size:31px">♥ +</div><h2>Your health starts here.</h2><p>Choose what you want to track. No setup forms. No unnecessary features.</p>${btn('＋ Add to My Health','catalog')}</div><div class="card stack"><div class="section">Not sure what to add?</div><div class="sub">Start with just one. You can add, hide or change anything later.</div><div class="row wrap">${['bp','weight','meals','water'].map(k=>`<button class="pillbtn" data-a="add" data-id="${k}">${getMod(k).icon} ${getMod(k).name} +</button>`).join('')}</div></div>`}
function weeklyMini(k){const arr=logs(k).filter(r=>typeof r.value==='number').slice(-6);if(arr.length<2)return '';let nums=arr.map(r=>r.value),min=Math.min(...nums),max=Math.max(...nums),rng=Math.max(max-min,1);const points=nums.map((v,i)=>`${12+i* (276/(nums.length-1))},${66-(v-min)/rng*48}`).join(' ');return `<svg viewBox="0 0 300 82" role="img" aria-label="Recent entries trend" class="minichart"><path d="M10 70H290" stroke="#f1dfd2" stroke-width="1"/><polyline points="${points}" fill="none" stroke="#ff7900" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${nums.map((v,i)=>`<circle cx="${12+i*276/(nums.length-1)}" cy="${66-(v-min)/rng*48}" r="4" fill="#fff" stroke="#ff7900" stroke-width="2"/>`).join('')}</svg>`}
function valText(r,k){if(!r)return 'No readings yet';if(k==='bp')return `${r.sys}/${r.dia} mmHg`;if(k==='meals')return `${fmt(sumToday('meals','calories'))} kcal logged`;if(k==='water')return `${fmt(sumToday('water','value'))} ml today`;if(k==='exercise')return `${fmt(sumToday('exercise','value'))} min today`;if(k==='steps')return `${fmt(sumToday('steps','value'))} steps today`;if(k==='skin')return String(r.value);return `${typeof r.value==='number'?fmt(r.value):safe(r.value)}${['weight','heart','oxygen','temp','sleep','waist'].includes(k)?' '+getMod(k).unit:''}`}
function sumToday(k,field){return s.logs.filter(x=>x.kind===k&&x.date===today()).reduce((v,r)=>v+Number(r[field]||0),0)}
function card(k){let m=getMod(k),r=latest(k),count=logs(k).length,unit=m.unit;let goalLine='';if(k==='weight' && s.goal.target && r && typeof r.value==='number')goalLine=`<div class="sub" style="margin:5px 0 9px">Your goal: ${safe(s.goal.target)} kg (${safe(s.goal.type)})</div><div class="progress"><span style="width:${Math.min(100,Math.max(4,Math.round(100-100*Math.abs(Number(s.goal.target)-r.value)/Math.max(Math.abs(Number(s.goal.target)-Number(s.goal.weight||r.value)),1))))}%"></span></div>`;
if(k==='meals'){goalLine=`<div class="grid2"><div class="stat"><strong>${fmt(sumToday('meals','calories'))}</strong><span>calories logged · goal ${fmt(s.goal.kcal)}</span></div><div class="stat"><strong>${fmt(sumToday('meals','protein'))} g</strong><span>protein logged · goal ${fmt(s.goal.protein)} g</span></div></div><div class="hint">${s.logs.some(x=>x.kind==='meals'&&x.date===today()&&x.approx)?'One or more meals are approximate or missing quantities. Totals may be incomplete.':'These are logged totals, not proof of everything eaten.'}</div>`}
if(k==='water')goalLine=`<div class="progress"><span style="width:${Math.min(100,Math.round(sumToday('water','value')/Math.max(s.goal.water,1)*100))}%"></span></div><div class="hint">Your chosen goal: ${fmt(s.goal.water)} ml</div>`;
return `<div class="card stack" data-card="${k}"><div class="row between"><div class="metric-head"><div class="tile-icon">${m.icon}</div><div><div class="section">${safe(m.name)}</div><div class="sub">${count} saved ${count===1?'entry':'entries'}</div></div></div><button class="iconbtn" data-a="hide" data-id="${k}" aria-label="Hide ${safe(m.name)}" title="Hide this card">−</button></div><div class="big" style="font-size:${k==='bp'?30:30}px">${valText(r,k)}</div>${goalLine}${weeklyMini(k)}<div class="row" style="margin-top:2px"><button class="btn sm" style="flex:1" data-a="log" data-id="${k}">＋ ${k==='meals'?'Add Food':k==='water'?'Add Water':'Log'}</button><button class="btn outline sm" style="flex:1" data-a="details" data-id="${k}">History & Details →</button></div></div>`}
function recommend(){let suggest=[];if(s.modules.includes('weight')&&!s.modules.includes('meals'))suggest.push({id:'meals',why:'Tracking weight? Food logs may help you understand your routine.'});if(s.modules.includes('bp')&&!s.modules.includes('heart'))suggest.push({id:'heart',why:'Your readings may also include heart rate.'});if(s.modules.includes('meals')&&!s.modules.includes('water'))suggest.push({id:'water',why:'Want a quick way to remember your water intake?'});if(s.modules.includes('steps')&&!s.modules.includes('sleep'))suggest.push({id:'sleep',why:'Would you like to observe your sleep pattern?'});return suggest.slice(0,1).map(v=>`<div class="recommend"><span class="reco-emoji">✨</span><div style="flex:1"><b style="font-size:13px">Only if you're interested</b><div class="sub">${v.why}</div><button class="link" data-a="add" data-id="${v.id}">＋ Add ${getMod(v.id).name}</button></div></div>`).join('')}
function health(){return `<div class="stack gap-lg"><div><div class="row between"><div><div class="eyebrow">Your private space</div><h1 class="h1">My Health</h1></div><span class="pill neutral">${nowDate()}</span></div><p class="subtitle">Only the things you choose, all in one place.</p></div>${s.modules.length?s.modules.map(card).join(''):`${emptyState()}`}${s.modules.length?`<button class="btn outline full" data-a="catalog">＋ Add another health card</button>${recommend()}<div class="card stack"><div class="section">Your tools</div><div class="grid2"><button class="btn subtle" data-a="sub" data-id="week">📈 My Week</button><button class="btn subtle" data-a="sub" data-id="plan">📋 My Plan</button><button class="btn subtle" data-a="sub" data-id="history">🕘 All History</button><button class="btn subtle" data-a="sub" data-id="more">✨ More Tools</button></div></div>`:''}<div class="sub" style="text-align:center">No user types. Everything is optional. Scan is always available below.</div></div>`}
function scanner(){return `<div class="stack gap-lg"><div><div class="eyebrow">Reliv kiosk companion</div><h1 class="h1">Scan a Health QR</h1><p class="subtitle">Save your kiosk measurements to My Health. No payment, account, or activation code.</p></div><div class="scanbox" id="cameraBox"><video autoplay playsinline muted id="cam"></video><div class="scan-corners"></div><div class="scantext" id="scanlabel">Align a Reliv health QR here</div></div><button class="btn full" data-a="camera">📷 ${scanStream?'Stop Camera':'Open Camera'}</button><div class="card stack"><div class="section">Test the complete experience</div><p class="sub">Demo readings are fictional and clearly marked. They do not affect any real kiosk.</p>${btn('Try a Sample Health QR','sampleScan','full subtle')}<div class="line"></div><div class="hint">On compatible devices, camera scanning uses the browser's built-in QR detection. QR payloads are never trusted simply because they scan; real kiosk imports require an authenticated format.</div></div></div>`}
function ai(){let msgs=s.messages||[];return `<div class="stack gap-lg"><div><div class="eyebrow">Personal health companion</div><h1 class="h1">Ask Reliv AI ✦</h1><p class="subtitle">Ask about your own logs, create buttons, adjust your plan or find an easier way to track.</p></div><div class="card chatwrap" id="chatwrap"><div class="bubble ai">Hi! I can help you choose what to track. For example, say <b>“Add a button to log creatine”</b> or <b>“How was my week?”</b></div>${msgs.slice(-10).map(x=>`<div class="bubble ${x.who==='me'?'you':'ai'}">${safe(x.text)}</div>`).join('')}</div><div class="row wrap">${['Create a walking button','I drank 500ml water','Summarize my week','I want to gain weight','I went to a wedding buffet'].map(x=>`<button class="pillbtn" data-a="prompt" data-q="${safe(x)}">${safe(x)}</button>`).join('')}</div><div class="chat-entry"><textarea id="chatInput" placeholder="Ask or tell Reliv anything..." rows="2"></textarea><button data-a="send" aria-label="Send message">➤</button></div><div class="row between"><button class="btn subtle sm" data-a="speak">🎙 Speak to Reliv</button><span class="hint">Offline demo coach · not clinical advice</span></div></div>`}
function subScreen(){let top=`<button class="link" data-a="back">← My Health</button>`;if(screen==='week'){let keys=[-6,-5,-4,-3,-2,-1,0],food=k=>s.logs.filter(x=>x.kind==='meals'&&x.date===dateN(k)).reduce((a,b)=>a+Number(b.calories||0),0),water=k=>s.logs.filter(x=>x.kind==='water'&&x.date===dateN(k)).reduce((a,b)=>a+Number(b.value||0),0);let done=new Set(s.logs.map(x=>x.date)).size;return `<div class="stack gap-lg">${top}<div><div class="eyebrow">Progress, without pressure</div><h1 class="h1">My Week</h1><p class="subtitle">Showing the last seven days of what you actually logged.</p></div><div class="card"><div class="grid2"><div class="stat"><strong>${done}</strong><span>days with recorded activity</span></div><div class="stat"><strong>${s.logs.filter(x=>x.date===today()).length}</strong><span>entries today</span></div></div><div class="sub" style="margin-top:12px">Days without entries are marked as not logged, not zero.</div></div><div class="card stack"><div class="section">Daily nutrition logged</div>${keys.map(k=>`<div class="row"><span class="sub" style="width:42px">${new Date(dateN(k)+'T12:00:00').toLocaleDateString('en',{weekday:'short'})}</span><div style="flex:1" class="progress"><span style="width:${Math.min(100,Math.round(food(k)/Math.max(s.goal.kcal,1)*100))}%"></span></div><span class="sub" style="width:77px;text-align:right">${food(k)?fmt(food(k))+' kcal':'Not logged'}</span></div>`).join('')}</div><div class="card stack"><div class="section">Progress & habits</div><div class="sub">Latest weight: ${latest('weight')?valText(latest('weight'),'weight'):'Not logged'} · Total water logged this week: ${fmt(keys.reduce((x,k)=>x+water(k),0))} ml</div>${s.modules.filter(k=>['weight','water','steps','exercise','bp'].includes(k)).map(k=>`<button class="btn subtle sm" data-a="details" data-id="${k}">${getMod(k).name} History →</button>`).join('')||'<div class="hint">Add a tracking card to build trends.</div>'}</div><button class="btn" data-a="sub" data-id="achievements">🔥 Streaks & Milestones</button></div>`}
if(screen==='plan')return `<div class="stack gap-lg">${top}<div><div class="eyebrow">Optional and adaptable</div><h1 class="h1">My Plan</h1><p class="subtitle">Set a goal only when you want one. Nothing is locked.</p></div><div class="card stack"><div class="section">My current goal</div><div class="big" style="font-size:22px">${s.goal.type==='none'?'No goal set':safe(({gain:'Gain weight',loss:'Lose weight',maintain:'Maintain weight',general:'General wellbeing',skin:'Skincare'}[s.goal.type]||s.goal.type))}</div><p class="sub">${s.goal.target?'Target weight: '+safe(s.goal.target)+' kg':'You can track your health without selecting a weight goal.'}</p>${btn('Change My Goal','goal','full subtle')}</div><div class="card stack"><div class="section">How is today going?</div><div class="sub">Adjust the day’s suggestions without resetting your goals.</div><div class="seg">${['Normal day','Very busy','Low energy','Travelling','Eating out','Unwell'].map(x=>`<button data-a="daymode" data-val="${x}" class="${s.dayMode===x?'selected':''}">${x}</button>`).join('')}</div><div class="recommend"><span>✨</span><div class="sub">${s.dayMode==='Very busy'?'Keep things quick: log food roughly and skip nonessential routines.':s.dayMode==='Eating out'?'You can use the feast estimator without knowing exact serving sizes.':s.dayMode==='Unwell'?'Focus on rest. Do not let habit targets override your wellbeing.':'You can focus on one useful habit today.'}</div></div></div><div class="card stack"><div class="section">Today's quick actions</div>${s.modules.includes('water')?btn('💧 Add 250ml Water','quickwater','full subtle'):''}${s.modules.includes('meals')?btn('🍽️ Log Food','log','full subtle','data-id="meals"'):''}${s.modules.includes('exercise')?btn('🏋️ Record Exercise','log','full subtle','data-id="exercise"'):''}<button class="btn outline full" data-a="reminders">🔔 Meal & Habit Reminders</button></div></div>`;

if(screen==='more')return `<div class="stack gap-lg">${top}<h1 class="h1">More Tools</h1><p class="subtitle">These stay out of the way until you choose them.</p><div class="card stack">${[['week','📈','Weekly Review'],['plan','🎯','Adaptive Plan & Goals'],['achievements','🔥','Streaks & Milestones'],['reminders','🔔','Reminders & Quiet Hours'],['photos','📸','Private Progress Photos'],['screening','🌸','PCOS Information & Notes'],['history','🕘','Health History'],['settings','⚙️','Settings & Backup']].map(([a,i,n])=>`<button class="listrow" style="width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);background:none;min-height:52px" data-a="${a==='reminders'||a==='settings'?a:'sub'}" ${a==='reminders'||a==='settings'?'':'data-id="'+a+'"'}><strong>${i} ${n}</strong><span>›</span></button>`).join('')}</div></div>`;
if(screen==='achievements'){const days=[...new Set(s.logs.map(x=>x.date))].sort().reverse();let streak=0;for(let i=0;i<365;i++){if(days.includes(dateN(-i)))streak++;else if(i>0||days.length)break};const xp=s.logs.length*10;return `<div class="stack gap-lg">${top}<h1 class="h1">My Milestones</h1><p class="subtitle">Optional motivation—not a measure of medical health.</p><div class="card stack"><div class="grid2"><div class="stat"><strong>🔥 ${streak}</strong><span>current logging streak</span></div><div class="stat"><strong>✨ ${xp}</strong><span>activity XP</span></div></div><div class="sub">Every day you make at least one entry counts. Missing days are simply missing days.</div></div><div class="card stack"><div class="section">7-Day Kickstart</div><div class="sub">Build your own routine at your own pace. No payments, no streak-restoration offers.</div><label class="checkline"><input type="checkbox" id="showStreak" ${s.prefs.streaks?'checked':''}>Show a streak chip on My Health</label>${btn('Save Preference','streakSettings')}</div></div>`}
if(screen==='photos')return `<div class="stack gap-lg">${top}<h1 class="h1">Private Progress Photos</h1><p class="subtitle">Optional pictures stored only in this browser on your device. Clearing browser storage can erase them.</p><div class="card stack"><div class="field"><label>Add a comparison photo</label><input type="file" accept="image/*" id="progressPhoto"></div>${btn('Save Photo Locally','savePhoto','full')}</div><div class="catalog">${s.photos.map((p,i)=>`<div class="card"><img alt="Private progress photo" src="${p.data}" style="width:100%;border-radius:10px"><div class="hint">${safe(p.date)}</div><button class="link" data-a="removePhoto" data-index="${i}">Delete</button></div>`).join('')}</div></div>`
if(screen==='screening')return `<div class="stack gap-lg">${top}<h1 class="h1">Hormonal Health Information</h1><p class="subtitle">An optional educational checklist, not a diagnosis or screening tool.</p><div class="card stack"><div class="section">PCOS information</div><p class="sub">Changes in cycles, hair growth, acne and other symptoms can have many explanations. A clinician can help investigate persistent concerns.</p>${['Irregular periods','New or persistent acne','Hair thinning','Increased facial/body hair','Recent unexplained weight changes'].map(x=>`<label class="checkline"><input type="checkbox">${x}</label>`).join('')}<div class="recommend"><span>🩺</span><div class="sub">This is a private, optional educational note. Selected symptoms are not stored or analyzed in this demonstration.</div></div>${btn('Close','back','full subtle')}</div></div>`
return health()}
function renderModal(){if(!modal){q('modal').innerHTML='';return}let header=(h,sub)=>`<div class="handle"></div><div class="row between" style="margin-bottom:12px"><h2>${h}</h2><button class="iconbtn" data-a="close">✕</button></div>${sub?`<p class="sub" style="margin-bottom:13px">${sub}</p>`:''}`;
let body='';if(modal==='catalog'){const choices=Object.keys({...MODULES,...s.custom}).filter(k=>!s.modules.includes(k));body=header('Add to My Health','Choose only what interests you. You can hide anything later.')+`<div class="catalog">${choices.map(k=>`<button class="choose" data-a="add" data-id="${safe(k)}"><span class="emoji">${getMod(k).icon}</span><strong>${safe(getMod(k).name)}</strong><span>＋ Add</span></button>`).join('')}</div><div class="line" style="margin:16px 0"></div>${btn('✨ Create My Own Tracker','custom','full outline')}`}

if(modal==='log'){const m=getMod(active),latestVal=latest(active);body=header('Log '+safe(m.name),'Save an entry now. You can correct it from History.')+(active==='meals'?mealForm():active==='bp'?`<div class="grid2"><div class="field"><label>Systolic (top)</label><input id="sys" type="number" inputmode="numeric" placeholder="120" min="40" max="300"></div><div class="field"><label>Diastolic (bottom)</label><input id="dia" type="number" inputmode="numeric" placeholder="80" min="30" max="200"></div></div>`:active==='skin'?`<div class="field"><label>Routine</label><select id="logValue"><option>AM cleanse & SPF</option><option>PM cleanse & moisturize</option><option>Used sunscreen</option><option>Skipped today</option></select></div>`:active==='mood'?`<div class="field"><label>How are you feeling?</label><select id="logValue"><option>Good</option><option>Okay</option><option>Low energy</option><option>Stressed</option><option>Unwell</option></select></div>`:active==='exercise'?`<div class="field"><label>Activity</label><select id="activityType"><option>Walking</option><option>Gym</option><option>Yoga</option><option>Cardio</option><option>Other</option></select></div><div class="field"><label>Duration in minutes</label><input id="logValue" type="number" inputmode="numeric" placeholder="30" min="1" max="1440"></div>`:`<div class="field"><label>${active==='notes'?'Your note':`Value ${m.unit?'('+m.unit+')':''}`}</label><${['notes','supplements'].includes(active)?'textarea':'input'} id="logValue" ${['notes','supplements'].includes(active)?'':`type="${['weight','heart','oxygen','temp','water','steps','sleep','waist'].includes(active)?'number':'text'}" inputmode="decimal" step="any"`} placeholder="${safe(active==='weight'?'65.5':active==='water'?'250':active==='sleep'?'7.5':m.unit)}"></${['notes','supplements'].includes(active)?'textarea':'input'}>`)+(active==='water'?`<div class="seg" style="margin-bottom:15px">${[250,500,1000].map(x=>`<button data-a="quickWater" data-val="${x}">+ ${x}ml</button>`).join('')}</div>`:'')+btn('Save Entry','saveLog','full')}
if(modal==='goal'){body=header('My Goal','Optional. Change it anytime; history stays intact.')+`<div class="field"><label>What would you like to work toward?</label><select id="goalType"><option value="none" ${s.goal.type==='none'?'selected':''}>No specific goal</option><option value="gain" ${s.goal.type==='gain'?'selected':''}>Gain weight / build muscle</option><option value="loss" ${s.goal.type==='loss'?'selected':''}>Lose weight</option><option value="maintain" ${s.goal.type==='maintain'?'selected':''}>Maintain weight</option><option value="general" ${s.goal.type==='general'?'selected':''}>General wellbeing</option><option value="skin" ${s.goal.type==='skin'?'selected':''}>Skin routine</option></select></div><div class="grid2"><div class="field"><label>Starting weight (kg)</label><input id="goalWeight" type="number" step=".1" value="${safe(s.goal.weight)}" placeholder="65"></div><div class="field"><label>Target weight (kg)</label><input id="goalTarget" type="number" step=".1" value="${safe(s.goal.target)}" placeholder="75"></div></div><div class="grid2"><div class="field"><label>Daily calories (optional)</label><input id="goalCal" type="number" value="${safe(s.goal.kcal)}"></div><div class="field"><label>Protein (g, optional)</label><input id="goalProt" type="number" value="${safe(s.goal.protein)}"></div></div><div class="field"><label>Diet preference</label><select id="goalDiet">${['Any','Vegetarian','Vegan','Eggetarian','Non-vegetarian'].map(x=>`<option ${s.goal.diet===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="hint" style="margin-bottom:15px">Targets here are user-selected demo values, not a medical or nutritional prescription.</div>${btn('Save My Goal','saveGoal','full')}`}
if(modal==='sampleScan')body=header('Sample Health QR','Example values to show how the kiosk import would behave.')+`<div class="card stack" style="box-shadow:none">${[['BP','122/78 mmHg'],['SpO₂','98%'],['Heart rate','73 bpm'],['Temperature','36.7°C'],['Weight','66.4 kg']].map(([k,v])=>`<div class="listrow"><b>${k}</b><strong>${v}</strong></div>`).join('')}</div><p class="hint" style="margin:12px 0">No real device was read. Health QR transfers require authentication and user consent in production.</p>${btn('Save All 5 Measurements','importSample','full')}`;
if(modal==='reminders')body=header('My Reminders','No reminders are enabled until you switch them on.')+`<label class="checkline"><input type="checkbox" id="enableReminders" ${s.prefs.reminders?'checked':''}>I want meal and health reminders</label><div class="grid2">${[['Breakfast','breakfast'],['Lunch','lunch'],['Dinner','dinner']].map(([name,k])=>`<div class="field"><label>${name}</label><input id="t-${k}" type="time" value="${safe(s.prefs[k])}"></div>`).join('')}<div class="field"><label>Quiet hours start</label><input type="time" id="quietStart" value="${s.prefs.quietStart}"></div><div class="field"><label>Quiet hours end</label><input type="time" id="quietEnd" value="${s.prefs.quietEnd}"></div></div><label class="checkline"><input id="waterRemind" type="checkbox" ${s.prefs.water?'checked':''}>Also remind me to drink water</label>${btn('Save My Preferences','saveReminders','full')}<div class="line" style="margin:12px 0"></div><div class="sub">For actual lock-screen notifications, user permission and a background push service are required. iOS web push is supported for installed Home Screen web apps on compatible versions. This demo only saves preferences.</div>${btn('Request device permission (optional)','askPermission','full outline')}`;
if(modal==='settings')body=header('Settings','Simple controls, without technical account requirements.')+`<div class="field"><label>Appearance</label><select id="theme"><option value="light" ${s.prefs.theme==='light'?'selected':''}>Orange + White</option><option value="dark" ${s.prefs.theme==='dark'?'selected':''}>Dark</option></select></div><div class="field"><label>Language</label><select id="language">${['English','हिन्दी (voice guidance)','বাংলা (voice guidance)'].map(x=>`<option ${s.prefs.lang===x?'selected':''}>${x}</option>`).join('')}</select></div>${btn('Save Appearance','savePrefs','full')}${btn('🔔 My Reminders','reminders','full outline')}<div class="line" style="margin:12px 0"></div>${btn('📦 Load realistic sample health data','sampleData','full subtle')}${btn('📄 Export my records (JSON)','export','full outline')}${btn('🗑️ Reset this demo','confirmReset','full outline')}<p class="hint">Records are saved on this device's browser. Clearing browser data or changing devices can remove them. Production secure backup is not implemented here.</p>`;
if(modal==='confirmReset')body=header('Erase your local demo data?','This deletes all local measurements, photos, plans, and custom cards in this browser. It cannot be undone.')+btn('Yes, erase everything','reset','full')+btn('Cancel','settings','full outline');
if(modal==='choosePhoto')body=header('Photo Meal Preview','Photos may help estimate portions, but actual AI vision is not connected here.')+`<div class="field"><label>Upload a meal photo</label><input id="mealPhoto" type="file" accept="image/*" capture="environment"></div><p class="hint">For the interactive demo, describe your meal or enter an estimate manually instead.</p>${btn('Back to Meal Logging','backMeal','full outline')}`;
q('modal').innerHTML=`<div class="modalwrap" data-a="dismiss"><div class="sheet" role="dialog" aria-modal="true" aria-label="${safe(modal)}" onclick="event.stopPropagation()">${body}</div></div>`;}
function mealForm(){return `<div class="stack"><div class="field"><label>What did you eat?</label><textarea id="mealDesc" placeholder="2 rotis, dal, rice... or wedding buffet"></textarea></div><div class="field"><label>How much did you eat?</label><div class="seg">${[['small','A little'],['normal','Normal'],['large','A lot'],['unknown','Not sure']].map(([v,t])=>`<button type="button" data-a="portion" data-val="${v}" class="${portion===v?'selected':''}">${t}</button>`).join('')}</div></div><div class="grid2"><div class="field"><label>Calories, if known</label><input id="mealCalories" type="number" inputmode="numeric" min="0" placeholder="Optional"></div><div class="field"><label>Protein (g), if known</label><input id="mealProtein" type="number" inputmode="numeric" min="0" placeholder="Optional"></div></div><div class="row wrap">${btn('✨ Estimate from description','estimateMeal','sm subtle')}${btn('📸 Meal photo','choosePhoto','sm outline')}</div><div class="recommend"><span>🍛</span><div><b style="font-size:12px">Buffet or dawat?</b><p class="sub">Write what you remember. If quantity is unknown, save without inventing precise calories.</p></div></div>${btn('Save Meal','saveLog','full')}</div>`}
function addModule(k){if(!getMod(k).name||s.modules.includes(k)){pop('This card is already in My Health');return}s.modules.push(k);save();modal='';screen='main';tab='health';pop(`${getMod(k).name} added. You can hide it anytime.`);render()}
function parseMeal(desc,p){const t=desc.toLowerCase(),foods=[[/\broti|chapati/,110,3],[/\begg/,75,6],[/\bdal/,185,9],[/\brice/,200,4],[/biryani/,390,14],[/paneer/,260,14],[/chicken/,240,26],[/banana/,100,1],[/milk/,125,8],[/bread|toast/,100,3],[/apple/,95,0],[/curd|yogurt/,115,6],[/sweet|dessert|gulab jamun/,190,3]];let c=0,pr=0,matched=0;for(const [re,kcal,pro] of foods){if(re.test(t)){const rx=new RegExp('(\\d+)\\s*(?:x|pieces?|pcs?)?\\s*'+re.source.replaceAll('\\b',''),'i'),num=rx.exec(t),n=num?Math.min(Number(num[1]),6):1;c+=kcal*n;pr+=pro*n;matched++}}if(!matched)return null;let f={small:.65,normal:1,large:1.5,unknown:1}[p]||1;return{cal:Math.round(c*f),prot:Math.round(pr*f),approx:true}}
function saveMeal(){const desc=q('mealDesc')?.value.trim();if(!desc)return pop('Describe the meal first');const eCal=q('mealCalories').value,ePr=q('mealProtein').value,est=parseMeal(desc,portion);const calories=eCal!==''?+eCal:portion==='unknown'?null:(est?est.cal:null),protein=ePr!==''?+ePr:portion==='unknown'?null:(est?est.prot:null);log('meals',desc,{calories,protein,approx:(eCal===''||ePr===''),portion,desc});rclose();if(calories===null)pop('Meal saved with quantities unknown. No calories invented.');}
function sampleData(){s=initial();s.sample=true;s.modules=['weight','bp','oxygen','meals','water','steps','sleep'];s.goal={type:'gain',target:'75',weight:'65',height:'185',age:'22',diet:'Any',kcal:2600,protein:110,water:2500};const now=Date.now();let ix=0;for(let day=-6;day<=0;day++){let dt=dateN(day),ts=now+(day*86400000);for(const [kind,value,extra] of [['weight',+(65+.22*(day+6)).toFixed(1),{}],['water',1400+150*(day+6),{}],['steps',4400+650*(day+6),{}],['sleep',+(6.6+.13*(day+6)).toFixed(1),{}],['meals','Roti, dal & rice',{calories:1250+140*(day+6),protein:54+7*(day+6),desc:'Roti, dal & rice',approx:false}]] )s.logs.push({id:'s'+(ix++),kind,value,date:dt,ts:ts+(ix*100),source:'Example data',...extra});}s.logs.push({id:'sbp',kind:'bp',sys:122,dia:78,date:today(),ts:now+10000,source:'Example kiosk scan',value:0});s.logs.push({id:'so2',kind:'oxygen',value:98,date:today(),ts:now+15000,source:'Example kiosk scan'});s.messages=[];save();modal='';screen='main';tab='health';render();pop('Example data loaded. Everything is editable.');}
function aiReply(msg){const t=msg.toLowerCase(),date=t.match(/(?:to|at)\s*(\d{2}(?:\.\d+)?)/),number=t.match(/(\d+(?:\.\d+)?)/);let response='I can help you add or manage personal tracking cards. Try “Create a walking button”, “Log 500ml water”, “I want to gain weight”, or “Summarize my week”.';if(/creatine|custom|button|tracker/.test(t)){let k=t.includes('creatine')?'Creatine':t.includes('walking')?'Walking minutes':t.includes('meditation')?'Meditation':'My Habit';response=`I can add “${k}” as a tracker. I’ll suggest it below for your confirmation.`;modal='';s.pending={type:'addCustom',name:k,unit:k==='Creatine'?'g':'minutes'}}else if(/walk|step/.test(t)&&/track|create|add/.test(t)){response='You can track walking or steps. Select “Add Steps” below to confirm.';s.pending={type:'add',kind:'steps'}}else if(/water|drank/.test(t)&&number){response=`I understood ${number[1]} ml of water. Tap confirm to save it.`;s.pending={type:'water',value:Number(number[1])}}else if(/gain|lose|loss|weight goal|target/.test(t)){response='You can change your goal anytime without deleting previous readings. Tap Set Goal below.';s.pending={type:'goal'}}else if(/week|progress|summary/.test(t)){const recent=s.logs.filter(x=>x.date>=dateN(-6));response=`Over the past seven days, you have ${recent.length} recorded entries. Your latest weight is ${latest('weight')?valText(latest('weight'),'weight'):'not yet recorded'}. Days without logs are not counted as zero. Tap My Week for detailed trends.`;s.pending={type:'week'}}else if(/meal|food|buffet|dawat|wedding/.test(t)){response='If you do not know how much you ate, log what you remember and choose “Not sure”. Reliv can keep an honest, incomplete record instead of inventing calories.';s.pending={type:'add',kind:'meals'}}else if(/remind|notification/.test(t)){response='Reminders stay off by default. You can turn them on and choose breakfast, lunch and dinner times yourself.';s.pending={type:'reminders'}}else if(/bp|blood pressure/.test(t)){response='Would you like a Blood Pressure card? It can show your current and past readings. It cannot diagnose a condition.';s.pending={type:'add',kind:'bp'}}else if(/skincare|skin|acne/.test(t)){response='You can add a private Skin Routine card to track morning and evening care. For persistent or severe skin concerns, seek professional assessment.';s.pending={type:'add',kind:'skin'}}else {s.pending=null};return response}
function aiConfirm(){let p=s.pending;if(!p)return; if(p.type==='add')addModule(p.kind);else if(p.type==='water'){if(!s.modules.includes('water'))s.modules.push('water');log('water',p.value);page('health')}else if(p.type==='addCustom'){let k='c'+Date.now();s.custom[k]={name:p.name,icon:'✦',unit:p.unit,desc:'My own tracker'};addModule(k)}else if(p.type==='goal'){modal='goal';renderModal()}else if(p.type==='week'){screen='week';tab='health';render()}else if(p.type==='reminders'){modal='reminders';renderModal()}s.pending=null;save()}
function sendAI(msg){msg=msg||q('chatInput')?.value.trim();if(!msg)return; s.messages.push({who:'me',text:msg});let answer=aiReply(msg);s.messages.push({who:'ai',text:answer});save();render();let el=q('chatwrap');if(el)el.scrollTop=el.scrollHeight}
function camera(){if(scanStream){stopCam();render();return}if(!navigator.mediaDevices?.getUserMedia){pop('Camera not supported here. Use the sample QR flow.');return}navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}).then(stream=>{scanStream=stream;render();let v=q('cam');if(v){v.srcObject=stream;v.play().catch(()=>{})}if('BarcodeDetector' in window){const detect=new BarcodeDetector({formats:['qr_code']});scanTimer=setInterval(async()=>{try{if(v&&v.readyState===4){const codes=await detect.detect(v);if(codes.length){const raw=codes[0].rawValue||'';if(!raw.startsWith('RELIV_HEALTH_DEMO:')){pop('Not a recognized demo health QR');return}stopCam();modal='sampleScan';render()}}}catch(e){}},1100)}else pop('Camera is open. Use the sample import on browsers without QR detection.');}).catch(()=>pop('Camera permission was declined or unavailable.'))}
function stopCam(){if(scanTimer)clearInterval(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
function getClick(el){const b=el.closest('[data-a]');return b?{a:b.dataset.a,id:b.dataset.id,val:b.dataset.val,q:b.dataset.q,idx:b.dataset.index}:null}
document.addEventListener('click',ev=>{const x=getClick(ev.target);if(!x)return;const {a,id,val}=x;if(a==='page')return page(id);if(a==='back'){screen='main';render();return}if(a==='sub'){screen=id;active='';render();return}if(a==='close'||a==='dismiss')return rclose();if(a==='catalog'){modal='catalog';renderModal();return}if(a==='add')return addModule(id);if(a==='hide'){s.modules=s.modules.filter(k=>k!==id);save();render();pop('Card hidden. Your records remain saved.');return}if(a==='custom'){modal='custom';renderModal();return}if(a==='saveCustom'){let name=q('customName')?.value.trim(),unit=q('customUnit')?.value.trim()||'';if(!name)return pop('Enter a button name');const k='custom'+Date.now();s.custom[k]={name,icon:'✦',unit,desc:'Custom health habit'};addModule(k);return}if(a==='log'){active=id||active;modal='log';portion='normal';renderModal();return}if(a==='details'){active=id;screen='details';render();return}if(a==='quickWater'){log('water',Number(val));rclose();return}if(a==='saveLog'){if(active==='meals')return saveMeal();if(active==='bp'){let sys=+q('sys').value,dia=+q('dia').value;if(!sys||!dia||sys<40||sys>300||dia<30||dia>200)return pop('Enter both valid readings');log('bp',0,{sys,dia});}else{let k=active,v=q('logValue')?.value.trim();if(!v)return pop('Enter a value');if(['weight','heart','oxygen','temp','water','steps','sleep','waist','exercise'].includes(k)){v=Number(v);if(!isFinite(v)||v<0||v>100000)return pop('Enter a valid positive value');if(k==='weight'&&(v<10||v>400))return pop('Please check your weight entry');if(k==='oxygen'&&(v<0||v>100))return pop('Oxygen saturation must be 0–100%');}log(k,v,k==='exercise'?{activity:q('activityType')?.value}:{});}rclose();return}if(a==='portion'){portion=val;renderModal();return}if(a==='estimateMeal'){const desc=q('mealDesc').value.trim();if(!desc)return pop('Describe your meal first');const v=parseMeal(desc,portion);if(!v)return pop('No reliable estimate found; log with unknown quantities or enter your estimate.');q('mealCalories').value=v.cal;q('mealProtein').value=v.prot;pop('Rough estimate added. Please review quantities.');return}if(a==='choosePhoto'){const desc=q('mealDesc')?.value||'';window._mealDraft=desc;modal='choosePhoto';renderModal();return}if(a==='backMeal'){modal='log';active='meals';renderModal();if(window._mealDraft)q('mealDesc').value=window._mealDraft;return}if(a==='goal'){modal='goal';renderModal();return}if(a==='saveGoal'){s.goal.type=q('goalType').value;s.goal.target=q('goalTarget').value;s.goal.weight=q('goalWeight').value;s.goal.kcal=+q('goalCal').value||2200;s.goal.protein=+q('goalProt').value||90;s.goal.diet=q('goalDiet').value;save();rclose();pop('Goal saved. Previous records were preserved.');return}if(a==='daymode'){s.dayMode=val;save();render();return}if(a==='quickwater'){if(!s.modules.includes('water'))s.modules.push('water');log('water',250);render();return}if(a==='reminders'){modal='reminders';renderModal();return}if(a==='saveReminders'){s.prefs.reminders=q('enableReminders').checked;s.prefs.breakfast=q('t-breakfast').value;s.prefs.lunch=q('t-lunch').value;s.prefs.dinner=q('t-dinner').value;s.prefs.water=q('waterRemind').checked;s.prefs.quietStart=q('quietStart').value;s.prefs.quietEnd=q('quietEnd').value;save();rclose();pop(s.prefs.reminders?'Reminder choices saved. Scheduled push needs backend setup.':'All reminder choices disabled.');return}if(a==='askPermission'){if(!('Notification' in window)){pop('This browser does not support web notifications.');return}Notification.requestPermission().then(v=>{s.prefs.notifyStatus=v;save();pop('Device permission: '+v+'. This demo does not schedule background notifications.')}).catch(()=>pop('Permission request unavailable.'));return}if(a==='settings'){modal='settings';renderModal();return}if(a==='savePrefs'){s.prefs.theme=q('theme').value;s.prefs.lang=q('language').value;save();rclose();pop('Settings saved. Full app translation is not included in this demo.');return}if(a==='sampleData')return sampleData();if(a==='sampleScan'){modal='sampleScan';renderModal();return}if(a==='importSample'){[['bp',0,{sys:122,dia:78}],['oxygen',98,{}],['heart',73,{}],['temp',36.7,{}],['weight',66.4,{}]].forEach(([k,v,extra],i)=>{s.logs.push({id:'scan'+Date.now()+i,kind:k,value:v,...extra,date:today(),ts:Date.now()+i,source:'Example health QR'})});save();modal='';page('health');pop('Sample measurements imported. Add cards to display them.');return}if(a==='camera')return camera();if(a==='prompt'){q('chatInput').value=x.q;q('chatInput').focus();return}if(a==='send'){sendAI();return}if(a==='confirmAI'){aiConfirm();return}if(a==='speak'){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){pop('Voice input unavailable here. You can type instead.');return}let rec=new SR();rec.lang=s.prefs.lang.includes('हिन्दी')?'hi-IN':s.prefs.lang.includes('বাংলা')?'bn-IN':'en-IN';rec.onresult=e=>{const text=e.results[0][0].transcript;q('chatInput').value=text;pop('Transcribed. Tap send when ready.');};rec.onerror=()=>pop('Voice input unavailable right now');rec.start();return}if(a==='audio'){let text=tab==='health'?'My Health. Add only the things you want to track. Use the Scan button for kiosk measurements.':tab==='scan'?'Scan a Reliv health QR code to save your health measurements.':'Ask Reliv about your health logs and tracking buttons.';try{speechSynthesis.cancel();let sp=new SpeechSynthesisUtterance(text);sp.lang=s.prefs.lang.includes('हिन्दी')?'hi-IN':s.prefs.lang.includes('বাংলা')?'bn-IN':'en-IN';speechSynthesis.speak(sp)}catch(e){pop('Audio guide is not supported here.')}return}if(a==='streakSettings'){s.prefs.streaks=q('showStreak')?.checked||false;save();pop('Preference saved.');return}if(a==='removeLog'){if(!confirm('Delete this entry?'))return;s.logs=s.logs.filter(r=>r.id!==id);save();render();return}if(a==='savePhoto'){const file=q('progressPhoto')?.files?.[0];if(!file)return pop('Select a photo first');if(!file.type.startsWith('image/'))return pop('Please choose an image');let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let canv=document.createElement('canvas'),scale=Math.min(1,700/Math.max(im.width,im.height));canv.width=im.width*scale;canv.height=im.height*scale;canv.getContext('2d').drawImage(im,0,0,canv.width,canv.height);s.photos.push({date:today(),data:canv.toDataURL('image/jpeg',.65)});save();render();pop('Photo saved on this device only.')};im.src=reader.result};reader.readAsDataURL(file);return}if(a==='removePhoto'){s.photos.splice(Number(x.idx),1);save();render();return}if(a==='export'){const b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),link=document.createElement('a');link.href=url;link.download='Reliv_Care_My_Health_'+today()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1500);pop('Data file prepared');return}if(a==='confirmReset'){modal='confirmReset';renderModal();return}if(a==='reset'){s=initial();save();modal='';screen='main';tab='health';render();pop('Local demo data erased.');return}});
const originalAI=ai;ai=function(){const base=originalAI();const extra=s.pending?`<div class="card soft stack"><div class="section">Suggested action — your choice</div><div class="sub">Reliv will not add or change anything without confirmation.</div>${btn(s.pending.type==='add'?'＋ Add '+getMod(s.pending.kind).name:s.pending.type==='addCustom'?'＋ Create '+s.pending.name:s.pending.type==='water'?'Save '+s.pending.value+'ml Water':s.pending.type==='goal'?'Set My Goal':s.pending.type==='week'?'View My Week':'Open Reminder Settings','confirmAI','full')}</div>`:'';return base.replace('<div class="row wrap">',extra+'<div class="row wrap">')};

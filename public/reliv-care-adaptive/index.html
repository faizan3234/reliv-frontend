function goalProgress(){
 const current=Number(latest('weight')?.value||s.goal.weight), target=Number(s.goal.target), start=Number(s.goal.weight)||current,change=Math.abs(target-start);
 if(!current||!target||!change)return `<p class="sub">${s.goal.type==='maintain'?'Maintaining your current weight is an ongoing goal.':'Add a current weight and target to see progress.'}</p>`;
 const pct=Math.min(100,Math.max(0,Math.round((1-Math.abs(target-current)/change)*100)));
 const arr=logs('weight').filter(x=>typeof x.value==='number').slice(-5),first=arr[0],last=arr.at(-1);
 const weeks=first&&last&&last.ts>first.ts?(last.ts-first.ts)/604800000:0;
 const pace=weeks>0?(last.value-first.value)/weeks:0;
 let eta='Add more measurements to estimate a trend';
 if(s.goal.type==='maintain')eta='Maintenance is ongoing — there is no finish date';
 else if((s.goal.type==='gain'&&pace>.05)||(s.goal.type==='loss'&&pace<-.05)){
  const w=Math.abs(target-current)/Math.abs(pace);eta=w<200?`Illustrative trend: about ${Math.round(w)} weeks at your recent pace`:'Longer-term goal — more readings recommended';
 }else if(arr.length>=2)eta='Recent readings do not yet show progress toward this target';
 return `<div class="goal-progress"><div class="row between"><span>Current: <b>${current.toFixed(1)} kg</b></span><span>Target: <b>${target.toFixed(1)} kg</b></span></div><div class="progress"><span style="width:${pct}%"></span></div><small>${pct}% of the change from your starting weight · ${eta}</small></div>`;
}

function todaySuggestion(){let water=sumToday('water','value'),food=sumToday('meals','calories'),protein=sumToday('meals','protein');
 if(water<Number(s.goal.water||2500)*.82)return {label:'A little more water today',detail:`Water logged: ${(water/1000).toFixed(1)} L. Your daily target is ${(Number(s.goal.water||2500)/1000).toFixed(1)} L.`,action:'quickwater',text:'+ 250 ml',pct:Math.min(100,Math.round(water/Math.max(1,Number(s.goal.water||2500))*100))};
 if(s.goal.type==='gain' && protein<Number(s.goal.protein||90)*.85)return{label:'Time for a protein-rich meal?',detail:`Protein logged: ${Math.round(protein)} g. Choose a food and log it when you eat.`,action:'log',id:'meals',text:'Log Food',pct:Math.min(100,Math.round(protein/Math.max(1,Number(s.goal.protein||90))*100))};
 if(s.goal.type==='maintain')return{label:'Keep a comfortable routine',detail:'Maintain what works for you. Log what is useful and review trends over time.',action:'sub',id:'plan',text:'My Plan',pct:100};
 if(s.goal.type==='loss')return{label:'Keep meals balanced',detail:'No strict rules. Record what you ate or take a short walk when it suits you.',action:'log',id:'meals',text:'Log Food',pct:Math.min(100,Math.round(food/Math.max(1,Number(s.goal.kcal||2200))*100))};
 return {label:'Nice work. Keep your own pace.',detail:'Your records update as you log; no pressure to complete every habit.',action:'sub',id:'plan',text:'My Plan',pct:100};

function parseMeal(desc,p){const t=desc.toLowerCase(),foods=[[/\broti|chapati/,110,3],[/\begg/,75,6],[/\bdal/,185,9],[/\brice/,200,4],[/biryani/,390,14],[/paneer/,260,14],[/chicken/,240,26],[/banana/,100,1],[/milk/,125,8],[/bread|toast/,100,3],[/apple/,95,0],[/curd|yogurt/,115,6],[/sweet|dessert|gulab jamun/,190,3]];let c=0,pr=0,matched=0;for(const [re,kcal,pro] of foods){if(re.test(t)){const rx=new RegExp('(\\d+)\\s*(?:x|pieces?|pcs?)?\\s*'+re.source.replaceAll('\\b',''),'i'),num=rx.exec(t),n=num?Math.min(Number(num[1]),6):1;c+=kcal*n;pr+=pro*n;matched++}}if(!matched)return null;let f={small:.65,normal:1,large:1.5,unknown:1}[p]||1;return{cal:Math.round(c*f),prot:Math.round(pr*f),approx:true}}

function aiReply(msg){const t=msg.toLowerCase(),date=t.match(/(?:to|at)\s*(\d{2}(?:\.\d+)?)/),number=t.match(/(\d+(?:\.\d+)?)/);let response='I can help you track and understand your health. Try “Log 500ml water”, “I want to gain weight”, or “Summarize my week”.';if(/creatine|custom|button|tracker/.test(t)){let k=t.includes('creatine')?'Creatine':t.includes('walking')?'Walking minutes':t.includes('meditation')?'Meditation':'My Habit';response=`I can add “${k}” as a tracker. I’ll suggest it below for your confirmation.`;modal='';s.pending={type:'addCustom',name:k,unit:k==='Creatine'?'g':'minutes'}}else if(/walk|step/.test(t)&&/track|create|add/.test(t)){response='Your Walking & Steps tracker is already available. Open it in My Health whenever needed.';s.pending={type:'add',kind:'steps'}}else if(/water|drank/.test(t)&&number){response=`I understood ${number[1]} ml of water. Tap confirm to save it.`;s.pending={type:'water',value:Number(number[1])}}else if(/gain|lose|loss|weight goal|target/.test(t)){response='You can change your goal anytime without deleting previous readings. Tap Set Goal below.';s.pending={type:'goal'}}else if(/week|progress|summary/.test(t)){const recent=s.logs.filter(x=>x.date>=dateN(-6));response=`Over the past seven days, you have ${recent.length} recorded entries. Your latest weight is ${latest('weight')?valText(latest('weight'),'weight'):'not yet recorded'}. Days without logs are not counted as zero. Tap My Week for detailed trends.`;s.pending={type:'week'}}else if(/meal|food|buffet|dawat|wedding/.test(t)){response='Your meal logger is ready. Describe what you remember and choose “Not sure” for unknown portions. Reliv should never invent precise calories.';s.pending={type:'add',kind:'meals'}}else if(/remind|notification/.test(t)){response='Reminders stay off by default. You can turn them on and choose breakfast, lunch and dinner times yourself.';s.pending={type:'reminders'}}else if(/bp|blood pressure/.test(t)){response='Your Blood Pressure tracker is ready under Health & measurements. It shows your saved readings without diagnosing a condition.';s.pending={type:'add',kind:'bp'}}else if(/skincare|skin|acne/.test(t)){response='Your Skin Routine is ready under Skin & personal care. For persistent or severe skin concerns, seek professional assessment.';s.pending={type:'add',kind:'skin'}}else {s.pending=null};return response}

function v4Food(){const foods=[['Roti + dal','2 rotis and dal'],['Rice + chicken','Rice and chicken'],['Banana shake','Banana, milk, peanut butter'],['Wedding buffet','Wedding buffet / dawat']];return `<div class="card stack">${v4Tag('Log food your way','No need to count every gram','🍛')}<div class="v4-grid">${foods.map(([n,d])=>`<button data-a="v4FoodPreset" data-id="${safe(d)}"><span>🍽️</span><b>${n}</b><small>Tap to log</small></button>`).join('')}</div>${v4Button('Write what I ate','log','meals')}${v4Button('Take a meal photo (sample analysis)','v4Photo','meal','outline')}</div><div class="card stack">${v4Tag('Buffets & dawat','Select an approximate preset, or record unknown','🍲')}${[['600','Light tasting · ~600 kcal'],['850','Standard buffet · ~850 kcal'],['1200','Large feast · ~1200 kcal'],['700','Home thali · ~700 kcal'],['unknown','I don’t know the portion']].map(([v,t])=>v4Button(t,'v4Buffet',v,'outline')).join('')}<p class="hint">These are illustrative rough estimates, not measured calorie values. Choose “I don’t know” for uncertain amounts.</p></div><div class="card stack">${v4Tag('Quick macro adjustment','Only when you know the extra amount','⚖️')}<div class="v4-act">${[['100','+100 calories'],['500','+500 calories'],['p10','+10g protein'],['p25','+25g protein']].map(([k,t])=>v4Button(t,'v4Macro',k,'outline')).join('')}</div>${v4Button('Undo latest food or water log','v4Undo','','outline')}</div><div class="card stack">${v4Tag('My recent foods','One-tap reminders from your preferences','🥗')}${(v4.favFoods||[]).map(n=>v4Line(safe(n),'Tap to open food entry','v4FoodPreset',safe(n),'↻')).join('')}</div>`}
function v4Weight(){let weight=Number(latest('weight')?.value||s.goal.weight||66.3),tg=Number(s.goal.target||0),wlogs=s.logs.filter(x=>x.kind==='weight');const pace=wlogs.length>=2?((Number(wlogs.at(-1).value)-Number(wlogs[0].value))/Math.max(1,wlogs.length-1)*7).toFixed(2):'—';const gap=Math.abs(tg-weight);return `${v4Goals()}<div class="card stack">${v4Tag('Weight trend & forecast','Changes only when new measurements arrive','📈')}${v4Stats()}<div class="v4-graph">${wlogs.slice(-10).map((r,i)=>`<div title="${safe(r.value)} kg" style="height:${Math.max(18,Math.min(98,35+(Number(r.value)-weight)*15))}%"></div>`).join('')}</div><p class="sub">Observed sample change: ${pace} kg/week. Target difference: ${gap.toFixed(1)} kg.</p><p class="hint">Dates shown only when a meaningful trend can be estimated. Normal daily weight fluctuation is not a reliable forecast.</p><div class="v4-act">${v4Button('Log new weight','log','weight')}${v4Button('All measurements','sub','history','outline')}</div></div><div class="card stack">${v4Tag('Weight entry safeguards','Question unusual differences before counting a goal','🛡️')}<p class="sub">A change above 2 kg asks for confirmation. Above 5 kg is flagged as a large change. An example kiosk reading is not cryptographically verified.</p>${v4Button('Try unusual weight example','v4WeightFlag','','outline')}</div><div class="card stack">${v4Tag('Weigh-in frequency','No mandatory questionnaire','📆')}<div class="v4-chips">${['Daily','Every 3 days','Weekly','Whenever I like'].map(x=>`<button data-a="v4Frequency" data-id="${x}" class="${v4.frequency===x?'on':''}">${x}</button>`).join('')}</div>${v4Button('My private progress photos','sub','photos','outline')}</div>`}
function v4History(){const all=s.logs.slice().sort((a,b)=>b.ts-a.ts);return `<div class="card stack">${v4Tag('My 90-day archive','Not logged ≠ zero calories','🕘')}<div class="v4-scroll-list">${Array.from({length:90},(_,i)=>{const offset=-i,d=dateN(offset),n=all.filter(x=>x.date===new Date(Date.now()+offset*864e5).toLocaleDateString('en-CA')).length;return `<div class="v4-row v4-date"><b>${d}</b><span>${n?n+' entry'+(n>1?'s':''):'Not logged'}</span></div>`}).join('')}</div></div><div class="card stack">${v4Tag('Recent activity','Stored on this browser only','📜')}${all.slice(0,15).map(x=>`<div class="v4-row v4-date"><span>${safe(getMod(x.kind).name)} <small>${safe(x.date)}</small></span><b>${safe(x.kind==='bp'?x.sys+'/'+x.dia:x.kind==='meals'?x.desc||x.value:x.value)}</b></div>`).join('')}${v4Button('Undo latest entry','v4Undo','','outline')}${v4Button('Export everything','export','','outline')}</div>`}
function v4Streak(){const p=v4.streak,wb=v4.profile.wake||'07:00';let st=wb.split(':').map(Number),end=new Date();end.setHours(st[0],st[1],0,0);if(end<=new Date())end.setDate(end.getDate()+1);end.setTime(end.getTime()-3600000);const cycles= Math.max(0,Math.floor((end.getTime()-Date.now())/60000));return `<div class="card stack">${v4Tag('My 23-hour wellness cycle','Optional motivation, never punishment','🔥')}<div class="v4-mini4"><span>Streak<strong>${p.day} days</strong></span><span>Freeze Shields<strong>${p.freeze} / 3</strong></span><span>My XP<strong>${p.xp}</strong></span><span>Cycle ends in<strong>${Math.floor(cycles/60)}h ${cycles%60}m</strong></span></div><p>Wake-up time: ${safe(wb)} · Example first-week benchmark gradually increases from 55% toward 80%.</p><p class="hint">This is an illustrative streak engine, not certified historical scoring. Missing information is not silently counted as failure.</p><div class="v4-act">${v4Button('Use a Freeze Shield (demo)','v4Freeze')}${v4Button('View 7-Day Kickstart','v4Open','kickstart','outline')}</div></div><div class="card stack">${v4Tag('Streak restore','A missed day does not erase your progress','🌱')}<p class="sub">You can resume for free. Paid refundable restoration is described in the original spec, but financial transactions are deliberately disabled in this preview.</p>${v4Button('Resume free','v4Resume','','outline')}${v4Button('See commitment rules (sample)','v4Commit','','outline')}</div>`}
function v4Kickstart(){let days=['Start simple','Drink water','Measure or reflect','Keep a kind routine','Log a meal','Ask a question','Celebrate what worked'];return `<div class="card stack">${v4Tag('Your first 7 days','A short, optional habit starter','🚀')}<div class="v4-kick">${days.map((x,i)=>`<button data-a="v4Kick" data-id="${i}" class="${v4.streak.practice>i?'completed':''}"><span>${i+1}</span><b>${x}</b><small>${v4.streak.practice>i?'✓ Complete':'Start'}</small></button>`).join('')}</div><p class="hint">Original concept: +200 XP after completing seven days. This preview demonstrates the progression locally.</p></div>`}

function p6FitnessTools(){return `<section class="p6-card"><div class="p6-header"><h2>🌿 My fitness tracking</h2><span class="p6-pill">${safe(s.goal.type==='gain'?'Weight gain':s.goal.type==='loss'?'Weight loss':'Everyday wellness')}</span></div><div class="p6-quick"><button data-a="log" data-id="meals"><strong>🍽️</strong> Log food</button><button data-a="log" data-id="weight"><strong>⚖️</strong> Update weight</button><button data-a="quickwater"><strong>💧</strong> Add water</button><button data-p6="diary"><strong>📔</strong> My food diary</button></div></section>`}
function p6Overview(){if(p6IsScan())return p6ScanOnly();return `<div class="hy-stack" style="gap:14px"><div class="p6-banner"><span><strong>${safe(p6ModeNames[p6.mode]||'Complete demo')}</strong><br><small>One app that adapts to what you use</small></span><button class="p6-inlinebtn" data-p6="experience">Compare views</button></div>${p6Header(p6ProfileName())}${p6Metrics()}${p6BodyComp()}${p6Extra()}${p6IsKiosk()?p6KioskTools():''}${p6IsFitness()?p6FitnessTools():''}<div class="p6-card"><div class="p6-header"><h2>📊 History and reports</h2></div><div class="p6-quick"><button data-p6="charts"><strong>⌁</strong> Health charts</button><button data-p6="reports"><strong>▤</strong> View reports</button></div></div><div class="p6-card"><div class="p6-header"><h2>⚙️ All health features</h2></div><p class="p6-desc">Find the complete set of advanced fitness, routines, streaks, recipes, reminders, charts, reports, and privacy tools in More. The Overview stays focused on data.</p><button class="p6-switch" data-p6="more">Explore all features →</button></div></div>`}
function p6ScanOnly(){return `<div class="p6-singleScan"><div class="p6-card"><div class="p6-headrow"><span class="p6-tagline">⚡ Scan-only experience</span>${p6DateBadge()}</div><h1 class="p6-title" style="margin-top:16px">Scan with Reliv</h1><p class="p6-desc">No account or fitness setup needed. Open your camera and scan a payment or health QR.</p><button class="p6-scancta" data-p6="scan">▣ Open scanner</button><div class="p6-guide" style="margin-top:11px">Payment checkout and activation codes are simulated in this preview. Real charges require a verified online checkout.</div></div><div class="p6-card"><h2 class="p6-title">Want a health dashboard later?</h2><p class="p6-desc">You can add fitness tracking or health-history features whenever you choose.</p><button class="p6-switch" data-p6="startSetup">Set up My Health →</button></div><button class="p6-switch" data-p6="experience">Preview other user experiences</button></div>`}
function p6ScanPage(){if(!p6IsScan())return hyScan();return `<div class="p6-stack"><div class="p6-card"><div class="p6-headrow"><span class="p6-tagline">◈ Just scan</span>${p6DateBadge()}</div><h1 class="p6-name" style="font-size:27px">Scan a Reliv QR</h1><p class="p6-desc">No signup, no profile, no fitness dashboard. You can use the scanner when you need it.</p><div class="p6-quick" style="margin-top:13px"><button data-a="hyPayment"><strong>◈</strong> Payment QR</button><button data-a="sampleScan"><strong>🩺</strong> Health QR</button></div><button class="p6-scancta" style="margin-top:13px" data-p6="camera">▣ Open camera</button></div><div class="p6-card"><details class="p6-category"><summary>How does scanning work?</summary><p class="p6-desc" style="padding:0 14px 14px">Point your camera at a Reliv code. A payment QR would open secure checkout; a health QR can import readings if you choose to create health history.</p></details></div><button class="p6-switch" data-p6="startSetup">I also want to track my health →</button><button class="p6-switch" data-p6="experience">Preview all four experiences</button></div>`}
function p6DailySeries(kind,field){const group={};for(const r of s.logs){if(r.kind!==kind)continue;group[r.date]=(group[r.date]||0)+Number(r[field]||0)}return Object.entries(group).filter(([day])=>day>=dateN(-hyRange+1)).sort((a,b)=>a[0].localeCompare(b[0])).map(([date,value])=>({date,value}))}
function p6Trend(name,series,unit){return `<article class="hy-chart-card"><div class="hy-chart-head"><b>${safe(name)}</b><span class="hy-chip gray">${series.length?p6Number(series.at(-1).value,0)+' '+unit:'No entries'}</span></div>${hySvgSeries(series,'#ff7900')}</article>`}
function p6Charts(){return `<div class="hy-stack"><div><div class="hy-eyebrow">HEALTH ANALYTICS · ${safe(p6ModeNames[p6.mode])}</div><h1 class="hy-h1">My charts</h1><p class="hy-desc">Only charts relevant to your chosen experience appear here. Fictional sample data for demonstration.</p></div><div class="hy-chips">${[7,14,30,90].map(n=>`<button class="hy-chip ${hyRange===n?'':'gray'}" data-a="hyRange" data-val="${n}" style="cursor:pointer">${n} days</button>`).join('')}</div>${hyChartCard('Weight history','weight','kg')}${p6IsFitness()?p6Trend('Daily calories',p6DailySeries('meals','calories'),'kcal'):''}${p6IsFitness()?p6Trend('Daily protein',p6DailySeries('meals','protein'),'g'):''}${p6IsFitness()?p6Trend('Water logged',p6DailySeries('water','value'),'ml'):''}${p6IsKiosk()?hyChartCard('Blood pressure','bp','mmHg','bp-dia'):''}${p6IsKiosk()?hyChartCard('Oxygen saturation','oxygen','%'):''}${p6IsKiosk()?hyChartCard('Resting heart rate','heart','bpm'):''}<button class="hy-btn outline" data-a="sub" data-id="history">See full measurement history</button></div>`}
function p6Snapshots(){const z=hySummary();const rows=[['⚖️ Weight',p6Number(z.weight,1)+' kg']];if(p6IsKiosk())rows.push(['🩺 Blood pressure',z.bp.sys+'/'+z.bp.dia+' mmHg'],['🫁 Oxygen',z.oxygen+'%'],['❤️ Pulse',z.heart+' bpm'],['🌡️ Temperature',p6Number(z.temperature,1)+' °C']);if(p6IsFitness())rows.push(['💧 Water',p6Number(z.water)+' ml'],['🍽️ Calories',p6Number(z.kcal)+' kcal'],['💪 Protein',p6Number(z.prot)+' g'],['👣 Steps',p6Number(hyGetNum('steps')||8300)],['😴 Sleep',p6Number(hyGetNum('sleep')||7.4,1)+' h']);return `<div class="p6-stack"><div class="p6-card"><div class="p6-header"><h2>My health snapshot</h2><span class="p6-pill">${safe(today())}</span></div><p class="p6-desc">Shown for ${safe(p6ModeNames[p6.mode])}. All readings are examples.</p><div class="p6-grid">${rows.map(([n,v])=>`<div class="p6-metric"><div class="p6-metric-title">${safe(n)}</div><div class="p6-metric-num" style="font-size:19px">${safe(v)}</div></div>`).join('')}</div></div>${p6IsFitness()?`<div class="p6-card"><div class="p6-header"><h2>My progress</h2><button data-a="goal" class="p6-inlinebtn">Edit goal</button></div><p class="p6-desc">${safe(hyGoalLabel())} · estimated ${safe(hyEta())}</p>${hySvgSeries(hyChartRecords('weight').map(x=>({...x,value:Number(x.value)})))}</div>`:''}</div>`}
function p6ProfilePicker(){return `<section class="p6-card"><div class="p6-header"><h2>🧩 Preview user experiences</h2><span class="p6-demo">DESIGN TEST</span></div><p class="p6-desc">Switch between scenarios to see how the <b>same PWA</b> changes. All sample records are preserved.</p><div class="p6-choices">${[
 ['scan','◈','Scan only','Just QR payments or health scans, no profile required'],
 ['fitness','🏋️','Fitness only','Never used a kiosk; food, body goals and habits'],
 ['kiosk','🩺','Kiosk health tracking','Vitals, scans and reports without meal tracking'],
 ['combined','✨','Fitness + kiosk','Everything together, including imported readings']
 ].map(([v,ic,n,desc])=>`<button class="p6-mode ${p6.mode===v?'on':''}" data-p6="selectMode" data-mode="${v}"><i>${ic}</i><span><b>${n}</b><small>${desc}</small></span><span style="margin-left:auto;color:#d57428">${p6.mode===v?'✓':'›'}</span></button>`).join('')}</div><button class="p6-switch" data-p6="restart">Replay first-launch setup</button></section>`}
function p6More(){const base=hyMore().replace('Faizan',safe(p6ProfileName()));return `<div class="p6-stack">${p6ProfilePicker()}${p6IsScan()?`<section class="p6-card"><h2 class="p6-title">Your account is optional</h2><p class="p6-desc">You can continue scanning without adding your name or fitness data.</p><button class="p6-scancta" data-p6="scan">Open scanner</button></section>`:base}<div class="p6-card"><div class="p6-header"><h2>📱 Simple display controls</h2></div><p class="p6-desc">Use Display & settings for larger text, accessible navigation, privacy and language choices.</p><button class="p6-inlinebtn" data-a="settings">Display & accessibility</button></div></div>`}
function p6Nav(){const ico={overview:'⌂',diary:'▤',scan:'⌗',ai:'✧',more:'⋯'};const tabs=p6IsScan()?[['scan','Scan'],['more','More']]:p6.mode==='kiosk'?[['overview','Overview'],['scan','Scan'],['ai','AI'],['more','More']]:[['overview','Overview'],['diary','Diary'],['scan','Scan'],['ai','AI'],['more','More']];q('nav').classList.toggle('p6-simplenav',p6IsScan());q('nav').style.justifyContent=p6IsScan()?'center':'';q('nav').style.gap=p6IsScan()?'24px':'';for(const sel of ['.hy-toplog','.headshop']){const x=document.querySelector(sel);if(x)x.style.display=p6IsScan()?'none':'';}q('nav').innerHTML=tabs.map(([id,label])=>`<button type="button" data-a="hyNav" data-id="${id}" class="${tab===id?'active':''} ${id==='scan'?'hy-center':''}" aria-label="${label}">${id==='scan'?`<span class="hy-scan-icon">${ico[id]}</span>`:`<span class="navicon">${ico[id]}</span>`}<span>${label}</span></button>`).join('')}
function p6Onboard(){const stage=p6.phase||'welcome',options=`<button class="p6-mode" data-p6="onboardScan"><i>▣</i><span><b>Scan Now</b><small>Open the QR scanner instantly. No account or setup.</small></span><span style="color:#dc750e">›</span></button><button class="p6-mode" data-p6="onboardSetup"><i>♥</i><span><b>Set Up My Health</b><small>Enter your name, then choose what you want to track.</small></span><span style="color:#dc750e">›</span></button>`;
let middle=stage==='welcome'?`<span class="p6-tagline">ONE APP · ADAPTS TO YOU</span><h1>What would you like to do?</h1><p>Just scan a QR, or set up your personal health dashboard. You can change this later.</p><div class="p6-choices">${options}</div><button class="p6-switch" data-p6="onboardDemo">Explore the complete filled demo →</button>`:stage==='name'?`<span class="p6-tagline">STEP 1 OF 2</span><h1>Your health, your way.</h1><p>What should Reliv call you? You can edit it later.</p><label class="p6-field">Your name<input id="p6Name" maxlength="40" placeholder="Your name" value="${safe(p6.name)}" autocomplete="given-name"></label><button class="p6-big" style="margin-top:15px" data-p6="onboardNext">Continue →</button><button class="p6-switch" data-p6="onboardBack">← Back</button>`:`<span class="p6-tagline">STEP 2 OF 2</span><h1>What would you like to use?</h1><p>Choose both or either option. Reliv will only show relevant sections, and you can turn them on later.</p><div class="p6-choices"><button class="p6-mode ${p6.usedKiosk?'on':''}" data-p6="toggleKiosk"><i>🩺</i><span><b>I have used a Reliv kiosk</b><small>Show kiosk readings, reports, BP, oxygen and pulse</small></span><b style="margin-left:auto;color:#ce671c">${p6.usedKiosk?'✓':'○'}</b></button><button class="p6-mode ${p6.trackFitness?'on':''}" data-p6="toggleFitness"><i>🏋️</i><span><b>I want fitness tracking</b><small>Food, protein, water, weight goals and activity</small></span><b style="margin-left:auto;color:#ce671c">${p6.trackFitness?'✓':'○'}</b></button></div><button class="p6-big" style="margin-top:15px" data-p6="onboardFinish">Open My Health →</button><button class="p6-switch" data-p6="onboardBack">← Back</button>`;
return `<div class="p6-overlay" id="p6Overlay" role="dialog" aria-modal="true" aria-label="Reliv Care setup"><div class="p6-onboard"><div class="p6-headrow"><span class="p6-tagline">reliv care ✳</span><span style="font-size:11px;color:#8b7a6b">Preview mode</span></div>${middle}<p class="p6-foot" style="margin-top:17px">This is a demonstration with fictional readings. No real payments or personal health data are collected.</p></div></div>`}
function p6ApplyMode(mode){p6.mode=mode;p6.onboarding=false;p6.phase='welcome';p6Save();modal='';hyView='dashboard';screen='main';tab=mode==='scan'?'scan':'overview';p6Render();window.scrollTo({top:0,behavior:'instant'})}
const p6OldRender=render,p6OldPage=page,p6OldNav=nav;
nav=function(){p6Nav()};
render=function(){if(screen!=='main'){p6OldRender();}else{document.documentElement.classList.toggle('dark',s.prefs.theme==='dark');document.documentElement.classList.toggle('large-text',!!s.prefs.largeText);if(tab==='overview'||tab==='health'){q('content').innerHTML=p6IsScan()?p6ScanOnly():`<div class="hy-tabs" role="tablist" aria-label="Overview sections">${[['dashboard','Dashboard'],['charts','Charts'],['reports','Reports'],['snapshots','Snapshots']].map(([id,name])=>`<button role="tab" aria-selected="${hyView===id}" class="${hyView===id?'on':''}" data-a="hyOverviewTab" data-id="${id}">${name}</button>`).join('')}</div>${hyView==='dashboard'?p6Overview():hyView==='charts'?p6Charts():hyView==='reports'?p6IsKiosk()?hyReports():p6FitnessReports():p6Snapshots()}`;}else if(tab==='diary'){q('content').innerHTML=p6IsFitness()?hyDiary():p6ScanOnly()}else if(tab==='scan'){q('content').innerHTML=p6ScanPage()}else if(tab==='more'){q('content').innerHTML=p6More()}else q('content').innerHTML=hyAI();nav();renderModal();}const old=q('p6Overlay');if(old)old.remove();if(p6.onboarding){document.body.insertAdjacentHTML('beforeend',p6Onboard());}}
function p6FitnessReports(){return `<div class="p6-stack"><div class="p6-card"><h1 class="p6-title">My fitness summaries</h1><p class="p6-desc">No kiosk visit is needed. Your diary and weight measurements create personal summaries; kiosk vitals remain optional.</p><div class="p6-quick"><button data-p6="diary"><strong>🍽️</strong> Food diary</button><button data-p6="charts"><strong>📈</strong> Weight trends</button></div></div><div class="p6-card"><h2 class="p6-title">Kiosk health reports</h2><p class="p6-desc">No kiosk scans in this fitness-only experience. If you ever visit a Reliv kiosk, you can choose to import its readings through Scan.</p><button class="p6-inlinebtn" data-p6="scan">Open scanner</button></div></div>`}
page=function(id){if(p6IsScan()&&['overview','diary','ai'].includes(id)){p6.onboarding=true;p6.phase='name';p6Save();render();return}if(p6.mode==='kiosk'&&id==='diary'){p6.onboarding=true;p6.phase='options';p6Save();render();return}p6OldPage(id)};
function p6Render(){render()}
/* These actions do not interfere with existing functional logging, AI, scanner and Store handlers. */
document.addEventListener('click',ev=>{const node=ev.target.closest('[data-p6]');if(!node)return;ev.preventDefault();ev.stopImmediatePropagation();const a=node.dataset.p6;
 if(a==='experience'){modal='';screen='main';tab='more';p6Render();return}
 if(a==='selectMode'){p6ApplyMode(node.dataset.mode);return}
 if(a==='restart'){p6.onboarding=true;p6.phase='welcome';p6Save();p6Render();return}
 if(a==='startSetup'){p6.onboarding=true;p6.phase='name';p6.trackFitness=true;p6Save();p6Render();return}
 if(a==='onboardScan'){p6ApplyMode('scan');return}
 if(a==='onboardSetup'){p6.phase='name';p6Render();return}
 if(a==='onboardDemo'){p6.name=p6.name||'Faizan';p6ApplyMode('combined');return}
 if(a==='onboardBack'){p6.phase=p6.phase==='options'?'name':'welcome';p6Render();return}
 if(a==='onboardNext'){const nm=document.getElementById('p6Name')?.value.trim();if(!nm){pop('Enter your name, or choose Scan Now to skip setup.');return}p6.name=nm;p6.phase='options';p6Render();return}
 if(a==='toggleKiosk'){p6.usedKiosk=!p6.usedKiosk;p6Render();return}
 if(a==='toggleFitness'){p6.trackFitness=!p6.trackFitness;p6Render();return}
 if(a==='onboardFinish'){if(!p6.usedKiosk&&!p6.trackFitness){p6ApplyMode('scan');return}p6ApplyMode(p6.usedKiosk?(p6.trackFitness?'combined':'kiosk'):'fitness');return}
 if(a==='charts'||a==='reports'||a==='diary'||a==='more'){p6Jump(a);return}
 if(a==='scan'){if(tab==='scan'){document.querySelector('.hy-compact-details')?.setAttribute('open','');}else page('scan');return}
 if(a==='camera'){const el=document.querySelector('.p6-singleScan');if(el){p6.onboarding=false;const old=q('p6Overlay');if(old)old.remove();}modal='';const oldScanner=originalScanner();q('content').innerHTML=`<div class="p6-card"><div class="p6-header"><h2>Live camera scanner</h2><button class="p6-inlinebtn" data-p6="backScan">Back</button></div>${oldScanner}</div>`;return}
 if(a==='backScan'){page('scan');return}
 if(a==='goal'){modal='goal';renderModal();return}
 if(a==='quickwater'){const e=getClick(node);if(e){/* handled by other existing action */}log('water',250);render();return}
},true);
/* Set first-launch to the choice screen without changing or deleting seeded fictional health data. */
if(p6.mode==='choose'){p6.onboarding=true;p6.phase='welcome';}

if(!s.initialized && !s.sample && !s.logs.length && !s.store?.requests?.length){sampleData(true)}else{for(const m of Object.keys(MODULES)){if(!s.modules.includes(m))s.modules.push(m)}save();render()}
/* Isolated adaptive preview service worker; does not control kiosk routes. */
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
})();
</script></body></html>

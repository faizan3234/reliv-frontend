name: Kiosk logic and build
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:commerce
      - run: npm run build
      - run: npm ci
        working-directory: customer-web
      - run: npm run build
        working-directory: customer-web
